<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جغرافيا العظمى | 1000 مستوى</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            min-height: 100vh;
            transition: all 0.4s ease;
        }

        /* الثيمات الخمسة */
        body.theme-paper {
            background: #e8d6b5;
            background-image: repeating-linear-gradient(45deg, #c4a48420 0px, #c4a48420 15px, #b5926a20 15px, #b5926a20 30px);
            color: #3d2b1a;
        }
        body.theme-paper .game-card {
            background: #f5e6d3;
            border: 6px solid #8b5a2b;
            border-radius: 40px 10px 40px 10px;
            box-shadow: 12px 12px 0 #5d3a1a;
        }
        body.theme-paper .stat-bar {
            background: #f5e6d3;
            border: 4px solid #8b5a2b;
            border-radius: 60px 20px 60px 20px;
            box-shadow: 8px 8px 0 #5d3a1a;
        }
        body.theme-paper .level-node {
            background: #f5e6d3;
            border: 4px solid #8b5a2b;
            border-radius: 30px 5px 30px 5px;
            box-shadow: 8px 8px 0 #5d3a1a;
        }
        body.theme-paper .active-node {
            border-color: #c99c00;
            box-shadow: 0 0 0 4px #ffd700, 8px 8px 0 #5d3a1a;
        }
        body.theme-paper .option-btn {
            background: #ecdbba;
            border: 3px solid #8b5a2b;
            border-radius: 50px 10px 50px 10px;
            box-shadow: 5px 5px 0 #5d3a1a;
        }

        body.theme-modern {
            background: linear-gradient(135deg, #1e1e2f, #2d2d44);
            color: #e0e0ff;
        }
        body.theme-modern .game-card {
            background: #2d2d44;
            border: 2px solid #6d6d9e;
            border-radius: 25px;
            box-shadow: 0 15px 25px #00000080;
        }
        body.theme-modern .stat-bar {
            background: #2d2d44;
            border: 2px solid #6d6d9e;
            border-radius: 40px;
            box-shadow: 0 8px 0 #1a1a2e;
        }
        body.theme-modern .level-node {
            background: #2d2d44;
            border: 2px solid #6d6d9e;
            border-radius: 20px;
            box-shadow: 0 8px 0 #1a1a2e;
        }
        body.theme-modern .active-node {
            border-color: #ffd966;
            box-shadow: 0 0 20px #ffd966, 0 8px 0 #1a1a2e;
        }
        body.theme-modern .option-btn {
            background: #3a3a5a;
            border: 2px solid #6d6d9e;
            border-radius: 15px;
            box-shadow: 0 6px 0 #1a1a2e;
        }

        body.theme-nature {
            background: #1b4d1b;
            color: #f0f7e0;
        }
        body.theme-nature .game-card {
            background: #2d6a2d;
            border: 4px solid #8b4513;
            border-radius: 60px 60px 20px 20px;
            box-shadow: 0 12px 0 #4a2c1a;
        }
        body.theme-nature .stat-bar {
            background: #2d6a2d;
            border: 4px solid #8b4513;
            border-radius: 40px 40px 10px 10px;
            box-shadow: 0 8px 0 #4a2c1a;
        }
        body.theme-nature .level-node {
            background: #2d6a2d;
            border: 4px solid #8b4513;
            border-radius: 30px 30px 10px 10px;
            box-shadow: 0 8px 0 #4a2c1a;
        }
        body.theme-nature .option-btn {
            background: #3b7a3b;
            border: 3px solid #a0522d;
            border-radius: 30px 30px 10px 10px;
            box-shadow: 0 6px 0 #4a2c1a;
        }

        body.theme-desert {
            background: #d4a373;
            color: #442f1f;
        }
        body.theme-desert .game-card {
            background: #f8f0e5;
            border: 6px solid #b97c4b;
            border-radius: 80px 20px 80px 20px;
            box-shadow: 12px 12px 0 #8b5a2b;
        }
        body.theme-desert .stat-bar {
            background: #f8f0e5;
            border: 4px solid #b97c4b;
            border-radius: 60px 20px 60px 20px;
            box-shadow: 8px 8px 0 #8b5a2b;
        }
        body.theme-desert .level-node {
            background: #f8f0e5;
            border: 4px solid #b97c4b;
            border-radius: 40px 10px 40px 10px;
            box-shadow: 8px 8px 0 #8b5a2b;
        }
        body.theme-desert .option-btn {
            background: #ffebc0;
            border: 3px solid #c48b56;
            border-radius: 40px 10px 40px 10px;
            box-shadow: 5px 5px 0 #8b5a2b;
        }

        body.theme-ocean {
            background: #0a3847;
            color: #e0f2fe;
        }
        body.theme-ocean .game-card {
            background: #1e5a7a;
            border: 4px solid #7fd1e0;
            border-radius: 40px 40px 80px 80px;
            box-shadow: 0 12px 0 #0a2f3a;
        }
        body.theme-ocean .stat-bar {
            background: #1e5a7a;
            border: 3px solid #7fd1e0;
            border-radius: 40px;
            box-shadow: 0 8px 0 #0a2f3a;
        }
        body.theme-ocean .level-node {
            background: #1e5a7a;
            border: 3px solid #7fd1e0;
            border-radius: 30px 30px 60px 60px;
            box-shadow: 0 8px 0 #0a2f3a;
        }
        body.theme-ocean .option-btn {
            background: #154a63;
            border: 3px solid #7fd1e0;
            border-radius: 30px 30px 50px 50px;
            box-shadow: 0 6px 0 #0a2f3a;
        }

        /* العناصر المشتركة */
        .settings-bar {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 100;
        }

        .settings-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .settings-btn:hover {
            transform: scale(1.1);
        }

        .settings-panel {
            position: fixed;
            top: 80px;
            right: 15px;
            width: 280px;
            padding: 25px;
            border-radius: 30px;
            z-index: 100;
            display: none;
        }

        .settings-panel.show {
            display: block;
        }

        .settings-section {
            margin-bottom: 25px;
        }

        .settings-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .theme-option {
            aspect-ratio: 1;
            border-radius: 15px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(255, 255, 255, 0.2);
        }

        .theme-option.active {
            border-color: gold;
            transform: scale(1.1);
        }

        .sound-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.1);
            padding: 12px 20px;
            border-radius: 40px;
        }

        .sound-toggle {
            width: 60px;
            height: 30px;
            border-radius: 30px;
            background: rgba(255,255,255,0.2);
            position: relative;
            cursor: pointer;
            transition: 0.2s;
        }

        .sound-toggle.on {
            background: #4caf50;
        }

        .sound-toggle::after {
            content: '';
            position: absolute;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: white;
            top: 2px;
            left: 2px;
            transition: 0.2s;
        }

        .sound-toggle.on::after {
            left: 32px;
        }

        .stat-bar {
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            max-width: 600px;
            margin: 0 auto;
            padding: 15px 30px;
            border-radius: 60px;
            display: flex;
            justify-content: space-between;
            z-index: 99;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .levels-container {
            position: fixed;
            top: 100px;
            bottom: 0;
            left: 0;
            right: 0;
            overflow-y: auto;
            padding: 20px 10px 40px;
            scroll-behavior: smooth;
        }

        .levels-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }

        .level-node {
            width: 130px;
            min-height: 130px;
            margin: 5px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
            padding: 15px;
        }

        .level-node[data-align="left"] { transform: translateX(-60px); }
        .level-node[data-align="right"] { transform: translateX(60px); }

        .level-node.completed {
            opacity: 0.9;
        }

        .level-node.locked {
            opacity: 0.5;
            filter: grayscale(0.7);
            cursor: not-allowed;
        }

        .level-number {
            font-size: 2.5rem;
            font-weight: 900;
            line-height: 1;
        }

        .level-stars {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .star {
            font-size: 1.2rem;
            color: gold;
        }

        .star.empty {
            color: rgba(255, 215, 0, 0.2);
        }

        .challenge-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .game-card {
            width: 90%;
            max-width: 650px;
            padding: 30px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .category-badge {
            padding: 8px 25px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.2);
        }

        .question-stars {
            display: flex;
            gap: 10px;
        }

        .question-star {
            font-size: 2rem;
            color: gold;
            opacity: 0.3;
        }

        .question-star.active {
            opacity: 1;
        }

        .flag-display {
            font-size: 7rem;
            text-align: center;
            margin: 20px 0;
            filter: drop-shadow(5px 10px 10px rgba(0,0,0,0.3));
        }

        .question-text {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            margin: 30px 0;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 25px 0;
        }

        .option-btn {
            padding: 18px;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: 0.1s;
        }

        .option-btn.correct { 
            background: #4caf50 !important; 
            border-color: #fff !important; 
            box-shadow: 0 0 20px #4caf50 !important;
        }
        .option-btn.wrong { 
            background: #f44336 !important; 
            border-color: #fff !important;
            box-shadow: 0 0 20px #f44336 !important;
        }
        .option-btn:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
        }

        .timer-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-size: 1.3rem;
            margin-top: 20px;
            padding: 15px;
            border-radius: 60px;
            background: rgba(0, 0, 0, 0.2);
        }

        .timer-clock {
            font-family: monospace;
            font-size: 2rem;
            font-weight: 700;
            padding: 5px 25px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.3);
        }

        .results-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .results-card {
            width: 90%;
            max-width: 600px;
            padding: 30px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .result-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            margin: 10px 0;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
        }

        .result-icon {
            font-size: 2rem;
            min-width: 50px;
            text-align: center;
        }

        .result-question {
            flex: 1;
            font-size: 1.1rem;
        }

        .result-answer {
            font-weight: 700;
            color: #4caf50;
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 30px;
        }

        .continue-btn {
            width: 100%;
            padding: 18px;
            font-size: 1.3rem;
            font-weight: 700;
            margin-top: 25px;
            cursor: pointer;
            background: gold;
            border: none;
            border-radius: 60px;
            color: #1a1a2e;
            transition: 0.2s;
        }

        .continue-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px gold;
        }

        .toast {
            position: fixed;
            top: 120px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            padding: 15px 40px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.2rem;
            z-index: 3000;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: 2px solid gold;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
            .level-node { width: 100px; min-height: 100px; }
            .level-node[data-align="left"] { transform: translateX(-30px); }
            .level-node[data-align="right"] { transform: translateX(30px); }
            .level-number { font-size: 2rem; }
            .stat-bar { font-size: 1rem; padding: 10px 20px; }
        }
    </style>
</head>
<body class="theme-modern">
    <div class="settings-bar">
        <div class="settings-btn" onclick="toggleSettings()">⚙️</div>
    </div>

    <div class="settings-panel game-card" id="settingsPanel">
        <h3 style="text-align: center; margin-bottom: 20px;">⚙️ الإعدادات</h3>

            <div class="settings-title">🎨 الثيمات</div>
            <div class="theme-grid">

                <div class="theme-option" onclick="changeTheme('ocean')" title="محيطي">🌊</div>

            </div>
        </div>

        <div class="settings-section">
            <div class="settings-title">ℹ️ عن اللعبة</div>

                <span style="font-size: 0.9rem;">© 2026</span>

    <div class="stat-bar" id="statBar">

    <div class="levels-container" id="levelsContainer">

            <div class="flag-display" id="flagDisplay" style="display: none;"></div>
            
            <div class="question-text" id="questionText"></div>
            
            <div class="options-grid" id="optionsGrid"></div>
            
            <div class="timer-area">

        </div>

        <div class="results-card game-card">
            <h2 style="text-align: center; margin-bottom: 20px;">📊 نتيجة المستوى</h2>
            <div id="resultsList"></div>
            <button class="continue-btn" onclick="continueToNext()">متابعة</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    { level: 4, step: 2, cat: "🇧🇪 أعلام", q: "🇧🇪 لأي دولة هذا العلم؟", a: "بلجيكا", opts: ["بلجيكا", "فرنسا", "ألمانيا", "هولندا"] },

            // ==================== نظام اللعبة ====================
            class GeoGame {
                constructor() {
                    this.currentLevel = parseInt(localStorage.getItem('geo_level')) || 1;
                    this.totalPoints = parseInt(localStorage.getItem('geo_points')) || 0;
                    this.streak = parseInt(localStorage.getItem('geo_streak')) || 0;
                    this.soundEnabled = localStorage.getItem('geo_sound') !== 'off';
                    
                    this.currentStep = 0;
                    this.timeLeft = 15;
                    this.timer = null;
                    this.answers = [];
                    
                    // تحميل النجوم المحفوظة (عدد الإجابات الصحيحة لكل مستوى)
                    this.levelStars = JSON.parse(localStorage.getItem('geo_stars')) || {};
                    
                    this.init();
                }

                init() {
                    this.buildLevels();
                    this.updateStats();
                    this.scrollToCurrentLevel();
                    this.updateSoundToggle();
                }

                getQuestionsForLevel(level) {
                    return QUESTION_BANK.filter(q => q.level === level).sort((a, b) => a.step - b.step);
                }

                buildLevels() {
                    const grid = document.getElementById('levelsGrid');
                    grid.innerHTML = '';
                    
                    for (let i = 1000; i >= 1; i--) {
                        const node = document.createElement('div');
                        node.className = `level-node`;
                        node.setAttribute('data-align', i % 2 === 0 ? 'left' : 'right');
                        
                        // إزالة completed وإضافة فتح جميع المستويات السابقة
                        if (i < this.currentLevel) {
                            node.classList.add('completed');
                        }
                        
                        if (i === this.currentLevel) {
                            node.classList.add('active-node');
                        }
                        
                        // المستويات المفتوحة هي كل المستويات حتى currentLevel
                        if (i > this.currentLevel) {
                            node.classList.add('locked');
                        }
                        
                        // عرض النجوم حسب الإجابات الصحيحة
                        const stars = this.levelStars[i] || 0;
                        
                        node.innerHTML = `
                            <span class="level-number">${i}</span>
                            <div class="level-stars">
                                ${Array(3).fill(0).map((_, idx) => 
                                    `<span class="star ${idx < stars ? '' : 'empty'}">⭐</span>`
                                ).join('')}
                            </div>
                        `;
                        
                        // يمكن الدخول إلى أي مستوى مفتوح (أقل من أو يساوي currentLevel)
                        if (i <= this.currentLevel) {
                            node.onclick = () => this.openLevel(i);
                        }
                        
                        grid.appendChild(node);
                    }
                }

                scrollToCurrentLevel() {
                    setTimeout(() => {
                        const levels = document.querySelectorAll('.level-node');
                        const index = 1000 - this.currentLevel;
                        if (levels[index]) {
                            levels[index].scrollIntoView({ behavior: 'auto', block: 'center' });
                        }
                    }, 200);
                }

                openLevel(level) {
                    // يمكن فتح أي مستوى أقل من أو يساوي currentLevel
                    if (level > this.currentLevel) return;
                    
                    // إذا كان المستوى له نجوم محفوظة، نعرضها في الواجهة
                    const savedStars = this.levelStars[level] || 0;
                    
                    this.levelQuestions = this.getQuestionsForLevel(level);
                    this.currentStep = 0;
                    this.timeLeft = 15;
                    this.answers = [];
                    
                    document.getElementById('challengeModal').style.display = 'flex';
                    this.showQuestion(0);
                }

                showQuestion(step) {
                    const stars = document.querySelectorAll('.question-star');
                    stars.forEach((s, i) => {
                        if (i < step) s.classList.add('active');
                        else s.classList.remove('active');
                    });
                    
                    const q = this.levelQuestions[step];
                    
                    document.getElementById('questionCategory').textContent = q.cat;
                    document.getElementById('flagDisplay').style.display = 'none';
                    document.getElementById('questionText').textContent = q.q;
                    
                    const optionsContainer = document.getElementById('optionsGrid');
                    optionsContainer.innerHTML = '';
                    
                    // خلط الخيارات
                    const shuffledOpts = [...q.opts].sort(() => Math.random() - 0.5);
                    
                    shuffledOpts.forEach(opt => {
                        const btn = document.createElement('div');
                        btn.className = 'option-btn';
                        btn.textContent = opt;
                        btn.onclick = () => this.checkAnswer(opt === q.a, btn, q);
                        optionsContainer.appendChild(btn);
                    });
                    
                    this.startTimer();
                }

                checkAnswer(isCorrect, btn, question) {
                    clearInterval(this.timer);
                    
                    document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
                    
                    this.answers.push({
                        question: question.q,
                        userAnswer: btn.textContent,
                        correctAnswer: question.a,
                        isCorrect: isCorrect
                    });
                    
                    if (isCorrect) {
                        btn.classList.add('correct');
                        this.streak++;
                        
                        const timeBonus = Math.floor(this.timeLeft);
                        const points = 50 + timeBonus + (this.streak * 5);
                        this.totalPoints += points;
                        
                        localStorage.setItem('geo_points', this.totalPoints);
                        localStorage.setItem('geo_streak', this.streak);
                        
                        this.playSound('correct');
                        this.showMessage(`✅ +${points} نقطة`);
                        
                    } else {
                        btn.classList.add('wrong');
                        this.streak = 0;
                        localStorage.setItem('geo_streak', 0);
                        
                        this.playSound('wrong');
                        this.showMessage('❌ خطأ');
                    }
                    
                    this.updateStats();
                    
                    setTimeout(() => {
                        this.currentStep++;
                        
                        if (this.currentStep < 3) {
                            this.showQuestion(this.currentStep);
                        } else {
                            this.completeLevel();
                        }
                    }, 800);
                }

                startTimer() {
                    if (this.timer) clearInterval(this.timer);
                    
                    this.timeLeft = 15;
                    const timerEl = document.getElementById('timerDisplay');
                    
                    this.timer = setInterval(() => {
                        this.timeLeft = Math.max(0, this.timeLeft - 0.1);
                        timerEl.textContent = this.timeLeft.toFixed(1);
                        
                        if (this.timeLeft <= 0) {
                            clearInterval(this.timer);
                            this.timeout();
                        }
                    }, 100);
                }

                timeout() {
                    const currentQ = this.levelQuestions[this.currentStep];
                    
                    this.answers.push({
                        question: currentQ.q,
                        userAnswer: "لم يتم الإجابة",
                        correctAnswer: currentQ.a,
                        isCorrect: false
                    });
                    
                    this.playSound('wrong');
                    this.showMessage('⏰ انتهى الوقت');
                    
                    this.streak = 0;
                    localStorage.setItem('geo_streak', 0);
                    
                    document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
                    
                    setTimeout(() => {
                        this.currentStep++;
                        
                        if (this.currentStep < 3) {
                            this.showQuestion(this.currentStep);
                        } else {
                            this.completeLevel();
                        }
                    }, 1000);
                    
                    this.updateStats();
                }

                completeLevel() {
                    // حساب عدد الإجابات الصحيحة (0-3)
                    const correctCount = this.answers.filter(a => a.isCorrect).length;
                    
                    // حفظ النجوم (عدد الإجابات الصحيحة فقط)
                    this.levelStars[this.currentLevel] = correctCount;
                    localStorage.setItem('geo_stars', JSON.stringify(this.levelStars));
                    
                    // مكافأة النقاط حسب عدد الإجابات الصحيحة
                    const levelBonus = correctCount * 100;
                    this.totalPoints += levelBonus;
                    
                    // فتح المستوى التالي إذا أجاب على سؤالين على الأقل
                    if (correctCount >= 2 && this.currentLevel < 1000) {
                        this.currentLevel++;
                        localStorage.setItem('geo_level', this.currentLevel);
                    }
                    
                    localStorage.setItem('geo_points', this.totalPoints);
                    
                    this.showResults();
                }

                showResults() {
                    const resultsList = document.getElementById('resultsList');
                    resultsList.innerHTML = '';
                    
                    this.answers.forEach((ans, i) => {
                        const div = document.createElement('div');
                        div.className = 'result-item';
                        div.innerHTML = `
                            <div class="result-icon">${ans.isCorrect ? '✅' : '❌'}</div>
                            <div class="result-question">${ans.question}</div>
                            <div class="result-answer">${ans.correctAnswer}</div>
                        `;
                        resultsList.appendChild(div);
                    });
                    
                    document.getElementById('challengeModal').style.display = 'none';
                    document.getElementById('resultsModal').style.display = 'flex';
                    
                    this.playSound('levelup');
                }

                closeResults() {
                    document.getElementById('resultsModal').style.display = 'none';
                    this.buildLevels(); // إعادة بناء المستويات لتحديث النجوم
                    this.updateStats();
                    this.scrollToCurrentLevel();
                }

                showMessage(text) {
                    const toast = document.getElementById('toast');
                    toast.textContent = text;
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 2000);
                }

                playSound(type) {
                    if (!this.soundEnabled) return;
                    
                    const sounds = {
                        correct: 800,
                        wrong: 300,
                        levelup: 1200
                    };
                    
                    try {
                        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        const oscillator = audioCtx.createOscillator();
                        const gainNode = audioCtx.createGain();
                        
                        oscillator.type = 'sine';
                        oscillator.frequency.value = sounds[type] || 600;
                        gainNode.gain.value = 0.1;
                        
                        oscillator.connect(gainNode);
                        gainNode.connect(audioCtx.destination);
                        
                        oscillator.start();
                        oscillator.stop(audioCtx.currentTime + 0.2);
                    } catch(e) {}
                }

                updateStats() {
                    document.getElementById('levelDisplay').textContent = this.currentLevel;
                    document.getElementById('pointsDisplay').textContent = this.totalPoints;
                    document.getElementById('streakDisplay').textContent = this.streak;
                }

                updateSoundToggle() {
                    const toggle = document.getElementById('soundToggle');
                    if (this.soundEnabled) {
                        toggle.classList.add('on');
                    } else {
                        toggle.classList.remove('on');
                    }
                }
            }

            // ==================== الدوال العامة ====================
            window.toggleSettings = function() {
                document.getElementById('settingsPanel').classList.toggle('show');
            };

            window.toggleSound = function() {
                game.soundEnabled = !game.soundEnabled;
                localStorage.setItem('geo_sound', game.soundEnabled ? 'on' : 'off');
                game.updateSoundToggle();
            };

            window.changeTheme = function(theme) {
                document.body.className = `theme-${theme}`;
                localStorage.setItem('geo_theme', theme);
                
                document.querySelectorAll('.theme-option').forEach(el => el.classList.remove('active'));
                event.currentTarget.classList.add('active');
                // لا نغلق القائمة تلقائياً
            };

            window.continueToNext = function() {
                game.closeResults();
            };

            // تحميل الإعدادات المحفوظة
            const savedTheme = localStorage.getItem('geo_theme') || 'modern';
            document.body.className = `theme-${savedTheme}`;

            // بدء اللعبة
            const game = new GeoGame();
            window.game = game;
        })();
    </script>
</body>
</html>
