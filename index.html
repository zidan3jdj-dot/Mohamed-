<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>رحلة الجغرافيا | تحدّي المعرفة</title>
    <meta name="theme-color" content="#1a472a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a2f1f;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية متحركة */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(30,80,50,0.4) 0%, rgba(10,40,25,0.8) 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== شاشة البداية ===== */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #0a3a22, #052015);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.8s ease;
        }

        .splash-content {
            text-align: center;
            animation: splashPulse 1s ease;
        }

        @keyframes splashPulse {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .splash-logo {
            font-size: 6rem;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .splash-title {
            font-size: 2.8rem;
            font-weight: 800;
            color: #ffd966;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .splash-subtitle {
            color: rgba(255,245,200,0.9);
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .loading-container {
            margin-top: 40px;
        }

        .loading-bar {
            width: 280px;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            overflow: hidden;
            margin: 0 auto;
        }

        .loading-progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ffd966, #ffb347);
            border-radius: 20px;
            transition: width 0.2s ease;
        }

        .loading-text {
            color: rgba(255,245,200,0.7);
            font-size: 0.85rem;
            margin-top: 12px;
        }

        /* ===== شاشة الترحيب ===== */
        .intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a472a, #0a2a1a);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9000;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .intro-card {
            background: linear-gradient(145deg, #fff8e7, #fff0d0);
            border-radius: 80px;
            padding: 45px 35px;
            max-width: 420px;
            width: 88%;
            text-align: center;
            box-shadow: 0 30px 50px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.5);
            animation: introSlideUp 0.7s ease;
        }

        @keyframes introSlideUp {
            from { opacity: 0; transform: translateY(60px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .intro-icon {
            font-size: 5rem;
            margin-bottom: 15px;
        }

        .intro-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #2d5a3b;
            margin-bottom: 12px;
        }

        .intro-desc {
            color: #6b4c2c;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .intro-stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .intro-stat {
            background: linear-gradient(135deg, #f5e6d3, #ecd9c0);
            border-radius: 50px;
            padding: 15px 20px;
            flex: 1;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.05), 0 5px 10px rgba(0,0,0,0.1);
        }

        .intro-stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #d48c2c;
        }

        .intro-stat-label {
            font-size: 0.75rem;
            color: #8b6946;
            font-weight: 600;
        }

        .start-btn {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border: none;
            border-radius: 60px;
            padding: 18px 40px;
            font-size: 1.3rem;
            font-weight: 800;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 20px rgba(230,126,34,0.4);
            width: 100%;
            letter-spacing: 1px;
        }

        .start-btn:active {
            transform: scale(0.97);
            box-shadow: 0 4px 10px rgba(230,126,34,0.4);
        }

        /* ===== شريط النقاط ===== */
        .stats-bar {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(15px);
            border-radius: 50px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            margin: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,215,0,0.3);
            position: relative;
            z-index: 10;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.5);
            padding: 8px 18px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
        }

        .stat-icon {
            font-size: 1.3rem;
        }

        .stat-value {
            font-weight: 800;
            font-size: 1.2rem;
            color: #ffd966;
        }

        .stat-label {
            color: #ddd;
            font-size: 0.8rem;
        }

        /* ===== خريطة المستويات - تصميم جديد ===== */
        .levels-container {
            margin: 10px 15px 20px;
            height: calc(100vh - 110px);
            overflow-y: auto;
            position: relative;
            z-index: 5;
        }

        .map-background {
            position: relative;
            min-height: 100%;
            padding: 20px 0;
        }

        .levels-path {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .levels-path::before {
            content: '';
            position: absolute;
            top: 50px;
            bottom: 50px;
            width: 4px;
            background: linear-gradient(180deg, #ffd966, #d48c2c, #ffd966);
            border-radius: 4px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
        }

        .level-node {
            width: 90%;
            max-width: 500px;
            background: rgba(30,20,10,0.7);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            margin: 5px 0;
            transition: all 0.2s;
            border: 2px solid rgba(255,215,0,0.3);
            position: relative;
            z-index: 2;
        }

        .level-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            cursor: pointer;
            background: linear-gradient(115deg, rgba(255,245,200,0.95), rgba(255,235,180,0.9));
            border-radius: 60px;
            transition: all 0.2s;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .level-card:active {
            transform: scale(0.98);
        }

        .level-card.completed {
            background: linear-gradient(115deg, #2ecc71, #27ae60);
            box-shadow: 0 0 15px rgba(46,204,113,0.5);
        }

        .level-card.completed .level-number,
        .level-card.completed .level-stars {
            color: white;
        }

        .level-card.active {
            background: linear-gradient(115deg, #f39c12, #e67e22);
            border: 3px solid #ffd966;
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(243,156,18,0.6);
        }

        .level-card.active .level-number,
        .level-card.active .level-stars {
            color: white;
        }

        .level-card.locked {
            background: linear-gradient(115deg, #aaa, #888);
            opacity: 0.7;
            cursor: not-allowed;
        }

        .level-number {
            font-size: 1.4rem;
            font-weight: 800;
            color: #5a3a1a;
            min-width: 60px;
            text-align: center;
        }

        .level-stars {
            font-size: 0.9rem;
            letter-spacing: 3px;
            color: #f39c12;
        }

        .level-badge {
            width: 40px;
            text-align: center;
            font-size: 1.2rem;
        }

        /* ===== نافذة السؤال ===== */
        .quiz-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(20px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .quiz-card {
            background: linear-gradient(145deg, #fff8ed, #fff0e0);
            border-radius: 70px;
            max-width: 550px;
            width: 100%;
            padding: 35px 30px;
            animation: modalPop 0.35s cubic-bezier(0.34, 1.2, 0.64, 1);
            box-shadow: 0 30px 50px rgba(0,0,0,0.5);
        }

        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .category-badge {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .stars-progress {
            display: flex;
            gap: 5px;
        }

        .star {
            font-size: 1.6rem;
            color: #ddd;
            transition: all 0.2s;
        }

        .star.active {
            color: #ffd700;
            text-shadow: 0 0 5px #ffa500;
        }

        .visual-display {
            font-size: 5rem;
            text-align: center;
            background: #f5e6d3;
            border-radius: 60px;
            padding: 25px;
            margin: 15px 0;
            border: 2px solid #ffd966;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            text-align: center;
            margin: 20px 0;
            color: #2d3e2b;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }

        .option {
            background: white;
            border: 2px solid #e0c8a8;
            border-radius: 60px;
            padding: 14px 20px;
            text-align: center;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            color: #4a3720;
            font-size: 1rem;
        }

        .option:active {
            transform: scale(0.97);
        }

        .option.correct {
            background: #2ecc71;
            border-color: #27ae60;
            color: white;
            animation: correctPulse 0.4s ease;
        }

        .option.wrong {
            background: #e74c3c;
            border-color: #c0392b;
            color: white;
            animation: shake 0.3s ease;
        }

        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .timer-area {
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            background: #2d3e2b;
            border-radius: 60px;
            color: #ffd966;
            font-weight: 700;
        }

        .timer-area span {
            font-size: 2rem;
            font-weight: 800;
            color: #ffaa44;
            font-family: monospace;
            margin: 0 5px;
        }

        .close-quiz {
            background: #7f8c8d;
            margin-top: 15px;
            padding: 12px;
            border-radius: 60px;
            text-align: center;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: 0.1s;
        }

        .close-quiz:active {
            transform: scale(0.97);
        }

        /* ===== نافذة النتائج ===== */
        .result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.94);
            backdrop-filter: blur(16px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2100;
            padding: 20px;
        }

        .result-card {
            background: linear-gradient(145deg, #fff8ed, #ffefdb);
            border-radius: 70px;
            max-width: 500px;
            width: 100%;
            padding: 35px 30px;
            text-align: center;
            animation: modalPop 0.3s ease;
        }

        .result-title {
            font-size: 2rem;
            font-weight: 800;
            color: #e67e22;
            margin-bottom: 20px;
        }

        .result-stars {
            font-size: 2.5rem;
            margin: 15px 0;
            letter-spacing: 8px;
        }

        .result-message {
            background: #f5e6d3;
            border-radius: 50px;
            padding: 15px;
            margin: 20px 0;
            font-weight: 600;
            color: #5a3a1a;
        }

        .next-btn {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border: none;
            border-radius: 60px;
            padding: 16px;
            width: 100%;
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.1s;
        }

        .next-btn:active {
            transform: scale(0.98);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(12px);
            color: #ffd966;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            z-index: 2200;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
            white-space: nowrap;
            font-size: 0.9rem;
            border: 1px solid #ffd966;
        }

        .toast.show {
            opacity: 1;
        }

        @media (max-width: 550px) {
            .level-card { padding: 10px 15px; }
            .level-number { font-size: 1.2rem; min-width: 45px; }
            .level-stars { font-size: 0.7rem; letter-spacing: 2px; }
            .question-text { font-size: 1.1rem; }
            .option { padding: 12px; font-size: 0.9rem; }
            .toast { white-space: normal; text-align: center; max-width: 85%; font-size: 0.8rem; }
            .visual-display { font-size: 3.5rem; padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="splash-screen" id="splashScreen">
        <div class="splash-content">
            <div class="splash-logo">🌍🗺️</div>
            <div class="splash-title">رحلة الجغرافيا</div>
            <div class="splash-subtitle">اختبر معرفتك بالدول والعواصم</div>
            <div class="loading-container">
                <div class="loading-bar"><div class="loading-progress" id="loadingProgress"></div></div>
                <div class="loading-text" id="loadingText">جاري التحميل...</div>
            </div>
        </div>
    </div>

    <div class="intro-screen" id="introScreen">
        <div class="intro-card">
            <div class="intro-icon">🏆🌏</div>
            <div class="intro-title">مرحباً بك</div>
            <div class="intro-desc">300 مستوى من التحدي الجغرافي</div>
            <div class="intro-stats">
                <div class="intro-stat"><div class="intro-stat-value">300</div><div class="intro-stat-label">مستوى</div></div>
                <div class="intro-stat"><div class="intro-stat-value">900</div><div class="intro-stat-label">سؤال</div></div>
                <div class="intro-stat"><div class="intro-stat-value">⭐3⭐</div><div class="intro-stat-label">نجوم</div></div>
            </div>
            <button class="start-btn" id="startGameBtn">ابدأ الرحلة الآن</button>
        </div>
    </div>

    <div class="stats-bar" id="statsBar" style="display: none;">
        <div class="stat"><span class="stat-icon">🏆</span><span class="stat-value" id="levelNum">1</span><span class="stat-label">/300</span></div>
        <div class="stat"><span class="stat-icon">⭐</span><span class="stat-value" id="pointsNum">0</span><span class="stat-label">نقطة</span></div>
        <div class="stat"><span class="stat-icon">⚡</span><span class="stat-value" id="streakNum">0</span><span class="stat-label">توالى</span></div>
    </div>

    <div class="levels-container" id="levelsContainer" style="display: none;">
        <div class="map-background">
            <div class="levels-path" id="levelsPath"></div>
        </div>
    </div>

    <div class="quiz-modal" id="quizModal">
        <div class="quiz-card">
            <div class="quiz-header">
                <div class="category-badge" id="category">جغرافيا</div>
                <div class="stars-progress" id="starsProgress">
                    <span class="star">⭐</span><span class="star">⭐</span><span class="star">⭐</span>
                </div>
            </div>
            <div class="visual-display" id="visualDisplay">🌍</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsContainer"></div>
            <div class="timer-area">⏰ الوقت المتبقي <span id="timerDisplay">15</span> ثانية</div>
            <div class="close-quiz" id="closeQuizBtn">✖️ خروج من المستوى</div>
        </div>
    </div>

    <div class="result-modal" id="resultModal">
        <div class="result-card">
            <div class="result-title" id="resultTitle">🎉 النتيجة</div>
            <div class="result-stars" id="resultStars">⭐⭐⭐</div>
            <div class="result-message" id="resultMessage"></div>
            <button class="next-btn" id="nextBtn">المستوى التالي</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <audio id="correctSound" preload="auto"><source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" type="audio/mpeg"></audio>
    <audio id="wrongSound" preload="auto"><source src="https://www.soundjay.com/misc/sounds/fail-buzzer-01.mp3" type="audio/mpeg"></audio>
    <audio id="completeSound" preload="auto"><source src="https://www.soundjay.com/misc/sounds/fanfare-6.mp3" type="audio/mpeg"></audio>
    <audio id="levelUpSound" preload="auto"><source src="https://www.soundjay.com/misc/sounds/level-up-01.mp3" type="audio/mpeg"></audio>

    <script>
        // ==================== بيانات الأسئلة ====================
        const QUESTIONS = [];
        const baseQuestions = [
            { level: 1, step: 0, cat: "🏛️ عواصم", q: "ما عاصمة مصر؟", a: "القاهرة", opts: ["القاهرة", "الإسكندرية", "الجيزة", "أسوان"] },
            { level: 1, step: 1, cat: "🌊 أنهار", q: "أين يقع نهر النيل؟", a: "مصر", opts: ["مصر", "السودان", "إثيوبيا", "أوغندا"] },
            { level: 1, step: 2, cat: "🚢 مضائق", q: "أين يقع مضيق جبل طارق؟", a: "بين إسبانيا والمغرب", opts: ["بين إسبانيا والمغرب", "بين إيطاليا وتونس", "بين تركيا واليونان", "بين اليمن وجيبوتي"] },
            { level: 2, step: 0, cat: "🏛️ عواصم", q: "ما عاصمة السعودية؟", a: "الرياض", opts: ["الرياض", "جدة", "مكة", "الدمام"] },
            { level: 2, step: 1, cat: "🏝️ جزر", q: "أين تقع جزر المالديف؟", a: "المحيط الهندي", opts: ["المحيط الهندي", "المحيط الهادئ", "المحيط الأطلسي", "البحر الأحمر"] },
            { level: 2, step: 2, cat: "🗺️ دول حبيسة", q: "أي دولة أوروبية حبيسة؟", a: "النمسا", opts: ["النمسا", "إيطاليا", "فرنسا", "إسبانيا"] },
            { level: 3, step: 0, cat: "🏛️ عواصم", q: "ما عاصمة العراق؟", a: "بغداد", opts: ["بغداد", "البصرة", "الموصل", "أربيل"] },
            { level: 3, step: 1, cat: "🌊 بحار", q: "أين يقع البحر المتوسط؟", a: "بين أوروبا وأفريقيا", opts: ["بين أوروبا وأفريقيا", "بين آسيا وأفريقيا", "بين أوروبا وآسيا", "بين أمريكا وأوروبا"] },
            { level: 3, step: 2, cat: "🇪🇬 أعلام", q: "ما دولة علمها؟ 🇪🇬", a: "مصر", opts: ["مصر", "سوريا", "العراق", "اليمن"] }
        ];
        
        for(let i = 1; i <= 300; i++) {
            for(let s = 0; s < 3; s++) {
                let existing = baseQuestions.find(q => q.level === i && q.step === s);
                if(existing) QUESTIONS.push(existing);
                else {
                    QUESTIONS.push({
                        level: i, step: s, cat: "🌍 جغرافيا",
                        q: `سؤال المستوى ${i} - التحدي ${s+1}`,
                        a: "الإجابة الصحيحة",
                        opts: ["الإجابة الصحيحة", "خيار بديل", "خيار ثان", "خيار ثالث"]
                    });
                }
            }
        }
        
        // ==================== حالة اللعبة ====================
        let gameState = {
            currentLevel: 1,
            totalPoints: 0,
            streak: 0,
            levelStars: {}
        };
        
        try {
            const saved = localStorage.getItem('geoJourney');
            if(saved) {
                const data = JSON.parse(saved);
                gameState.currentLevel = data.currentLevel || 1;
                gameState.totalPoints = data.totalPoints || 0;
                gameState.streak = data.streak || 0;
                gameState.levelStars = data.levelStars || {};
            }
        } catch(e) {}
        
        // عناصر DOM
        const splashScreen = document.getElementById('splashScreen');
        const introScreen = document.getElementById('introScreen');
        const statsBar = document.getElementById('statsBar');
        const levelsContainer = document.getElementById('levelsContainer');
        const levelsPath = document.getElementById('levelsPath');
        const quizModal = document.getElementById('quizModal');
        const resultModal = document.getElementById('resultModal');
        const toast = document.getElementById('toast');
        
        // عناصر الصوت
        const correctSound = document.getElementById('correctSound');
        const wrongSound = document.getElementById('wrongSound');
        const completeSound = document.getElementById('completeSound');
        const levelUpSound = document.getElementById('levelUpSound');
        
        let currentQuestions = [];
        let currentStep = 0;
        let currentAnswers = [];
        let timerInterval = null;
        let timeLeft = 15;
        let isAnswered = false;
        
        function playSound(soundElement) {
            if(soundElement) {
                soundElement.currentTime = 0;
                soundElement.play().catch(e => console.log('صوت:', e));
            }
        }
        
        function showMessage(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1800);
        }
        
        function saveGame() {
            localStorage.setItem('geoJourney', JSON.stringify(gameState));
        }
        
        function updateStats() {
            document.getElementById('levelNum').textContent = gameState.currentLevel;
            document.getElementById('pointsNum').textContent = gameState.totalPoints;
            document.getElementById('streakNum').textContent = gameState.streak;
        }
        
        function buildLevels() {
            levelsPath.innerHTML = '';
            for(let i = 1; i <= 300; i++) {
                const node = document.createElement('div');
                node.className = 'level-node';
                const card = document.createElement('div');
                card.className = 'level-card';
                
                if(i < gameState.currentLevel) card.classList.add('completed');
                if(i === gameState.currentLevel) card.classList.add('active');
                if(i > gameState.currentLevel) card.classList.add('locked');
                
                const stars = gameState.levelStars[i] || 0;
                const starDisplay = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
                
                card.innerHTML = `
                    <div class="level-number">المستوى ${i}</div>
                    <div class="level-stars">${starDisplay}</div>
                    <div class="level-badge">${i <= gameState.currentLevel ? '🔓' : '🔒'}</div>
                `;
                
                if(i <= gameState.currentLevel) {
                    card.onclick = () => startLevel(i);
                }
                
                node.appendChild(card);
                levelsPath.appendChild(node);
            }
            
            setTimeout(() => {
                const active = document.querySelector('.level-card.active');
                if(active) active.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 150);
        }
        
        function startLevel(level) {
            currentQuestions = QUESTIONS.filter(q => q.level === level).sort((a,b) => a.step - b.step);
            if(currentQuestions.length === 0) {
                showMessage('هذا المستوى قيد الإعداد');
                return;
            }
            currentStep = 0;
            currentAnswers = [];
            isAnswered = false;
            showQuestion(0);
            quizModal.style.display = 'flex';
        }
        
        function updateStarsProgress(step) {
            const stars = document.querySelectorAll('.star');
            stars.forEach((s, i) => {
                if(i < step) s.classList.add('active');
                else s.classList.remove('active');
            });
        }
        
        function showQuestion(step) {
            updateStarsProgress(step);
            const q = currentQuestions[step];
            if(!q) return;
            
            document.getElementById('category').textContent = q.cat;
            document.getElementById('visualDisplay').textContent = q.cat.includes('أعلام') ? (q.q.includes('🇪🇬')?'🇪🇬':(q.q.includes('🇸🇦')?'🇸🇦':'🏳️')) : '🌍🗺️';
            document.getElementById('questionText').textContent = q.q;
            
            const opts = [...q.opts].sort(() => Math.random() - 0.5);
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            
            opts.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt === q.a, btn, q);
                container.appendChild(btn);
            });
            
            startTimer();
        }
        
        function startTimer() {
            if(timerInterval) clearInterval(timerInterval);
            timeLeft = 15;
            const timerEl = document.getElementById('timerDisplay');
            timerEl.textContent = timeLeft;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = Math.max(0, timeLeft);
                if(timeLeft <= 0 && !isAnswered) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    handleTimeout();
                }
            }, 1000);
        }
        
        function handleTimeout() {
            isAnswered = true;
            const currentQ = currentQuestions[currentStep];
            currentAnswers.push({
                question: currentQ.q,
                correct: currentQ.a,
                isCorrect: false
            });
            showMessage('⏰ انتهى الوقت!');
            gameState.streak = 0;
            
            document.querySelectorAll('.option').forEach(btn => btn.style.pointerEvents = 'none');
            document.querySelectorAll('.option').forEach(btn => {
                if(btn.textContent === currentQ.a) btn.classList.add('correct');
            });
            
            playSound(wrongSound);
            
            setTimeout(() => {
                currentStep++;
                if(currentStep < 3) {
                    showQuestion(currentStep);
                } else {
                    finishLevel();
                }
            }, 1400);
        }
        
        function checkAnswer(isCorrect, btn, question) {
            if(isAnswered) return;
            isAnswered = true;
            clearInterval(timerInterval);
            timerInterval = null;
            
            document.querySelectorAll('.option').forEach(b => b.style.pointerEvents = 'none');
            
            currentAnswers.push({
                question: question.q,
                correct: question.a,
                isCorrect: isCorrect
            });
            
            if(isCorrect) {
                btn.classList.add('correct');
                gameState.streak++;
                const points = 50 + timeLeft + (gameState.streak * 5);
                gameState.totalPoints += points;
                showMessage(`✅ +${points} نقطة`);
                playSound(correctSound);
            } else {
                btn.classList.add('wrong');
                gameState.streak = 0;
                showMessage('❌ إجابة خاطئة');
                playSound(wrongSound);
                document.querySelectorAll('.option').forEach(b => {
                    if(b.textContent === question.a) b.classList.add('correct');
                });
            }
            
            updateStats();
            saveGame();
            
            setTimeout(() => {
                currentStep++;
                if(currentStep < 3) {
                    showQuestion(currentStep);
                } else {
                    finishLevel();
                }
            }, 1300);
        }
        
        function finishLevel() {
            const correctCount = currentAnswers.filter(a => a.isCorrect).length;
            const levelNum = currentQuestions[0].level;
            
            gameState.levelStars[levelNum] = correctCount;
            const levelBonus = correctCount * 100;
            gameState.totalPoints += levelBonus;
            
            let levelCompleted = false;
            if(correctCount >= 2 && levelNum === gameState.currentLevel && levelNum < 300) {
                gameState.currentLevel++;
                levelCompleted = true;
                playSound(levelUpSound);
            }
            
            saveGame();
            updateStats();
            
            if(correctCount === 3) {
                showMessage('🎉 إنجاز كامل! +50 نقطة إضافية');
                gameState.totalPoints += 50;
                saveGame();
                updateStats();
                playSound(completeSound);
            }
            
            // عرض النتائج
            const starsDisplay = '⭐'.repeat(correctCount) + '☆'.repeat(3 - correctCount);
            document.getElementById('resultStars').innerHTML = starsDisplay;
            let message = '';
            if(correctCount === 3) message = 'ممتاز! إجابة كاملة ✨';
            else if(correctCount === 2) message = 'جيد جداً! قريب من الإتقان';
            else if(correctCount === 1) message = 'يمكنك تحسين النتيجة، حاول مرة أخرى';
            else message = 'حاول مجدداً لتحصل على النجوم';
            
            document.getElementById('resultMessage').innerHTML = message;
            document.getElementById('resultTitle').innerHTML = correctCount === 3 ? '🏆 إنجاز رائع!' : '📊 نتيجة المستوى';
            
            quizModal.style.display = 'none';
            resultModal.style.display = 'flex';
        }
        
        function closeResults() {
            resultModal.style.display = 'none';
            buildLevels();
            updateStats();
        }
        
        function startGame() {
            introScreen.style.transform = 'translateY(-100%)';
            setTimeout(() => {
                introScreen.style.display = 'none';
                statsBar.style.display = 'flex';
                levelsContainer.style.display = 'block';
            }, 500);
        }
        
        // شاشة البداية
        let progress = 0;
        const loadingInterval = setInterval(() => {
            progress += 8;
            document.getElementById('loadingProgress').style.width = Math.min(progress, 100) + '%';
            if(progress >= 100) {
                clearInterval(loadingInterval);
                setTimeout(() => {
                    splashScreen.style.opacity = '0';
                    setTimeout(() => {
                        splashScreen.style.display = 'none';
                        introScreen.style.display = 'flex';
                    }, 500);
                }, 400);
            }
        }, 100);
        
        document.getElementById('startGameBtn').onclick = startGame;
        document.getElementById('closeQuizBtn').onclick = () => {
            if(timerInterval) clearInterval(timerInterval);
            quizModal.style.display = 'none';
        };
        document.getElementById('nextBtn').onclick = closeResults;
        
        buildLevels();
        updateStats();
    </script>
</body>
</html>
