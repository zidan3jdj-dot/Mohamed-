<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sparty Pro - عالم الترفيه التفاعلي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .chat-box {
            height: 220px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #8b5cf6 rgba(255, 255, 255, 0.1);
        }
        
        .chat-box::-webkit-scrollbar {
            width: 6px;
        }
        
        .chat-box::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        .chat-box::-webkit-scrollbar-thumb {
            background: #8b5cf6;
            border-radius: 10px;
        }
        
        .user-mic-active {
            border: 3px solid #10b981;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.7);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        
        .tab-btn.active {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            transform: scale(1.05);
            transition: all 0.3s ease;
        }
        
        .avatar-ring {
            position: relative;
        }
        
        .avatar-ring::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            border: 2px solid transparent;
            background: linear-gradient(135deg, #8b5cf6, #ec4899) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }
        
        .option-correct {
            background: linear-gradient(135deg, #10b981, #059669) !important;
            animation: correctGlow 1s ease;
        }
        
        .option-wrong {
            background: linear-gradient(135deg, #ef4444, #dc2626) !important;
            animation: wrongShake 0.5s ease;
        }
        
        @keyframes correctGlow {
            0% { box-shadow: 0 0 5px #10b981; }
            50% { box-shadow: 0 0 20px #10b981; }
            100% { box-shadow: 0 0 5px #10b981; }
        }
        
        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .login-screen {
            background: linear-gradient(rgba(15, 12, 41, 0.95), rgba(30, 27, 75, 0.95)), url('https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?ixlib=rb-4.0.3&auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
        }
        
        .game-badge {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .mic-pulse {
            animation: micPulse 1.5s infinite;
        }
        
        @keyframes micPulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        
        .avatar-img {
            object-fit: cover;
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }
    </style>
</head>
<body class="flex flex-col p-3 md:p-4 min-h-screen">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="fixed inset-0 z-50 login-screen flex items-center justify-center p-4 md:p-6">
        <div class="w-full max-w-md glass-panel p-6 md:p-8 text-center">
            <div class="mb-6">
                <h1 class="text-3xl md:text-4xl font-bold mb-2 bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">SPARTY PRO</h1>
                <p class="text-gray-300 text-sm">منصة الترفيه التفاعلي والتحديات الصوتية</p>
            </div>
            
            <div class="mb-6">
                <div class="relative w-24 h-24 mx-auto mb-4 avatar-ring">
                    <div id="avatar-preview" class="w-full h-full rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 flex items-center justify-center font-bold text-2xl border-4 border-slate-800 overflow-hidden">
                        <span id="avatar-initial">?</span>
                        <img id="avatar-image" class="avatar-img hidden" alt="الصورة الشخصية">
                    </div>
                    <button onclick="triggerAvatarUpload()" class="absolute bottom-0 right-0 w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white">
                        <i class="fas fa-camera text-xs"></i>
                    </button>
                </div>
                <input type="file" id="avatar-upload" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)">
            </div>
            
            <div class="mb-6">
                <input id="username" type="text" placeholder="اسم المستخدم..." class="w-full p-3 md:p-4 rounded-xl bg-slate-800/70 mb-3 text-center border border-slate-600 focus:outline-none focus:ring-2 focus:ring-purple-500 text-white placeholder-gray-400">
                <input id="room-id" type="text" placeholder="معرف الغرفة (اختياري)" class="w-full p-3 md:p-4 rounded-xl bg-slate-800/70 mb-3 text-center border border-slate-600 focus:outline-none focus:ring-2 focus:ring-purple-500 text-white placeholder-gray-400">
                <p class="text-xs text-gray-400 mb-1">اترك الحقل فارغًا للدخول إلى الغرفة العامة</p>
            </div>
            
            <div class="flex flex-col gap-3">
                <button onclick="enterWorld()" class="w-full btn-primary p-3 md:p-4 rounded-xl font-bold text-white">
                    <i class="fas fa-door-open ml-2"></i> دخول الغرفة
                </button>
                <button onclick="quickJoin()" class="w-full btn-secondary p-3 md:p-4 rounded-xl font-bold text-white">
                    <i class="fas fa-bolt ml-2"></i> دخول سريع
                </button>
            </div>
            
            <div class="mt-6 text-xs text-gray-400">
                <p>باستخدامك للمنصة فإنك توافق على <a href="#" class="text-purple-400">شروط الخدمة</a></p>
            </div>
        </div>
    </div>

    <!-- الواجهة الرئيسية -->
    <div id="main-ui" class="hidden flex-1 flex flex-col">
        <!-- شريط المعلومات العلوي -->
        <div class="flex justify-between items-center p-3 glass-panel mb-3">
            <div class="flex items-center gap-3">
                <div id="my-avatar" class="w-10 h-10 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 flex items-center justify-center font-bold border-2 border-white overflow-hidden">
                    <img id="my-avatar-img" class="avatar-img hidden" alt="الصورة الشخصية">
                    <span id="my-avatar-initial">?</span>
                </div>
                <div>
                    <span id="display-name" class="font-bold text-sm block">--</span>
                    <span id="room-name" class="text-xs text-gray-300">الغرفة: العامة</span>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="hidden md:flex flex-col items-end">
                    <span class="text-xs text-gray-300">النقاط</span>
                    <span id="user-score" class="font-bold text-yellow-400">0</span>
                </div>
                <button id="mic-btn" onclick="toggleMic()" class="w-10 h-10 rounded-full bg-red-500 flex items-center justify-center">
                    <i class="fas fa-microphone-slash"></i>
                </button>
                <button id="admin-btn" class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-yellow-400" title="مشرف الغرفة">
                    <i class="fas fa-crown"></i>
                </button>
            </div>
        </div>

        <!-- شبكة اللاعبين -->
        <div class="grid grid-cols-4 sm:grid-cols-5 md:grid-cols-6 lg:grid-cols-8 gap-3 mb-3 p-3 glass-panel" id="players-grid">
            <!-- سيتم ملء اللاعبين هنا ديناميكيًا -->
        </div>

        <!-- منطقة اللعبة -->
        <div class="flex-1 glass-panel p-4 md:p-6 mb-3 flex flex-col items-center justify-center relative overflow-hidden">
            <div class="absolute top-3 right-3 game-badge text-xs px-3 py-1 rounded-full uppercase font-bold tracking-tighter">
                <i class="fas fa-brain ml-1"></i> تحدي الفوازير
            </div>
            
            <div id="game-content" class="text-center w-full max-w-2xl">
                <p id="question-text" class="text-xl md:text-2xl font-bold mb-6 text-yellow-300">في انتظار بدء اللعبة...</p>
                <div id="game-options" class="grid grid-cols-1 md:grid-cols-2 gap-3 w-full max-w-lg mx-auto">
                    <!-- سيتم ملء الخيارات هنا ديناميكيًا -->
                </div>
                
                <div class="mt-8 flex justify-center items-center gap-4">
                    <div class="text-center">
                        <div class="text-2xl font-bold text-purple-400" id="timer">30</div>
                        <div class="text-xs text-gray-300">ثانية</div>
                    </div>
                    
                    <div class="text-center">
                        <div class="text-2xl font-bold text-green-400" id="correct-count">0</div>
                        <div class="text-xs text-gray-300">إجابات صحيحة</div>
                    </div>
                    
                    <div class="text-center">
                        <div class="text-2xl font-bold text-red-400" id="wrong-count">0</div>
                        <div class="text-xs text-gray-300">إجابات خاطئة</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- منطقة الدردشة -->
        <div class="glass-panel p-3 md:p-4 flex flex-col h-1/3 md:h-1/4">
            <div class="chat-box mb-3 text-sm space-y-2 p-2" id="chat-messages">
                <p class="text-gray-400 text-center py-4">مرحباً بك في غرفة الدردشة الصوتية</p>
            </div>
            <div class="flex gap-2">
                <input id="chat-input" type="text" placeholder="اكتب رسالتك هنا..." class="flex-1 bg-slate-800/70 rounded-full px-4 py-3 text-sm outline-none border border-slate-600 focus:border-purple-500">
                <button onclick="sendMessage()" class="w-10 h-10 btn-primary rounded-full flex items-center justify-center">
                    <i class="fas fa-paper-plane text-xs"></i>
                </button>
                <button onclick="toggleEmojiPicker()" class="w-10 h-10 btn-secondary rounded-full flex items-center justify-center">
                    <i class="far fa-smile"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- محدد الإيموجي -->
    <div id="emoji-picker" class="hidden absolute bottom-16 left-3 glass-panel p-3 w-48 grid grid-cols-6 gap-2 z-40">
        <!-- سيتم ملء الإيموجيات هنا ديناميكيًا -->
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, update, onDisconnect, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // إعدادات Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAsNWpYWxTKpjSXprmbnScyV6pJqH8izLA",
            authDomain: "gems-1ba26.firebaseapp.com",
            databaseURL: "https://gems-1ba26-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "gems-1ba26",
            storageBucket: "gems-1ba26.firebasestorage.app",
            messagingSenderId: "734486620366",
            appId: "1:734486620366:web:7ffd1b8a0ae826c884c89f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // إنشاء معرف فريد للمستخدم
        const myId = "user_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
        
        // متغيرات التطبيق
        let myStream, peer, isMicOpen = false;
        let myName = "";
        let myAvatar = "";
        let myRoom = "room1";
        let userScore = 0;
        let correctAnswers = 0;
        let wrongAnswers = 0;
        let gameTimer = 30;
        let timerInterval = null;
        let isAdmin = false;
        let emojis = ["😀", "😂", "😍", "🤩", "😎", "🥳", "🤔", "👏", "🎉", "🔥", "💯", "❤️", "👍", "👎", "🙏"];

        // وظائف إدارة الملف الشخصي
        window.triggerAvatarUpload = function() {
            document.getElementById('avatar-upload').click();
        };

        window.handleAvatarUpload = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('avatar-image');
                const initial = document.getElementById('avatar-initial');
                
                img.src = e.target.result;
                img.classList.remove('hidden');
                initial.classList.add('hidden');
                
                // حفظ الصورة للاستخدام لاحقاً
                myAvatar = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.quickJoin = function() {
            document.getElementById('username').value = "مستخدم_" + Math.floor(Math.random() * 1000);
            document.getElementById('room-id').value = "";
            enterWorld();
        };

        window.enterWorld = async function() {
            const name = document.getElementById('username').value;
            const roomId = document.getElementById('room-id').value;
            
            if(!name.trim()) {
                alert("الرجاء إدخال اسم المستخدم");
                return;
            }
            
            myName = name.trim();
            
            // استخدام معرف الغرفة المخصص أو الغرفة العامة
            myRoom = roomId.trim() ? `room_${roomId.trim()}` : "public_room";
            
            // إخفاء شاشة تسجيل الدخول
            document.getElementById('login-screen').classList.add('hidden');
            
            // عرض الواجهة الرئيسية
            document.getElementById('main-ui').classList.remove('hidden');
            
            // تحديث المعلومات الشخصية
            document.getElementById('display-name').innerText = myName;
            document.getElementById('room-name').innerText = `الغرفة: ${roomId.trim() ? roomId : "العامة"}`;
            
            // تحديث الصورة الشخصية
            const myAvatarElement = document.getElementById('my-avatar-img');
            const myAvatarInitial = document.getElementById('my-avatar-initial');
            
            if (myAvatar) {
                myAvatarElement.src = myAvatar;
                myAvatarElement.classList.remove('hidden');
                myAvatarInitial.classList.add('hidden');
            } else {
                myAvatarInitial.innerText = myName[0].toUpperCase();
            }
            
            // محاولة الوصول إلى الميكروفون
            try {
                myStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    } 
                });
                myStream.getAudioTracks()[0].enabled = false;
                setupPeer();
            } catch(e) { 
                console.log("الوصول إلى الميكروفون غير متاح:", e);
                showNotification("سيتم الدخول بدون ميكروفون", "warning");
            }

            // إعداد اتصال Firebase
            setupFirebaseConnection();
            
            // بدء الاستماع للتحديثات
            listenToRoom();
            
            // إنشاء إيموجي للدردشة
            createEmojiPicker();
        };

        function setupPeer() {
            peer = new Peer(myId + "_peer", {
                debug: 2,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });
            
            peer.on('open', () => {
                console.log('Peer connection established');
            });
            
            peer.on('call', (call) => {
                call.answer(myStream);
                call.on('stream', (remoteStream) => {
                    const audio = new Audio();
                    audio.srcObject = remoteStream;
                    audio.play().catch(e => console.log("Audio play error:", e));
                });
            });
            
            peer.on('error', (err) => {
                console.log('Peer error:', err);
            });
        };

        function setupFirebaseConnection() {
            const userRef = ref(db, `party/${myRoom}/users/${myId}`);
            
            // حفظ بيانات المستخدم
            const userData = {
                name: myName,
                avatar: myAvatar,
                isTalking: false,
                score: 0,
                joinedAt: Date.now(),
                isAdmin: isAdmin
            };
            
            set(userRef, userData);
            
            // إزالة المستخدم عند الخروج
            onDisconnect(userRef).remove();
            
            // إزالة الرسائل القديمة عند الخروج
            onDisconnect(ref(db, `party/${myRoom}/chat`)).set({});
        };

        window.toggleMic = function() {
            if (!myStream) {
                showNotification("الميكروفون غير متوفر", "error");
                return;
            }
            
            isMicOpen = !isMicOpen;
            myStream.getAudioTracks()[0].enabled = isMicOpen;
            
            const btn = document.getElementById('mic-btn');
            
            if (isMicOpen) {
                btn.className = "w-10 h-10 rounded-full bg-green-500 flex items-center justify-center mic-pulse";
                btn.innerHTML = '<i class="fas fa-microphone"></i>';
                showNotification("الميكروفون مفعل", "success");
            } else {
                btn.className = "w-10 h-10 rounded-full bg-red-500 flex items-center justify-center";
                btn.innerHTML = '<i class="fas fa-microphone-slash"></i>';
            }
            
            // تحديث حالة الميكروفون في قاعدة البيانات
            update(ref(db, `party/${myRoom}/users/${myId}`), { isTalking: isMicOpen });
        };

        function listenToRoom() {
            // تحديث قائمة اللاعبين
            onValue(ref(db, `party/${myRoom}/users`), (snap) => {
                const users = snap.val() || {};
                const grid = document.getElementById('players-grid');
                grid.innerHTML = '';
                
                Object.keys(users).forEach(id => {
                    const u = users[id];
                    const isMe = id === myId;
                    
                    let avatarContent = '';
                    if (u.avatar) {
                        avatarContent = `<img src="${u.avatar}" class="avatar-img" alt="${u.name}">`;
                    } else {
                        avatarContent = `<span class="font-bold text-lg">${u.name ? u.name[0].toUpperCase() : '?'}</span>`;
                    }
                    
                    grid.innerHTML += `
                        <div class="flex flex-col items-center">
                            <div class="w-14 h-14 md:w-16 md:h-16 rounded-full bg-gradient-to-br from-slate-800 to-slate-900 flex items-center justify-center relative ${u.isTalking ? 'user-mic-active' : 'border-2 border-slate-600'} ${isMe ? 'ring-2 ring-purple-500' : ''}">
                                ${avatarContent}
                                ${u.isTalking ? '<div class="absolute -bottom-1 -right-1 bg-green-500 w-4 h-4 rounded-full border-2 border-slate-900"></div>' : ''}
                                ${u.isAdmin ? '<div class="absolute -top-1 -left-1 bg-yellow-500 w-5 h-5 rounded-full flex items-center justify-center text-xs"><i class="fas fa-crown"></i></div>' : ''}
                            </div>
                            <div class="text-center mt-2">
                                <span class="text-xs font-medium block truncate max-w-[80px]">${u.name}</span>
                                <span class="text-[10px] text-gray-400">${u.score || 0} نقاط</span>
                            </div>
                        </div>
                    `;
                    
                    // الاتصال الصوتي بالمستخدمين الآخرين
                    if (id !== myId && peer && myStream) {
                        const call = peer.call(id + "_peer", myStream);
                        if (call) {
                            call.on('stream', (remoteStream) => {
                                const audio = new Audio();
                                audio.srcObject = remoteStream;
                                audio.play().catch(e => console.log("Remote audio error:", e));
                            });
                        }
                    }
                });
            });

            // تحديث الدردشة
            onValue(ref(db, `party/${myRoom}/chat`), (snap) => {
                const chat = document.getElementById('chat-messages');
                chat.innerHTML = '';
                
                const messages = snap.val();
                if (!messages) {
                    chat.innerHTML = '<p class="text-gray-400 text-center py-4">ابدأ الدردشة مع اللاعبين</p>';
                    return;
                }
                
                Object.values(messages).forEach(msg => {
                    const isMyMessage = msg.senderId === myId;
                    
                    const messageElement = document.createElement('div');
                    messageElement.className = `flex ${isMyMessage ? 'flex-row-reverse' : ''} mb-2`;
                    
                    messageElement.innerHTML = `
                        <div class="flex ${isMyMessage ? 'flex-row-reverse' : ''} items-start gap-2 max-w-[85%]">
                            <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 flex items-center justify-center text-xs font-bold mt-1 flex-shrink-0">
                                ${msg.name ? msg.name[0].toUpperCase() : '?'}
                            </div>
                            <div class="${isMyMessage ? 'bg-purple-800/40' : 'bg-slate-800/40'} rounded-2xl ${isMyMessage ? 'rounded-tr-none' : 'rounded-tl-none'} p-3 text-sm">
                                <div class="flex ${isMyMessage ? 'flex-row-reverse' : ''} items-center gap-2 mb-1">
                                    <span class="font-bold text-purple-300">${msg.name}</span>
                                    <span class="text-xs text-gray-400">${formatTime(msg.timestamp)}</span>
                                </div>
                                <p class="text-white">${msg.text}</p>
                            </div>
                        </div>
                    `;
                    
                    chat.appendChild(messageElement);
                });
                
                chat.scrollTop = chat.scrollHeight;
            });

            // تحديث اللعبة
            onValue(ref(db, `party/${myRoom}/game`), (snap) => {
                const game = snap.val();
                if (game && game.question) {
                    updateGameUI(game);
                } else {
                    generateRiddle();
                }
            });
        };

        window.sendMessage = function() {
            const input = document.getElementById('chat-input');
            const messageText = input.value.trim();
            
            if (!messageText) return;
            
            const messageRef = push(ref(db, `party/${myRoom}/chat`));
            set(messageRef, {
                senderId: myId,
                name: myName,
                text: messageText,
                timestamp: Date.now()
            });
            
            input.value = '';
        };

        function formatTime(timestamp) {
            if (!timestamp) return "";
            
            const date = new Date(timestamp);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            
            if (diffMins < 1) return "الآن";
            if (diffMins < 60) return `قبل ${diffMins} دقيقة`;
            
            const hours = Math.floor(diffMins / 60);
            if (hours < 24) return `قبل ${hours} ساعة`;
            
            return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        }

        const riddles = [
            { question: "ما هو الشيء الذي يكسر بمجرد النطق باسمه؟", answer: "الصمت", options: ["الزجاج", "الصمت", "الوعد", "الكأس"] },
            { question: "له عين واحدة ولكنه لا يرى؟", answer: "الإبرة", options: ["الإبرة", "الإعصار", "الخاتم", "العين"] },
            { question: "يتحرك دائماً حولك لكنك لا تراه؟", answer: "الهواء", options: ["الظل", "الهواء", "الزمن", "الضوء"] },
            { question: "ما هو الشيء الذي كلما أخذت منه كبر؟", answer: "الحفرة", options: ["الحفرة", "المال", "العمر", "البحر"] },
            { question: "أسود عندما يكون نظيفاً، وأبيض عندما يكون متسخاً؟", answer: "السبورة", options: ["السبورة", "الليل", "القمر", "الفحم"] },
            { question: "يخترق الزجاج ولا يكسره؟", answer: "الضوء", options: ["الماء", "الهواء", "الضوء", "الصوت"] },
            { question: "ما هو الشيء الذي يوجد في القرن مرة وفي الدقيقة مرتين ولا يوجد في الساعة؟", answer: "القاف", options: ["القاف", "النون", "الميم", "الراء"] },
            { question: "ما هو الشيء الذي لا يدخل إلا إذا ضربته على رأسه؟", answer: "المسمار", options: ["المسمار", "المطر", "الفكرة", "الطعام"] }
        ];

        function generateRiddle() {
            const randomRiddle = riddles[Math.floor(Math.random() * riddles.length)];
            
            set(ref(db, `party/${myRoom}/game`), {
                ...randomRiddle,
                startedAt: Date.now(),
                timer: 30
            });
            
            // بدء المؤقت
            startGameTimer();
        };

        function startGameTimer() {
            if (timerInterval) clearInterval(timerInterval);
            
            gameTimer = 30;
            document.getElementById('timer').innerText = gameTimer;
            
            timerInterval = setInterval(() => {
                gameTimer--;
                document.getElementById('timer').innerText = gameTimer;
                
                if (gameTimer <= 0) {
                    clearInterval(timerInterval);
                    showNotification("انتهى الوقت! سيتم عرض السؤال التالي", "info");
                    setTimeout(() => generateRiddle(), 2000);
                }
            }, 1000);
        };

        function updateGameUI(game) {
            document.getElementById('question-text').innerText = game.question;
            const optionsBox = document.getElementById('game-options');
            optionsBox.innerHTML = '';
            
            game.options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = "bg-white/10 p-4 rounded-xl hover:bg-purple-600/50 transition text-sm md:text-base font-bold hover:scale-[1.02] active:scale-[0.98]";
                btn.innerText = option;
                
                btn.onclick = () => {
                    if (game.answered) return;
                    
                    if (option === game.answer) {
                        // الإجابة الصحيحة
                        btn.classList.add('option-correct');
                        correctAnswers++;
                        document.getElementById('correct-count').innerText = correctAnswers;
                        
                        // زيادة النقاط
                        userScore += 10;
                        document.getElementById('user-score').innerText = userScore;
                        
                        // تحديث النقاط في قاعدة البيانات
                        update(ref(db, `party/${myRoom}/users/${myId}`), { 
                            score: userScore 
                        });
                        
                        showNotification(`إجابة صحيحة! لقد ربحت 10 نقاط`, "success");
                        
                        // تعطيل جميع الأزرار
                        disableAllOptions();
                        
                        setTimeout(() => {
                            generateRiddle();
                        }, 2000);
                    } else {
                        // الإجابة الخاطئة
                        btn.classList.add('option-wrong');
                        wrongAnswers++;
                        document.getElementById('wrong-count').innerText = wrongAnswers;
                        
                        // خسارة نقاط
                        userScore = Math.max(0, userScore - 2);
                        document.getElementById('user-score').innerText = userScore;
                        
                        update(ref(db, `party/${myRoom}/users/${myId}`), { 
                            score: userScore 
                        });
                        
                        showNotification("إجابة خاطئة! خسرت نقطتين", "error");
                    }
                    
                    // تحديث حالة اللعبة
                    update(ref(db, `party/${myRoom}/game`), { 
                        answered: true 
                    });
                };
                
                optionsBox.appendChild(btn);
            });
        };

        function disableAllOptions() {
            const buttons = document.querySelectorAll('#game-options button');
            buttons.forEach(btn => {
                btn.disabled = true;
                btn.classList.add('opacity-70');
            });
        };

        function createEmojiPicker() {
            const picker = document.getElementById('emoji-picker');
            picker.innerHTML = '';
            
            emojis.forEach(emoji => {
                const emojiBtn = document.createElement('button');
                emojiBtn.className = "text-xl p-1 hover:bg-white/10 rounded";
                emojiBtn.innerText = emoji;
                emojiBtn.onclick = () => {
                    const input = document.getElementById('chat-input');
                    input.value += emoji;
                    input.focus();
                    toggleEmojiPicker();
                };
                picker.appendChild(emojiBtn);
            });
        };

        window.toggleEmojiPicker = function() {
            const picker = document.getElementById('emoji-picker');
            picker.classList.toggle('hidden');
        };

        // إغلاق منتقي الإيموجي عند النقر خارجها
        document.addEventListener('click', (event) => {
            const picker = document.getElementById('emoji-picker');
            const emojiBtn = document.querySelector('button[onclick="toggleEmojiPicker()"]');
            
            if (!picker.classList.contains('hidden') && 
                !picker.contains(event.target) && 
                !emojiBtn.contains(event.target)) {
                picker.classList.add('hidden');
            }
        });

        function showNotification(message, type = "info") {
            // إنشاء إشعار مؤقت
            const notification = document.createElement('div');
            
            let bgColor = "bg-blue-500";
            if (type === "success") bgColor = "bg-green-500";
            if (type === "error") bgColor = "bg-red-500";
            if (type === "warning") bgColor = "bg-yellow-500";
            
            notification.className = `fixed top-4 left-4 right-4 md:left-auto md:right-4 md:w-80 ${bgColor} text-white p-4 rounded-xl shadow-lg z-50 transform transition-transform duration-300`;
            notification.innerText = message;
            
            document.body.appendChild(notification);
            
            // إزالة الإشعار بعد 3 ثوانٍ
            setTimeout(() => {
                notification.style.transform = "translateY(-100%)";
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 300);
            }, 3000);
        }

        // إغلاق الصفحة - تنظيف البيانات
        window.addEventListener('beforeunload', () => {
            if (myId) {
                remove(ref(db, `party/${myRoom}/users/${myId}`));
            }
        });

        // إخفاء منتقي الإيموجي عند النقر خارجها
        document.addEventListener('click', (e) => {
            const emojiPicker = document.getElementById('emoji-picker');
            if (!emojiPicker.contains(e.target) && !e.target.closest('button[onclick="toggleEmojiPicker()"]')) {
                emojiPicker.classList.add('hidden');
            }
        });

        // السماح بإرسال الرسالة بالضغط على Enter
        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
