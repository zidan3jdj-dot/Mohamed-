<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>رحلة الجغرافيا | Geo Journey - تحدي الخريطة والإيموجي</title>
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0b2b44 0%, #1a3f60 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== شريط التنقل بين الأقسام ===== */
        .nav-tabs {
            background: rgba(255,255,255,0.96);
            border-radius: 60px;
            margin: 15px 15px 8px 15px;
            padding: 6px;
            display: flex;
            gap: 10px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .nav-tab {
            flex: 1;
            text-align: center;
            padding: 12px 8px;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            color: #2c3e66;
            background: #f0f2f8;
            font-size: 0.95rem;
        }

        .nav-tab.active {
            background: linear-gradient(135deg, #2a6f8f, #1e4a6e);
            color: white;
            box-shadow: 0 6px 14px rgba(30,74,110,0.4);
        }

        /* ===== شاشات البداية ===== */
        .splash-screen, .intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #0f2c3b, #1b4b6e);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.7s ease, transform 0.5s ease;
        }

        .splash-content, .intro-card {
            text-align: center;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(16px);
            border-radius: 70px;
            padding: 40px 30px;
            max-width: 400px;
            width: 85%;
            box-shadow: 0 30px 50px rgba(0,0,0,0.4);
            animation: fadeUp 0.8s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .splash-logo { font-size: 5rem; margin-bottom: 15px; animation: gentleBounce 1.2s infinite; }
        @keyframes gentleBounce { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-12px); } }
        .splash-title { font-size: 2.2rem; font-weight: 800; color: white; text-shadow: 0 3px 12px black; }
        .loading-bar { width: 220px; margin: 20px auto; background: rgba(255,255,255,0.25); border-radius: 12px; overflow: hidden; }
        .loading-progress { width: 0%; height: 6px; background: #ffd966; transition: width 0.2s; }

        .intro-card { background: white; color: #1e2f47; padding: 30px 25px; }
        .intro-icon { font-size: 4rem; }
        .intro-title { font-size: 1.9rem; color: #1e4a6e; }
        .intro-stats { display: flex; justify-content: center; gap: 20px; margin: 25px 0; }
        .intro-stat { background: #eef2fc; border-radius: 40px; padding: 12px; flex: 1; }
        .intro-stat-value { font-size: 1.7rem; font-weight: 800; color: #2a6f8f; }
        .start-btn { background: linear-gradient(135deg, #2a6f8f, #1e4a6e); border: none; border-radius: 60px; padding: 14px; width: 100%; color: white; font-weight: bold; font-size: 1.2rem; cursor: pointer; transition: 0.2s; }
        .start-btn:active { transform: scale(0.97); }

        /* ===== شريط النقاط ===== */
        .stats-bar {
            background: rgba(255,255,255,0.96);
            border-radius: 60px;
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            margin: 8px 15px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15);
        }
        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #eef2fa;
            padding: 5px 16px;
            border-radius: 40px;
            font-weight: 600;
        }
        .stat-value { color: #2c6e8f; font-weight: 800; margin: 0 4px; }

        /* ===== خريطة المستويات (تحسين كامل) ===== */
        .levels-container {
            background: rgba(0,0,0,0.25);
            border-radius: 40px;
            margin: 10px 15px 20px 15px;
            padding: 18px 12px;
            height: calc(100vh - 165px);
            overflow-y: auto;
            backdrop-filter: blur(8px);
        }
        .levels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(82px, 1fr));
            gap: 12px;
        }
        .level-card {
            background: white;
            border-radius: 28px;
            padding: 12px 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            border: 2px solid rgba(255,215,0,0.3);
        }
        .level-card:active { transform: scale(0.95); }
        .level-card.completed { background: linear-gradient(135deg, #27ae60, #1e8449); color: white; border-color: #f9e79f; }
        .level-card.active { border: 3px solid #ffc107; background: linear-gradient(135deg, #f39c12, #e67e22); color: white; transform: scale(1.02); box-shadow: 0 0 12px gold; }
        .level-card.locked { opacity: 0.5; filter: grayscale(0.3); cursor: not-allowed; background: #ccc; }
        .level-number { font-size: 1.3rem; font-weight: 800; }
        .level-stars { font-size: 0.75rem; letter-spacing: 2px; margin-top: 5px; }

        /* ===== نافذة السؤال الموحدة ===== */
        .quiz-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.88);
            backdrop-filter: blur(14px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2100;
            padding: 18px;
        }
        .quiz-card {
            background: white;
            border-radius: 55px;
            max-width: 550px;
            width: 100%;
            padding: 28px 22px;
            animation: modalPop 0.25s ease;
        }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
        .emoji-big, .flag-big {
            font-size: 5rem;
            text-align: center;
            background: #f1f5f9;
            border-radius: 70px;
            padding: 20px;
            margin: 10px 0;
            letter-spacing: 8px;
        }
        .question-text {
            font-size: 1.35rem;
            font-weight: 700;
            text-align: center;
            margin: 18px 0;
            color: #1f3e48;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }
        .option {
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 60px;
            padding: 14px 16px;
            text-align: center;
            font-weight: 700;
            cursor: pointer;
            transition: 0.1s;
            color: #0f2c3b;
        }
        .option:active { transform: scale(0.98); }
        .option.correct { background: #2ecc71; border-color: #27ae60; color: white; }
        .option.wrong { background: #e74c3c; border-color: #c0392b; color: white; }
        .timer-area {
            text-align: center;
            margin-top: 18px;
            background: #eef2ff;
            border-radius: 60px;
            padding: 10px;
            font-weight: 600;
        }
        .timer-area span { font-size: 1.8rem; font-weight: bold; color: #d35400; font-family: monospace; }
        .close-quiz {
            background: #7f8c8d;
            margin-top: 15px;
            padding: 12px;
            border-radius: 60px;
            text-align: center;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        /* ===== نافذة النتائج ===== */
        .result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2200;
            padding: 20px;
        }
        .result-card {
            background: white;
            border-radius: 55px;
            max-width: 500px;
            width: 100%;
            padding: 30px 24px;
            text-align: center;
        }
        .result-title { font-size: 1.8rem; color: #2c6e8f; margin-bottom: 15px; }
        .result-details { font-size: 1.2rem; margin: 15px 0; background: #f1f5f9; border-radius: 40px; padding: 12px; }
        .next-btn { background: linear-gradient(135deg, #2a6f8f, #1e4a6e); border: none; border-radius: 60px; padding: 14px; width: 100%; color: white; font-weight: bold; font-size: 1.1rem; margin-top: 20px; cursor: pointer; }

        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            color: #ffecb3;
            padding: 10px 24px;
            border-radius: 60px;
            z-index: 2300;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
            white-space: nowrap;
            font-weight: 500;
        }
        .toast.show { opacity: 1; }
        .sound-toggle {
            position: fixed;
            bottom: 22px;
            left: 20px;
            background: rgba(255,255,240,0.95);
            border-radius: 60px;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            cursor: pointer;
            z-index: 1500;
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
            border: none;
        }
        @media (max-width: 550px) {
            .levels-grid { grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; }
            .level-card { padding: 8px 4px; }
            .question-text { font-size: 1.1rem; }
            .option { padding: 10px; font-size: 0.9rem; }
            .toast { white-space: normal; text-align: center; max-width: 85%; }
        }
    </style>
</head>
<body>

    <!-- شاشة البداية المشتركة -->
    <div class="splash-screen" id="splashScreen">
        <div class="splash-content">
            <div class="splash-logo">🌍🎭</div>
            <div class="splash-title">رحلة الجغرافيا</div>
            <div class="splash-subtitle" style="color:#ffecb3;">Geo Journey · تحدي المعرفة والإيموجي</div>
            <div class="loading-bar"><div class="loading-progress" id="loadingProgress"></div></div>
            <div class="loading-text" style="color:#ddd;">تحميل العوالم...</div>
        </div>
    </div>

    <!-- شاشة الترحيب -->
    <div class="intro-screen" id="introScreen">
        <div class="intro-card">
            <div class="intro-icon">🗺️✨</div>
            <div class="intro-title">مرحباً أيها المستكشف</div>
            <div class="intro-desc">300 مستوى • نمطان • تحديات ممتعة</div>
            <div class="intro-stats">
                <div class="intro-stat"><div class="intro-stat-value">300</div><div>مستوى</div></div>
                <div class="intro-stat"><div class="intro-stat-value">🎭+📍</div><div>نمطان</div></div>
                <div class="intro-stat"><div class="intro-stat-value">🎵</div><div>موسيقى</div></div>
            </div>
            <button class="start-btn" id="startGameBtn">ابدأ الرحلة 🚀</button>
        </div>
    </div>

    <!-- شريط التنقل بين القسمين -->
    <div class="nav-tabs" style="display: none;" id="navTabs">
        <div class="nav-tab" data-mode="geo">📍 جغرافيا كلاسيك</div>
        <div class="nav-tab active" data-mode="emoji">🎭 خمن الإيموجي</div>
    </div>

    <!-- شريط الإحصائيات -->
    <div class="stats-bar" style="display: none;" id="statsBar">
        <div class="stat"><span>🏆</span><span class="stat-value" id="levelNum">1</span><span>/300</span></div>
        <div class="stat"><span>⭐</span><span class="stat-value" id="pointsNum">0</span></div>
        <div class="stat"><span>⚡</span><span class="stat-value" id="streakNum">0</span></div>
    </div>

    <!-- خريطة المستويات -->
    <div class="levels-container" style="display: none;" id="levelsContainer">
        <div class="levels-grid" id="levelsGrid"></div>
    </div>

    <!-- نافذة السؤال (موحدة) -->
    <div class="quiz-modal" id="quizModal">
        <div class="quiz-card">
            <div id="visualDisplay" class="emoji-big">🌍</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsContainer"></div>
            <div class="timer-area">⏳ <span id="timerDisplay">15</span> ثانية</div>
            <div class="close-quiz" id="closeQuizBtn">✖️ خروج من المستوى</div>
        </div>
    </div>

    <!-- نافذة النتائج -->
    <div class="result-modal" id="resultModal">
        <div class="result-card">
            <div class="result-title" id="resultTitle">🎉 النتيجة</div>
            <div id="resultExtra" class="result-details"></div>
            <button class="next-btn" id="nextBtn">▶ متابعة</button>
        </div>
    </div>

    <button class="sound-toggle" id="soundToggle">🔊</button>
    <div class="toast" id="toast"></div>
    <audio id="music3Stars" preload="auto"></audio>
    <audio id="music2Stars" preload="auto"></audio>

    <script>
        // ---------- 1. بيانات الجغرافيا (300 مستوى، 3 أسئلة لكل) ----------
        let GEO_QUESTIONS = [];
        const baseGeo = [
            { level: 1, step: 0, cat: "🏛️ عواصم", q: "ما عاصمة مصر؟", a: "القاهرة", opts: ["القاهرة", "الإسكندرية", "الجيزة", "أسوان"] },
            { level: 1, step: 1, cat: "🌊 أنهار", q: "أين يقع نهر النيل؟", a: "مصر", opts: ["مصر", "السودان", "إثيوبيا", "أوغندا"] },
            { level: 1, step: 2, cat: "🚢 مضائق", q: "أين يقع مضيق جبل طارق؟", a: "بين إسبانيا والمغرب", opts: ["بين إسبانيا والمغرب", "بين إيطاليا وتونس", "بين تركيا واليونان", "بين اليمن وجيبوتي"] },
            { level: 2, step: 0, cat: "🏛️ عواصم", q: "ما عاصمة السعودية؟", a: "الرياض", opts: ["الرياض", "جدة", "مكة", "الدمام"] },
            { level: 2, step: 1, cat: "🏝️ جزر", q: "أين تقع جزر المالديف؟", a: "المحيط الهندي", opts: ["المحيط الهندي", "المحيط الهادئ", "المحيط الأطلسي", "البحر الأحمر"] },
            { level: 2, step: 2, cat: "🗺️ دول حبيسة", q: "أي دولة أوروبية حبيسة؟", a: "النمسا", opts: ["النمسا", "إيطاليا", "فرنسا", "إسبانيا"] },
            { level: 3, step: 0, cat: "🏛️ عواصم", q: "ما عاصمة العراق؟", a: "بغداد", opts: ["بغداد", "البصرة", "الموصل", "أربيل"] },
            { level: 3, step: 1, cat: "🌊 بحار", q: "أين يقع البحر المتوسط؟", a: "بين أوروبا وأفريقيا", opts: ["بين أوروبا وأفريقيا", "بين آسيا وأفريقيا", "بين أوروبا وآسيا", "بين أمريكا وأوروبا"] },
            { level: 3, step: 2, cat: "🇪🇬 أعلام", q: "ما دولة علمها؟ 🇪🇬", a: "مصر", opts: ["مصر", "سوريا", "العراق", "اليمن"] },
            { level: 4, step: 0, cat: "🏛️ عواصم", q: "ما عاصمة سوريا؟", a: "دمشق", opts: ["دمشق", "حلب", "حمص", "اللاذقية"] },
            { level: 4, step: 1, cat: "🏔️ جبال", q: "أين تقع جبال الألب؟", a: "أوروبا", opts: ["أوروبا", "آسيا", "أمريكا الجنوبية", "أفريقيا"] },
            { level: 4, step: 2, cat: "🇸🇦 أعلام", q: "ما دولة علمها؟ 🇸🇦", a: "السعودية", opts: ["السعودية", "الكويت", "قطر", "الإمارات"] },
            { level: 5, step: 0, cat: "🏛️ عواصم", q: "ما عاصمة لبنان؟", a: "بيروت", opts: ["بيروت", "طرابلس", "صيدا", "صور"] },
            { level: 5, step: 1, cat: "🚢 مضائق", q: "أين يقع مضيق البوسفور؟", a: "تركيا", opts: ["تركيا", "روسيا", "اليونان", "بلغاريا"] },
            { level: 5, step: 2, cat: "🇶🇦 أعلام", q: "ما دولة علمها؟ 🇶🇦", a: "قطر", opts: ["قطر", "البحرين", "الكويت", "الإمارات"] }
        ];
        for (let i = 6; i <= 300; i++) {
            for (let s = 0; s < 3; s++) {
                let variants = ["ما عاصمة الدولة؟", "أين يقع هذا المعلم؟", "أي دولة تشتهر بهذا؟"];
                GEO_QUESTIONS.push({
                    level: i, step: s, cat: "🌍 متنوع",
                    q: `${variants[s % 3]} (المستوى ${i})`,
                    a: "الإجابة النموذجية",
                    opts: ["الإجابة النموذجية", "خيار بديل", "خيار ثان", "خيار ثالث"]
                });
            }
        }
        for (let i = 0; i < baseGeo.length; i++) GEO_QUESTIONS.unshift(baseGeo[i]);
        GEO_QUESTIONS = GEO_QUESTIONS.slice(0, 900);
        
        // ---------- 2. بيانات الإيموجي (300 سؤال فريد) ----------
        let EMOJI_QUESTIONS = [];
        const premiumEmoji = [
            { level: 1, emoji: "🐪🏜️🛢️", answer: "السعودية", options: ["السعودية", "مصر", "الإمارات", "قطر"] },
            { level: 2, emoji: "🗽🦅", answer: "الولايات المتحدة", options: ["الولايات المتحدة", "كندا", "المكسيك", "البرازيل"] },
            { level: 3, emoji: "🍕🍝🏛️", answer: "إيطاليا", options: ["إيطاليا", "فرنسا", "إسبانيا", "اليونان"] },
            { level: 4, emoji: "🥐🗼🍷", answer: "فرنسا", options: ["فرنسا", "بلجيكا", "سويسرا", "إيطاليا"] },
            { level: 5, emoji: "🐼🐉🥟", answer: "الصين", options: ["الصين", "اليابان", "كوريا", "تايوان"] },
            { level: 6, emoji: "🍣🗻🤖", answer: "اليابان", options: ["اليابان", "كوريا", "الصين", "تايلاند"] },
            { level: 7, emoji: "🦘🏏", answer: "أستراليا", options: ["أستراليا", "نيوزيلندا", "جنوب أفريقيا", "إنجلترا"] },
            { level: 8, emoji: "🐫🏜️🕋", answer: "المملكة العربية السعودية", options: ["المملكة العربية السعودية", "عمان", "الأردن", "اليمن"] },
            { level: 9, emoji: "🌷🧀🚲", answer: "هولندا", options: ["هولندا", "بلجيكا", "ألمانيا", "الدنمارك"] },
            { level: 10, emoji: "🐂⚽🌊", answer: "البرازيل", options: ["البرازيل", "الأرجنتين", "المكسيك", "كولومبيا"] },
            { level: 11, emoji: "🕌🐫🌴", answer: "مصر", options: ["مصر", "السعودية", "الأردن", "سوريا"] },
            { level: 12, emoji: "🍛🐘🛕", answer: "تايلاند", options: ["تايلاند", "فيتنام", "كمبوديا", "ميانمار"] },
            { level: 13, emoji: "🍁🍂🦌", answer: "كندا", options: ["كندا", "الولايات المتحدة", "روسيا", "السويد"] },
            { level: 14, emoji: "🏔️🧀🍫", answer: "سويسرا", options: ["سويسرا", "النمسا", "ألمانيا", "فرنسا"] },
            { level: 15, emoji: "🐧🧊❄️", answer: "أنتاركتيكا", options: ["أنتاركتيكا", "غرينلاند", "آيسلندا", "النرويج"] }
        ];
        for (let i = 1; i <= 300; i++) {
            let existing = premiumEmoji.find(e => e.level === i);
            if (existing) EMOJI_QUESTIONS.push(existing);
            else {
                let randCountry = ["مصر", "السعودية", "اليابان", "ألمانيا", "المغرب", "تركيا", "الأرجنتين", "كوريا الجنوبية", "إسبانيا", "الهند"][i % 10];
                let fakeEmojis = ["🌍", "🏔️", "🌊", "🏜️", "🐪", "🕌", "🍣", "🥘"][i % 8] + " + " + ["✨", "⭐", "🔥", "💎"][i % 4];
                EMOJI_QUESTIONS.push({
                    level: i,
                    emoji: fakeEmojis,
                    answer: randCountry,
                    options: [randCountry, "فرنسا", "إيطاليا", "بريطانيا"].sort(() => 0.5 - Math.random())
                });
            }
        }
        // تحسين خيارات عشوائية واقعية
        EMOJI_QUESTIONS.forEach(q => { if(q.options.length<4) q.options = [q.answer, "مصر", "تركيا", "ألمانيا"].slice(0,4); });
        
        // ========== إدارة اللعبة الموحدة ==========
        let currentMode = "emoji";    // "geo" or "emoji"
        let gameState = {
            currentLevel: 1,
            totalPoints: 0,
            streak: 0,
            levelStars: {},
            soundEnabled: true
        };
        // لكل وضع نستخدم نفس الهيكل لكن data منفصلة للتقدم
        let geoProgress = { currentLevel: 1, levelStars: {}, totalPoints: 0, streak: 0 };
        let emojiProgress = { currentLevel: 1, levelStars: {}, totalPoints: 0, streak: 0 };
        
        function loadModeState() {
            try {
                const g = localStorage.getItem('geoGameProg');
                const e = localStorage.getItem('emojiGameProg');
                if(g) { let pg = JSON.parse(g); geoProgress = pg; }
                if(e) { let pe = JSON.parse(e); emojiProgress = pe; }
            } catch(e) {}
            if(currentMode === "geo") {
                gameState.currentLevel = geoProgress.currentLevel || 1;
                gameState.totalPoints = geoProgress.totalPoints || 0;
                gameState.streak = geoProgress.streak || 0;
                gameState.levelStars = geoProgress.levelStars || {};
            } else {
                gameState.currentLevel = emojiProgress.currentLevel || 1;
                gameState.totalPoints = emojiProgress.totalPoints || 0;
                gameState.streak = emojiProgress.streak || 0;
                gameState.levelStars = emojiProgress.levelStars || {};
            }
            gameState.soundEnabled = (localStorage.getItem('soundGlobal') !== 'false');
        }
        function saveModeState() {
            if(currentMode === "geo") {
                geoProgress.currentLevel = gameState.currentLevel;
                geoProgress.totalPoints = gameState.totalPoints;
                geoProgress.streak = gameState.streak;
                geoProgress.levelStars = gameState.levelStars;
                localStorage.setItem('geoGameProg', JSON.stringify(geoProgress));
            } else {
                emojiProgress.currentLevel = gameState.currentLevel;
                emojiProgress.totalPoints = gameState.totalPoints;
                emojiProgress.streak = gameState.streak;
                emojiProgress.levelStars = gameState.levelStars;
                localStorage.setItem('emojiGameProg', JSON.stringify(emojiProgress));
            }
            localStorage.setItem('soundGlobal', gameState.soundEnabled);
        }
        
        // عناصر
        const splash = document.getElementById('splashScreen');
        const intro = document.getElementById('introScreen');
        const navTabsDiv = document.getElementById('navTabs');
        const statsBarDiv = document.getElementById('statsBar');
        const levelsContainerDiv = document.getElementById('levelsContainer');
        const levelsGridDiv = document.getElementById('levelsGrid');
        const quizModalDiv = document.getElementById('quizModal');
        const resultModalDiv = document.getElementById('resultModal');
        const toastDiv = document.getElementById('toast');
        const soundBtn = document.getElementById('soundToggle');
        const music3 = document.getElementById('music3Stars');
        const music2 = document.getElementById('music2Stars');
        music3.src = '1.mp3'; music2.src = '2.mp3';
        
        let currentGeoQuestions = [];
        let currentGeoStep = 0;
        let currentGeoAnswers = [];
        let currentEmojiQuestion = null;
        let timerInterval = null;
        let timeLeft = 15;
        let isAnsweredFlag = false;
        
        function showMessage(msg) { toastDiv.textContent = msg; toastDiv.classList.add('show'); setTimeout(()=>toastDiv.classList.remove('show'),1800); }
        function playMusic(stars) { if(!gameState.soundEnabled) return; let audio = stars>=2 ? music3 : music2; if(audio.src && audio.src !== window.location.href) audio.play().catch(e=>{}); }
        function updateStatsUI() { document.getElementById('levelNum').innerText = gameState.currentLevel; document.getElementById('pointsNum').innerText = gameState.totalPoints; document.getElementById('streakNum').innerText = gameState.streak; }
        
        function buildLevelsMap() {
            levelsGridDiv.innerHTML = '';
            for(let i=300; i>=1; i--) {
                let card = document.createElement('div'); card.className = 'level-card';
                if(i < gameState.currentLevel) card.classList.add('completed');
                if(i === gameState.currentLevel) card.classList.add('active');
                if(i > gameState.currentLevel) card.classList.add('locked');
                let stars = gameState.levelStars[i] || 0;
                let starStr = '⭐'.repeat(stars) + '☆'.repeat(3-stars);
                card.innerHTML = `<div class="level-number">${i}</div><div class="level-stars">${starStr}</div>`;
                if(i <= gameState.currentLevel) card.onclick = () => startLevel(i);
                levelsGridDiv.appendChild(card);
            }
            setTimeout(()=>{ let act = document.querySelector('.level-card.active'); if(act) act.scrollIntoView({behavior:'smooth',block:'center'}); },80);
        }
        
        function startLevel(level) {
            if(currentMode === "geo") {
                currentGeoQuestions = GEO_QUESTIONS.filter(q => q.level === level).sort((a,b)=>a.step-b.step);
                if(currentGeoQuestions.length !== 3) { showMessage("بيانات المستوى غير كاملة"); return; }
                currentGeoStep = 0; currentGeoAnswers = [];
                showGeoQuestion(0);
            } else {
                let found = EMOJI_QUESTIONS.find(q => q.level === level);
                if(!found) { showMessage("سؤال الإيموجي غير جاهز"); return; }
                currentEmojiQuestion = found;
                isAnsweredFlag = false;
                startEmojiRound();
            }
            quizModalDiv.style.display = 'flex';
        }
        
        // جغرافيا
        function showGeoQuestion(step) {
            let q = currentGeoQuestions[step];
            document.getElementById('visualDisplay').innerHTML = q.cat.includes("أعلام") ? (q.q.includes("🇪🇬")?"🇪🇬":(q.q.includes("🇸🇦")?"🇸🇦":"🏳️")) : "🌍📖";
            document.getElementById('questionText').innerHTML = q.q;
            let opts = [...q.opts].sort(()=>Math.random()-0.5);
            let container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            opts.forEach(opt => { let btn = document.createElement('div'); btn.className='option'; btn.innerText=opt; btn.onclick=()=>checkGeoAnswer(opt===q.a, btn, q); container.appendChild(btn); });
            startTimerGeneric();
        }
        function checkGeoAnswer(isCorrect, btn, question) {
            if(timerInterval) clearInterval(timerInterval);
            isAnsweredFlag=true;
            document.querySelectorAll('.option').forEach(b=>b.style.pointerEvents='none');
            currentGeoAnswers.push({question:question.q, correct:question.a, isCorrect});
            if(isCorrect){ btn.classList.add('correct'); gameState.streak++; let pts= 50 + timeLeft + (gameState.streak*5); gameState.totalPoints+=pts; showMessage(`✅ +${pts} نقطة`); }
            else { btn.classList.add('wrong'); gameState.streak=0; showMessage('❌ خطأ'); document.querySelectorAll('.option').forEach(b=>{if(b.innerText===question.a) b.classList.add('correct');}); }
            updateStatsUI(); saveModeState();
            setTimeout(()=>{ currentGeoStep++; if(currentGeoStep<3) showGeoQuestion(currentGeoStep); else finishGeoLevel(); },1300);
        }
        function finishGeoLevel() {
            let correctCount = currentGeoAnswers.filter(a=>a.isCorrect).length;
            let levelNum = currentGeoQuestions[0].level;
            gameState.levelStars[levelNum] = correctCount;
            gameState.totalPoints += correctCount*100;
            if(correctCount>=2 && levelNum===gameState.currentLevel && levelNum<300) gameState.currentLevel++;
            saveModeState(); updateStatsUI(); playMusic(correctCount);
            if(correctCount===3){ showMessage("🎵 ممتاز! +50 مكافأة"); gameState.totalPoints+=50; saveModeState(); updateStatsUI(); }
            showResultModalGeo(correctCount, currentGeoAnswers);
        }
        function showResultModalGeo(correct, answersArr) {
            let html = `<div>✅ أجابات صحيحة: ${correct} من 3</div>`;
            document.getElementById('resultExtra').innerHTML = html;
            document.getElementById('resultTitle').innerHTML = correct===3 ? "🎉 إنجاز كامل!" : (correct>=1?"📊 أحسنت":"📖 حاول مجدداً");
            quizModalDiv.style.display = 'none';
            resultModalDiv.style.display = 'flex';
        }
        
        // الإيموجي
        function startEmojiRound() {
            let q = currentEmojiQuestion;
            document.getElementById('visualDisplay').innerHTML = q.emoji;
            document.getElementById('questionText').innerHTML = "ما هي الدولة أو المكان المقصود؟";
            let opts = [...q.options].sort(()=>Math.random()-0.5);
            let container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            opts.forEach(opt=>{ let btn=document.createElement('div'); btn.className='option'; btn.innerText=opt; btn.onclick=()=>checkEmojiAnswer(opt===q.answer, btn); container.appendChild(btn); });
            startTimerGeneric();
        }
        function checkEmojiAnswer(isCorrect, btn) {
            if(isAnsweredFlag) return;
            clearInterval(timerInterval); isAnsweredFlag=true;
            document.querySelectorAll('.option').forEach(b=>b.style.pointerEvents='none');
            if(isCorrect){ btn.classList.add('correct'); gameState.streak++; let pts=100+(gameState.streak*10); gameState.totalPoints+=pts; showMessage(`✅ +${pts} نقطة`); }
            else{ btn.classList.add('wrong'); gameState.streak=0; showMessage('❌ خطأ'); document.querySelectorAll('.option').forEach(b=>{if(b.innerText===currentEmojiQuestion.answer) b.classList.add('correct');}); }
            updateStatsUI(); saveModeState();
            setTimeout(()=> finishEmojiLevel(isCorrect),1300);
        }
        function finishEmojiLevel(isCorrect) {
            let stars = isCorrect ? 3 : 0;
            gameState.levelStars[gameState.currentLevel] = stars;
            if(isCorrect && gameState.currentLevel<300) gameState.currentLevel++;
            saveModeState(); updateStatsUI(); playMusic(stars);
            let extraHtml = `<div>${currentEmojiQuestion.emoji}<br><strong>${currentEmojiQuestion.answer}</strong></div>`;
            document.getElementById('resultExtra').innerHTML = extraHtml;
            document.getElementById('resultTitle').innerHTML = isCorrect ? "🎉 إجابة صحيحة!" : "❌ الإجابة الصحيحة";
            quizModalDiv.style.display = 'none';
            resultModalDiv.style.display = 'flex';
        }
        
        function startTimerGeneric() {
            if(timerInterval) clearInterval(timerInterval);
            timeLeft = 15;
            document.getElementById('timerDisplay').innerText = timeLeft;
            timerInterval = setInterval(()=>{
                timeLeft--; document.getElementById('timerDisplay').innerText = Math.max(0,timeLeft);
                if(timeLeft<=0 && !isAnsweredFlag){
                    clearInterval(timerInterval);
                    if(currentMode==="geo") handleGeoTimeout();
                    else handleEmojiTimeout();
                }
            },1000);
        }
        function handleGeoTimeout() {
            isAnsweredFlag=true; gameState.streak=0; showMessage('⏰ انتهى الوقت!');
            document.querySelectorAll('.option').forEach(b=>b.style.pointerEvents='none');
            setTimeout(()=>{ currentGeoAnswers.push({question:currentGeoQuestions[currentGeoStep]?.q, correct:currentGeoQuestions[currentGeoStep]?.a, isCorrect:false}); currentGeoStep++; if(currentGeoStep<3) showGeoQuestion(currentGeoStep); else finishGeoLevel(); },1300);
        }
        function handleEmojiTimeout() {
            isAnsweredFlag=true; gameState.streak=0; showMessage('⏰ انتهى الوقت!');
            document.querySelectorAll('.option').forEach(b=>b.style.pointerEvents='none');
            setTimeout(()=> finishEmojiLevel(false),1300);
        }
        
        function closeResultAndRefresh() {
            resultModalDiv.style.display = 'none';
            buildLevelsMap();
            updateStatsUI();
        }
        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.nav-tab').forEach(tab=>{ if(tab.dataset.mode===mode) tab.classList.add('active'); else tab.classList.remove('active'); });
            loadModeState();
            buildLevelsMap();
            updateStatsUI();
            if(timerInterval) clearInterval(timerInterval);
            quizModalDiv.style.display = 'none';
            resultModalDiv.style.display = 'none';
        }
        function toggleSound() { gameState.soundEnabled = !gameState.soundEnabled; soundBtn.innerText = gameState.soundEnabled ? "🔊" : "🔇"; saveModeState(); showMessage(gameState.soundEnabled ? "🔊 صوت مفعل" : "🔇 صوت معطل"); }
        
        // بداية
        let progLoad=0; let loadInt=setInterval(()=>{ progLoad+=12; document.getElementById('loadingProgress').style.width=progLoad+'%'; if(progLoad>=100){ clearInterval(loadInt); setTimeout(()=>{ splash.style.opacity='0'; setTimeout(()=>{ splash.style.display='none'; intro.style.display='flex'; },400); },300); } },90);
        document.getElementById('startGameBtn').onclick = ()=>{ intro.style.transform='translateY(-100%)'; setTimeout(()=>{ intro.style.display='none'; navTabsDiv.style.display='flex'; statsBarDiv.style.display='flex'; levelsContainerDiv.style.display='block'; switchMode('emoji'); },450); };
        document.getElementById('closeQuizBtn').onclick = ()=>{ if(timerInterval) clearInterval(timerInterval); quizModalDiv.style.display='none'; };
        document.getElementById('nextBtn').onclick = closeResultAndRefresh;
        soundBtn.onclick = toggleSound;
        document.querySelectorAll('.nav-tab').forEach(tab=>{ tab.onclick = ()=> switchMode(tab.dataset.mode); });
        loadModeState(); updateStatsUI(); buildLevelsMap(); soundBtn.innerText = gameState.soundEnabled ? "🔊" : "🔇";
    </script>
</body>
</html>
