<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أطلس المعرفة | رحلة جغرافية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri:wght@400;700&display=swap');

        body {
            font-family: 'Cairo', 'Amiri', serif;
            background: #d9c8a9;
            min-height: 100vh;
            position: relative;
            color: #2c1810;
        }

        /* خلفية ورق قديم */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path d="M10 10 Q 30 5, 50 10 T 90 10" stroke="%238b6b4d" fill="none" stroke-width="0.5" opacity="0.1"/><path d="M10 30 Q 40 25, 70 30 T 90 30" stroke="%238b6b4d" fill="none" stroke-width="0.3" opacity="0.1"/><circle cx="20" cy="70" r="3" fill="%238b6b4d" opacity="0.05"/><circle cx="60" cy="80" r="5" fill="%238b6b4d" opacity="0.05"/></svg>'),
                repeating-linear-gradient(45deg, rgba(139, 107, 77, 0.03) 0px, rgba(139, 107, 77, 0.03) 2px, transparent 2px, transparent 8px);
            background-size: 200px 200px, auto;
            pointer-events: none;
            z-index: -1;
        }

        /* تأثير حواف ورق محروق */
        .paper-edge {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 20px solid transparent;
            border-image: repeating-linear-gradient(45deg, #8b6b4d, #d9c8a9 20px) 30 stretch;
            pointer-events: none;
            z-index: 10;
            opacity: 0.2;
        }

        /* شريط الإحصائيات - نمط خريطة قديم */
        .stats-panel {
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            background: #f1e6d2;
            border: 3px solid #8b6b4d;
            border-radius: 50px 50px 50px 50px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 5px 0 #5d3f2b, inset 0 2px 10px rgba(255, 215, 140, 0.5);
            font-weight: 600;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #3d2a1a;
        }

        .stat-icon {
            font-size: 1.3rem;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
        }

        .stat-value {
            background: #5d3f2b;
            color: #f1e6d2;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.9rem;
            margin-right: 5px;
            border: 1px solid #d9b382;
        }

        /* خريطة المستويات - نمط أطلس قديم */
        .atlas-map {
            position: fixed;
            top: 80px;
            left: 0;
            width: 100%;
            height: calc(100vh - 80px);
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 10px 40px;
            scroll-behavior: smooth;
        }

        .map-scroll {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100%;
        }

        .level-container {
            position: relative;
            width: 100%;
            max-width: 350px;
            margin: 0 auto;
        }

        /* خط المسار - مثل خطوط خرائط الكنز */
        .path-line {
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 100%;
            background: repeating-linear-gradient(to bottom, #8b6b4d, #8b6b4d 10px, #d9b382 10px, #d9b382 20px);
            transform: translateX(-50%);
            opacity: 0.5;
            z-index: 1;
        }

        /* المستويات - مثل أختام شمع قديمة */
        .level-seal {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 25px auto;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .seal-outer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #f1e6d2;
            border: 4px solid #5d3f2b;
            box-shadow: 0 5px 0 #3d2a1a, inset 0 -3px 0 #d9b382;
            transition: all 0.2s;
        }

        .seal-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #d9c8a9;
            border: 2px solid #8b6b4d;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: #2c1810;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }

        /* المستوى النشط */
        .level-seal.active .seal-outer {
            border-color: #b8860b;
            background: #ffd700;
            box-shadow: 0 5px 0 #8b6b4d, inset 0 -3px 0 #ffa500, 0 0 20px rgba(184, 134, 11, 0.3);
        }

        .level-seal.active .seal-inner {
            background: #f4c542;
            border-color: #b8860b;
            color: #3d2a1a;
            font-weight: 900;
        }

        /* المستوى المكتمل */
        .level-seal.completed .seal-outer {
            border-color: #2d5a27;
            background: #4caf50;
            box-shadow: 0 5px 0 #1e4d1e;
        }

        .level-seal.completed .seal-inner {
            background: #81c784;
            border-color: #2d5a27;
        }

        .level-seal.completed .seal-inner::after {
            content: '✓';
            position: absolute;
            top: -5px;
            right: -5px;
            background: #2d5a27;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* المستوى المقفول */
        .level-seal.locked {
            opacity: 0.6;
            filter: grayscale(0.7);
            cursor: not-allowed;
        }

        .level-seal.locked .seal-inner {
            background: #a79e8f;
        }

        .level-seal.locked .seal-inner::before {
            content: '🔒';
            font-size: 1.2rem;
        }

        .level-seal.locked .seal-inner span {
            display: none;
        }

        /* رقم المستوى */
        .level-number {
            font-size: 1.2rem;
            font-weight: 700;
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: #f1e6d2;
            padding: 2px 10px;
            border-radius: 30px;
            border: 2px solid #8b6b4d;
            color: #3d2a1a;
            font-size: 0.9rem;
            white-space: nowrap;
            z-index: 3;
        }

        /* بطاقة السؤال - نمط ورق قديم */
        .question-card {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 500px;
            background: #f9efd8;
            border: 8px solid #8b6b4d;
            border-radius: 30px 30px 30px 30px;
            padding: 25px;
            box-shadow: 0 15px 0 #5d3f2b, inset 0 -5px 0 #d9b382, inset 0 5px 15px rgba(255, 235, 190, 0.8);
            z-index: 100;
            display: none;
            font-family: 'Amiri', serif;
        }

        /* تأثير الورق القديم */
        .question-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="1" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(%23noise)" opacity="0.05"/></svg>');
            background-size: 150px 150px;
            pointer-events: none;
            border-radius: 22px;
            opacity: 0.2;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 2px dashed #8b6b4d;
            padding-bottom: 15px;
        }

        .compass-icon {
            font-size: 2rem;
            transform: rotate(15deg);
            filter: drop-shadow(2px 2px 0 #8b6b4d);
        }

        .category-badge {
            background: #5d3f2b;
            color: #f9efd8;
            padding: 5px 20px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            border: 1px solid #d9b382;
        }

        .progress-indicator {
            display: flex;
            gap: 15px;
            margin-right: auto;
        }

        .progress-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #d9b382;
            border: 1px solid #8b6b4d;
        }

        .progress-dot.active {
            background: #b8860b;
            border-color: #5d3f2b;
            box-shadow: 0 0 0 2px #f9efd8, 0 0 0 3px #b8860b;
        }

        .question-text {
            font-size: 1.7rem;
            font-weight: 700;
            line-height: 1.4;
            margin: 20px 0;
            color: #2c1810;
            text-align: center;
            font-family: 'Amiri', serif;
            border-right: 3px solid #8b6b4d;
            border-left: 3px solid #8b6b4d;
            padding: 10px;
        }

        .options-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 25px 0 15px;
        }

        .option-btn {
            background: #f1e6d2;
            border: 3px solid #8b6b4d;
            border-radius: 60px;
            padding: 15px 10px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #2c1810;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 5px 0 #5d3f2b;
            font-family: 'Cairo', sans-serif;
        }

        .option-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #5d3f2b;
        }

        .option-btn.correct {
            background: #a5d6a5;
            border-color: #2d5a27;
            box-shadow: 0 5px 0 #1e4d1e;
        }

        .option-btn.wrong {
            background: #e6b3b3;
            border-color: #a13d3d;
            box-shadow: 0 5px 0 #6b2b2b;
        }

        .option-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: translateY(3px);
            box-shadow: 0 2px 0 #5d3f2b;
        }

        /* مؤقت على شكل بوصلة */
        .timer-compass {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            font-size: 1.2rem;
            color: #5d3f2b;
        }

        .compass-needle {
            width: 30px;
            height: 30px;
            border: 2px solid #8b6b4d;
            border-radius: 50%;
            position: relative;
        }

        .compass-needle::before {
            content: '↑';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #b8860b;
            font-size: 1.2rem;
        }

        .time-value {
            background: #5d3f2b;
            color: #f9efd8;
            padding: 5px 20px;
            border-radius: 40px;
            font-weight: 600;
        }

        /* رسائل - مثل أختام بريد */
        .message-seal {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #f9efd8;
            border: 3px solid #8b6b4d;
            border-radius: 30px;
            padding: 12px 30px;
            font-weight: 600;
            box-shadow: 0 5px 0 #5d3f2b;
            z-index: 200;
            opacity: 0;
            transition: 0.3s;
            white-space: nowrap;
        }

        .message-seal.show {
            opacity: 1;
            top: 120px;
        }

        /* أزرار جانبية - مثل أدوات الملاحة */
        .nav-tools {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 30;
        }

        .tool-btn {
            width: 50px;
            height: 50px;
            background: #f1e6d2;
            border: 3px solid #8b6b4d;
            border-radius: 50%;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #5d3f2b;
            transition: 0.1s;
        }

        .tool-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #5d3f2b;
        }

        @media (max-width: 500px) {
            .options-container {
                grid-template-columns: 1fr;
            }
            
            .question-text {
                font-size: 1.4rem;
            }
            
            .stats-panel {
                padding: 8px 15px;
            }
            
            .level-seal {
                width: 75px;
                height: 75px;
            }
            
            .seal-inner {
                width: 55px;
                height: 55px;
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="paper-edge"></div>
    
    <!-- شريط الإحصائيات -->
    <div class="stats-panel">
        <div class="stat-item">
            <span class="stat-icon">🧭</span>
            <span>المستوى <span class="stat-value" id="current-level">1</span></span>
        </div>
        <div class="stat-item">
            <span class="stat-icon">📜</span>
            <span>النقاط <span class="stat-value" id="total-points">0</span></span>
        </div>
        <div class="stat-item">
            <span class="stat-icon">⚓</span>
            <span>التتابع <span class="stat-value" id="streak">0</span></span>
        </div>
    </div>

    <!-- الخريطة الرئيسية -->
    <div class="atlas-map" id="atlas-map">
        <div class="map-scroll">
            <div class="level-container" id="level-container">
                <div class="path-line"></div>
                <!-- المستويات ستضاف هنا بالجافاسكريبت -->
            </div>
        </div>
    </div>

    <!-- بطاقة السؤال -->
    <div class="question-card" id="question-card">
        <div class="card-header">
            <span class="compass-icon">🧭</span>
            <span class="category-badge" id="question-category">جغرافيا</span>
            <div class="progress-indicator" id="progress-indicator">
                <span class="progress-dot"></span>
                <span class="progress-dot"></span>
                <span class="progress-dot"></span>
            </div>
        </div>
        
        <div class="question-text" id="question-text">
            تحميل السؤال...
        </div>
        
        <div class="options-container" id="options-container"></div>
        
        <div class="timer-compass">
            <span class="compass-needle"></span>
            <span class="time-value" id="timer-display">15 ث</span>
        </div>
    </div>

    <!-- أدوات الملاحة -->
    <div class="nav-tools">
        <div class="tool-btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">⬆️</div>
        <div class="tool-btn" onclick="game?.scrollToCurrentLevel()">📍</div>
    </div>

    <!-- رسالة -->
    <div class="message-seal" id="message-seal"></div>

    <script>
        // ==================== قاعدة البيانات الجغرافية ====================
        const GeoDatabase = {
            countries: [
                { name: 'مصر', capital: 'القاهرة', currency: 'الجنيه المصري', population: '104 مليون', area: '1,002,000 كم²', continent: 'أفريقيا' },
                { name: 'السعودية', capital: 'الرياض', currency: 'الريال السعودي', population: '35 مليون', area: '2,149,690 كم²', continent: 'آسيا' },
                { name: 'المغرب', capital: 'الرباط', currency: 'الدرهم المغربي', population: '37 مليون', area: '446,550 كم²', continent: 'أفريقيا' },
                { name: 'الجزائر', capital: 'الجزائر', currency: 'الدينار الجزائري', population: '44 مليون', area: '2,381,741 كم²', continent: 'أفريقيا' },
                { name: 'تونس', capital: 'تونس', currency: 'الدينار التونسي', population: '11.8 مليون', area: '163,610 كم²', continent: 'أفريقيا' },
                { name: 'ليبيا', capital: 'طرابلس', currency: 'الدينار الليبي', population: '6.9 مليون', area: '1,759,541 كم²', continent: 'أفريقيا' },
                { name: 'السودان', capital: 'الخرطوم', currency: 'الجنيه السوداني', population: '44 مليون', area: '1,886,068 كم²', continent: 'أفريقيا' },
                { name: 'العراق', capital: 'بغداد', currency: 'الدينار العراقي', population: '40 مليون', area: '438,317 كم²', continent: 'آسيا' },
                { name: 'سوريا', capital: 'دمشق', currency: 'الليرة السورية', population: '18 مليون', area: '185,180 كم²', continent: 'آسيا' },
                { name: 'لبنان', capital: 'بيروت', currency: 'الليرة اللبنانية', population: '6 مليون', area: '10,452 كم²', continent: 'آسيا' },
                { name: 'الأردن', capital: 'عمان', currency: 'الدينار الأردني', population: '10.5 مليون', area: '89,342 كم²', continent: 'آسيا' },
                { name: 'فلسطين', capital: 'القدس', currency: 'الشيكل', population: '5 مليون', area: '27,000 كم²', continent: 'آسيا' },
                { name: 'الإمارات', capital: 'أبوظبي', currency: 'الدرهم الإماراتي', population: '10 مليون', area: '83,600 كم²', continent: 'آسيا' },
                { name: 'الكويت', capital: 'الكويت', currency: 'الدينار الكويتي', population: '4.5 مليون', area: '17,818 كم²', continent: 'آسيا' },
                { name: 'قطر', capital: 'الدوحة', currency: 'الريال القطري', population: '2.8 مليون', area: '11,571 كم²', continent: 'آسيا' },
                { name: 'البحرين', capital: 'المنامة', currency: 'الدينار البحريني', population: '1.7 مليون', area: '765 كم²', continent: 'آسيا' },
                { name: 'عمان', capital: 'مسقط', currency: 'الريال العماني', population: '5 مليون', area: '309,500 كم²', continent: 'آسيا' },
                { name: 'اليمن', capital: 'صنعاء', currency: 'الريال اليمني', population: '30 مليون', area: '527,968 كم²', continent: 'آسيا' },
                { name: 'تركيا', capital: 'أنقرة', currency: 'الليرة التركية', population: '84 مليون', area: '783,356 كم²', continent: 'آسيا' },
                { name: 'إيران', capital: 'طهران', currency: 'الريال الإيراني', population: '85 مليون', area: '1,648,195 كم²', continent: 'آسيا' }
            ],
            
            rivers: [
                { name: 'النيل', length: '6650 كم', location: 'أفريقيا', countries: 'مصر، السودان' },
                { name: 'الأمازون', length: '6400 كم', location: 'أمريكا الجنوبية', countries: 'البرازيل، بيرو' },
                { name: 'اليانغتسي', length: '6300 كم', location: 'الصين', countries: 'الصين' },
                { name: 'الدجلة', length: '1900 كم', location: 'العراق', countries: 'تركيا، العراق' },
                { name: 'الفرات', length: '2800 كم', location: 'العراق', countries: 'تركيا، سوريا، العراق' }
            ],
            
            mountains: [
                { name: 'جبال الأطلس', height: '4167 م', location: 'المغرب الجزائر تونس' },
                { name: 'جبال الحجاز', height: '2100 م', location: 'السعودية' },
                { name: 'جبال لبنان الشرقية', height: '2600 م', location: 'لبنان سوريا' }
            ]
        };

        // ==================== مولد الأسئلة الذكي ====================
        class QuestionGenerator {
            constructor(db) {
                this.db = db;
                this.questionTypes = ['capital', 'currency', 'population', 'area', 'continent'];
            }

            generateQuestion(level) {
                const type = this.questionTypes[Math.floor(Math.random() * this.questionTypes.length)];
                const country = this.db.countries[Math.floor(Math.random() * this.db.countries.length)];
                
                // زيادة الصعوبة مع المستوى
                const difficulty = Math.min(level / 100, 0.7); // 70% كحد أقصى
                const useHardQuestion = Math.random() < difficulty;
                
                switch(type) {
                    case 'capital':
                        return {
                            category: '🏛️ عواصم',
                            question: `ما عاصمة ${country.name}؟`,
                            correct: country.capital,
                            options: this.generateOptions(country.capital, 'capital')
                        };
                        
                    case 'currency':
                        return {
                            category: '💰 عملات',
                            question: `ما عملة ${country.name} الرسمية؟`,
                            correct: country.currency,
                            options: this.generateOptions(country.currency, 'currency')
                        };
                        
                    case 'population':
                        return {
                            category: '👥 سكان',
                            question: `كم يبلغ عدد سكان ${country.name} تقريباً؟`,
                            correct: country.population,
                            options: this.generateOptions(country.population, 'population')
                        };
                        
                    case 'area':
                        return {
                            category: '🗺️ مساحة',
                            question: `ما مساحة ${country.name} تقريباً؟`,
                            correct: country.area,
                            options: this.generateOptions(country.area, 'area')
                        };
                        
                    case 'continent':
                        return {
                            category: '🌍 قارات',
                            question: `في أي قارة تقع ${country.name}؟`,
                            correct: country.continent,
                            options: this.generateOptions(country.continent, 'continent')
                        };
                        
                    default:
                        return {
                            category: '🌎 معلومات عامة',
                            question: `ما عاصمة ${country.name}؟`,
                            correct: country.capital,
                            options: this.generateOptions(country.capital, 'capital')
                        };
                }
            }

            generateOptions(correct, type) {
                let options = [correct];
                let allValues = [];
                
                // جمع كل القيم الممكنة من نفس النوع
                this.db.countries.forEach(c => {
                    if (type === 'capital') allValues.push(c.capital);
                    else if (type === 'currency') allValues.push(c.currency);
                    else if (type === 'population') allValues.push(c.population);
                    else if (type === 'area') allValues.push(c.area);
                    else if (type === 'continent') allValues.push(c.continent);
                });
                
                // إزالة التكرارات والقيمة الصحيحة
                allValues = [...new Set(allValues)].filter(v => v !== correct);
                
                // إضافة خيارات عشوائية
                while (options.length < 4) {
                    const randomValue = allValues[Math.floor(Math.random() * allValues.length)];
                    if (!options.includes(randomValue)) {
                        options.push(randomValue);
                    }
                }
                
                // خلط عشوائي
                return this.shuffleArray(options);
            }

            shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }
        }

        // ==================== اللعبة الرئيسية ====================
        class GeographyGame {
            constructor() {
                this.currentLevel = parseInt(localStorage.getItem('geo_level')) || 1;
                this.totalPoints = parseInt(localStorage.getItem('geo_points')) || 0;
                this.streak = parseInt(localStorage.getItem('geo_streak')) || 0;
                this.currentStep = 0;
                this.timer = null;
                this.timeLeft = 15;
                this.questionGen = new QuestionGenerator(GeoDatabase);
                
                this.init();
            }

            init() {
                this.buildMap();
                this.updateStats();
                this.setupEventListeners();
            }

            buildMap() {
                const container = document.getElementById('level-container');
                container.innerHTML = '<div class="path-line"></div>';
                
                // بناء 1000 مستوى
                for (let i = 1000; i >= 1; i--) {
                    const seal = document.createElement('div');
                    seal.className = `level-seal ${i < this.currentLevel ? 'completed' : (i === this.currentLevel ? 'active' : 'locked')}`;
                    seal.setAttribute('data-level', i);
                    
                    // حركة متعرجة بسيطة
                    const xOffset = Math.sin(i * 0.2) * 40;
                    seal.style.transform = `translateX(${xOffset}px)`;
                    
                    // الرقم
                    const number = document.createElement('div');
                    number.className = 'level-number';
                    number.textContent = `المستوى ${i}`;
                    
                    // الأختام
                    const outer = document.createElement('div');
                    outer.className = 'seal-outer';
                    
                    const inner = document.createElement('div');
                    inner.className = 'seal-inner';
                    
                    if (i <= this.currentLevel) {
                        const span = document.createElement('span');
                        span.textContent = i;
                        inner.appendChild(span);
                    } else {
                        const span = document.createElement('span');
                        span.style.display = 'none';
                        inner.appendChild(span);
                    }
                    
                    seal.appendChild(number);
                    seal.appendChild(outer);
                    seal.appendChild(inner);
                    
                    if (i <= this.currentLevel) {
                        seal.onclick = () => this.openLevel(i);
                    }
                    
                    container.appendChild(seal);
                }
            }

            openLevel(level) {
                if (level > this.currentLevel) return;
                
                this.currentStep = 0;
                this.timeLeft = 15;
                this.showQuestionCard();
            }

            showQuestionCard() {
                document.getElementById('question-card').style.display = 'block';
                this.loadQuestion();
            }

            loadQuestion() {
                this.updateProgressDots();
                
                const question = this.questionGen.generateQuestion(this.currentLevel);
                
                document.getElementById('question-category').textContent = question.category;
                document.getElementById('question-text').textContent = question.question;
                
                const container = document.getElementById('options-container');
                container.innerHTML = '';
                
                question.options.forEach(option => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = option;
                    btn.onclick = () => this.checkAnswer(option === question.correct, btn);
                    container.appendChild(btn);
                });
                
                this.startTimer();
            }

            updateProgressDots() {
                const dots = document.querySelectorAll('.progress-dot');
                dots.forEach((dot, i) => {
                    dot.className = 'progress-dot';
                    if (i === this.currentStep) {
                        dot.classList.add('active');
                    }
                });
            }

            startTimer() {
                if (this.timer) clearInterval(this.timer);
                
                this.timeLeft = 15;
                const timerDisplay = document.getElementById('timer-display');
                
                this.timer = setInterval(() => {
                    this.timeLeft -= 0.1;
                    timerDisplay.textContent = `${this.timeLeft.toFixed(1)} ث`;
                    
                    if (this.timeLeft <= 0) {
                        clearInterval(this.timer);
                        this.handleTimeout();
                    }
                }, 100);
            }

            checkAnswer(isCorrect, btn) {
                clearInterval(this.timer);
                
                const allBtns = document.querySelectorAll('.option-btn');
                allBtns.forEach(b => b.disabled = true);
                
                if (isCorrect) {
                    btn.classList.add('correct');
                    this.streak++;
                    
                    const timeBonus = Math.floor(this.timeLeft);
                    const pointsEarned = 50 + timeBonus + (this.streak * 5);
                    this.totalPoints += pointsEarned;
                    
                    localStorage.setItem('geo_points', this.totalPoints);
                    localStorage.setItem('geo_streak', this.streak);
                    
                    this.showMessage(`✨ +${pointsEarned} نقطة! (سرعة: +${timeBonus})`);
                    
                    setTimeout(() => {
                        this.currentStep++;
                        
                        if (this.currentStep < 3) {
                            this.loadQuestion();
                        } else {
                            this.completeLevel();
                        }
                    }, 800);
                    
                } else {
                    btn.classList.add('wrong');
                    this.streak = 0;
                    localStorage.setItem('geo_streak', 0);
                    
                    this.showMessage('❌ إجابة خاطئة');
                    
                    setTimeout(() => {
                        document.getElementById('question-card').style.display = 'none';
                    }, 1000);
                }
                
                this.updateStats();
            }

            handleTimeout() {
                this.showMessage('⏰ انتهى الوقت!');
                this.streak = 0;
                localStorage.setItem('geo_streak', 0);
                
                setTimeout(() => {
                    document.getElementById('question-card').style.display = 'none';
                }, 1000);
                
                this.updateStats();
            }

            completeLevel() {
                this.currentLevel++;
                this.totalPoints += 200;
                
                localStorage.setItem('geo_level', this.currentLevel);
                localStorage.setItem('geo_points', this.totalPoints);
                
                this.showMessage('🎉 أتقنت هذا المستوى!');
                
                setTimeout(() => {
                    document.getElementById('question-card').style.display = 'none';
                    this.buildMap(); // إعادة بناء الخريطة
                    this.scrollToCurrentLevel();
                }, 1500);
                
                this.updateStats();
            }

            showMessage(text) {
                const msg = document.getElementById('message-seal');
                msg.textContent = text;
                msg.classList.add('show');
                
                setTimeout(() => {
                    msg.classList.remove('show');
                }, 2000);
            }

            updateStats() {
                document.getElementById('current-level').textContent = this.currentLevel;
                document.getElementById('total-points').textContent = this.totalPoints;
                document.getElementById('streak').textContent = this.streak;
            }

            scrollToCurrentLevel() {
                setTimeout(() => {
                    const active = document.querySelector('.level-seal.active');
                    if (active) {
                        active.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }

            setupEventListeners() {
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        document.getElementById('question-card').style.display = 'none';
                        clearInterval(this.timer);
                    }
                });
            }
        }

        // بدء اللعبة
        const game = new GeographyGame();
        window.game = game; // للوصول من أدوات التحكم
    </script>
</body>
