<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>موسوعة الجغرافيا | 3000 سؤال</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', 'Cairo', Tahoma, sans-serif;
            background: #e8d6b5;
            min-height: 100vh;
            color: #3d2b1a;
        }

        /* خلفية ورقية */
        .paper-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(160, 130, 80, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(160, 130, 80, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: -1;
        }

        /* شريط المعلومات */
        .info-bar {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            background: #f3e9d2;
            border: 3px solid #9b7b5e;
            border-radius: 50px;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 5px 0 #6b4f3a;
            z-index: 100;
            font-weight: bold;
        }

        .badge {
            background: #9b7b5e;
            color: #f3e9d2;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 0.9rem;
            margin-right: 8px;
        }

        /* خريطة المستويات */
        .level-map {
            position: fixed;
            top: 80px;
            bottom: 0;
            left: 0;
            right: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 10px 30px;
            scroll-behavior: smooth;
        }

        .levels-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            max-width: 400px;
            margin: 0 auto;
            position: relative;
        }

        .path-line {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 4px;
            background: repeating-linear-gradient(to bottom, #9b7b5e 0px, #9b7b5e 10px, #c4a484 10px, #c4a484 20px);
            transform: translateX(-50%);
            opacity: 0.5;
            z-index: 1;
        }

        .level-card {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 5px 0;
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 2;
            background: #f3e9d2;
            border: 4px solid #9b7b5e;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 #6b4f3a;
        }

        .level-card[data-x="left"] { transform: translateX(-40px); }
        .level-card[data-x="right"] { transform: translateX(40px); }

        .level-card.completed {
            background: #a5c9a5;
            border-color: #2d6a2d;
            box-shadow: 0 6px 0 #1e4d1e;
        }

        .level-card.active {
            background: #f7d98c;
            border-color: #c99c00;
            box-shadow: 0 6px 0 #a67c00, 0 0 15px #ffb347;
        }

        .level-card.locked {
            opacity: 0.5;
            filter: grayscale(0.8);
            cursor: not-allowed;
        }

        .level-number {
            font-size: 2.5rem;
            font-weight: 900;
            line-height: 1;
        }

        .level-label {
            font-size: 0.8rem;
            background: #9b7b5e;
            color: white;
            padding: 3px 12px;
            border-radius: 30px;
            margin-top: 5px;
        }

        .completed .level-label { background: #1e4d1e; }
        .active .level-label { background: #a67c00; }

        /* نافذة السؤال */
        .quiz-window {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }

        .quiz-card {
            width: 90%;
            max-width: 500px;
            background: #f9efd8;
            border: 6px solid #9b7b5e;
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 15px 0 #6b4f3a;
        }

        .quiz-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #9b7b5e;
        }

        .category {
            background: #9b7b5e;
            color: white;
            padding: 5px 20px;
            border-radius: 40px;
            font-weight: 600;
        }

        .step-counter {
            display: flex;
            gap: 10px;
        }

        .step-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #c4a484;
            border: 1px solid #6b4f3a;
        }

        .step-dot.active {
            background: #c99c00;
            border-color: #6b4f3a;
            box-shadow: 0 0 0 2px #f9efd8;
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 25px 0;
            text-align: center;
            line-height: 1.4;
        }

        .options-area {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 20px 0;
        }

        .option-item {
            background: #f3e9d2;
            border: 3px solid #9b7b5e;
            border-radius: 60px;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 5px 0 #6b4f3a;
            transition: 0.1s;
        }

        .option-item:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #6b4f3a;
        }

        .option-item.correct {
            background: #a5d6a5;
            border-color: #2d6a2d;
            box-shadow: 0 5px 0 #1e4d1e;
        }

        .option-item.wrong {
            background: #f5b5b5;
            border-color: #b33f3f;
            box-shadow: 0 5px 0 #7a2e2e;
        }

        .option-item:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: translateY(3px);
            box-shadow: 0 2px 0 #6b4f3a;
        }

        .timer-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #6b4f3a;
        }

        .timer-value {
            background: #6b4f3a;
            color: #f9efd8;
            padding: 5px 20px;
            border-radius: 40px;
        }

        /* رسالة منبثقة */
        .popup-message {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #f9efd8;
            border: 3px solid #9b7b5e;
            border-radius: 50px;
            padding: 12px 30px;
            font-weight: 600;
            box-shadow: 0 5px 0 #6b4f3a;
            z-index: 2000;
            opacity: 0;
            transition: 0.3s;
            white-space: nowrap;
            pointer-events: none;
        }

        .popup-message.show {
            opacity: 1;
            top: 120px;
        }

        /* احتفال */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3000;
            display: none;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 20px;
            background: #c99c00;
            animation: fall 3s linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); }
        }

        @media (max-width: 500px) {
            .options-area { grid-template-columns: 1fr; }
            .level-card { width: 100px; height: 100px; }
            .level-number { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="paper-bg"></div>

    <!-- شريط المعلومات -->
    <div class="info-bar">
        <span>🧭 المستوى <span class="badge" id="levelDisplay">1</span></span>

    <!-- خريطة المستويات -->
    <div class="level-map" id="levelMap">
        <div class="levels-grid" id="levelsGrid">
            <div class="path-line"></div>

    </div>

    <!-- نافذة السؤال -->
    <div class="quiz-window" id="quizWindow">
        <div class="quiz-card">
            <div class="quiz-header">
                <span class="category" id="questionCategory">جغرافيا</span>
                <div class="step-counter" id="stepCounter">
                    <span class="step-dot"></span>
                    <span class="step-dot"></span>
                    <span class="step-dot"></span>
                </div>
            </div>
            
            <div class="question-text" id="questionText">تحميل...</div>
            
            <div class="options-area" id="optionsArea"></div>
            
            <div class="timer-box">
                <span>⏳</span>
                <span class="timer-value" id="timerDisplay">15 ث</span>
            </div>
        </div>
    </div>

    <!-- رسائل -->
    <div class="popup-message" id="popupMessage"></div>

    <!-- احتفال -->
    <div class="celebration" id="celebration"></div>

    <script>
        // ===================================================
        // 3000 سؤال جغرافي فريد تماماً (كل سؤال مختلف)
        // ===================================================
        const QuestionsDB = [
            // ========== المستويات 1-300 : عواصم الدول العربية ==========

            ...(() => {

                    { country: "سوريا", capital: "دمشق" },

                    { country: "البحرين", capital: "المنامة" },
                    { country: "عمان", capital: "مسقط" },

                    { country: "المغرب", capital: "الرباط" },

                    { country: "جيبوتي", capital: "جيبوتي" },
                    { country: "جزر القمر", capital: "موروني" }
                ];
                
                let questions = [];
                for (let i = 0; i < 300; i++) {
                    const c = countries[i % countries.length];
                    // خيارات مختلفة لكل سؤال
                    const wrongOptions = countries
                        .filter(x => x.capital !== c.capital)
                        .map(x => x.capital)
                        .sort(() => 0.5 - Math.random())
                        .slice(0, 3);
                    
                    questions.push({
                        level: i + 1,
                        category: "🏛️ عواصم عربية",
                        q: `ما عاصمة ${c.country}؟`,
                        a: c.capital,
                        opts: [c.capital, ...wrongOptions].sort(() => 0.5 - Math.random())
                    });
                }
                return questions;
            })(),

            ...(() => {

                    { q: "أعمق نقطة في المحيط", a: "خندق ماريانا", opts: ["خندق ماريانا", "خندق بورتوريكو", "خندق الفلبين", "خندق تونغا"] },
                    { q: "أطول نهر في أفريقيا", a: "النيل", opts: ["النيل", "الكونغو", "النيجر", "الزمبيزي"] },

            // ========== المستويات 2701-3000 : أسئلة التحدي ==========
            // 300 سؤال صعب جداً
            ...(() => {

                    { q: "كم دولة عربية", a: "22", opts: ["22", "21", "23", "20"] },
                    { q: "أعلى عاصمة في العالم", a: "لاباز", opts: ["لاباز", "كيتو", "بوغوتا", "مكسيكو سيتي"] },
                    { q: "أخفض نقطة على الأرض", a: "البحر الميت", opts: ["البحر الميت", "وادي الموت", "بحيرة طبريا", "منخفض القطارة"] },
                    { q: "أقدم مدينة في العالم", a: "أريحا", opts: ["أريحا", "دمشق", "بغداد", "الأقصر"] },
                    { q: "أكبر دولة من حيث السكان", a: "الهند", opts: ["الهند", "الصين", "الولايات المتحدة", "إندونيسيا"] },
                    { q: "أصغر دولة في العالم", a: "الفاتيكان", opts: ["الفاتيكان", "موناكو", "سان مارينو", "مالطا"] },
                    { q: "أكثر مدينة من حيث السكان", a: "طوكيو", opts: ["طوكيو", "دلهي", "شنغهاي", "ساو باولو"] },
                    { q: "أكبر دولة في أمريكا الجنوبية", a: "البرازيل", opts: ["البرازيل", "الأرجنتين", "بيرو", "كولومبيا"] },
                    { q: "أكبر دولة في أفريقيا", a: "الجزائر", opts: ["الجزائر", "السودان", "الكونغو", "ليبيا"] }
                ];
                
                let questions = [];
                for (let i = 0; i < 300; i++) {
                    const h = hard[i % hard.length];
                    
                    questions.push({
                        level: 2701 + i,
                        category: "🏆 تحدّي الخبراء",
                        q: `${h.q}؟`,
                        a: h.a,

                    });

            })()
        ];

        // التحقق من العدد الإجمالي
        console.log(`إجمالي الأسئلة: ${QuestionsDB.length} سؤال`);

        // ============================================
        // نظام اللعبة
        // ============================================
        class GeographyGame {
            constructor() {
                this.currentLevel = parseInt(localStorage.getItem('geo_level')) || 1;
                this.totalPoints = parseInt(localStorage.getItem('geo_points')) || 0;
                this.streak = parseInt(localStorage.getItem('geo_streak')) || 0;
                this.step = 0;
                this.timer = null;
                this.timeLeft = 15;
                
                this.init();
            }

            init() {
                this.buildLevels();
                this.updateDisplay();
                this.setupEvents();
            }

            buildLevels() {
                const grid = document.getElementById('levelsGrid');
                const fragment = document.createDocumentFragment();
                
                // خط المسار
                const pathLine = document.createElement('div');
                pathLine.className = 'path-line';
                fragment.appendChild(pathLine);
                
                for (let i = 1000; i >= 1; i--) {
                    const card = document.createElement('div');
                    card.className = `level-card`;
                    if (i < this.currentLevel) card.classList.add('completed');
                    else if (i === this.currentLevel) card.classList.add('active');
                    else card.classList.add('locked');
                    
                    card.setAttribute('data-x', i % 2 === 0 ? 'left' : 'right');
                    
                    card.innerHTML = `
                        <span class="level-number">${i <= this.currentLevel ? i : '🔒'}</span>
                        <span class="level-label">${i <= this.currentLevel ? 'مفتوح' : 'مقفول'}</span>
                    `;
                    
                    if (i <= this.currentLevel) {
                        card.onclick = () => this.openLevel(i);
                    }
                    
                    fragment.appendChild(card);
                }
                
                grid.innerHTML = '';
                grid.appendChild(fragment);
            }

            openLevel(level) {
                if (level !== this.currentLevel) return;
                this.step = 0;
                this.timeLeft = 15;
                document.getElementById('quizWindow').style.display = 'flex';
                this.loadQuestion();
            }

            loadQuestion() {
                // تحديث النقاط
                const dots = document.querySelectorAll('.step-dot');
                dots.forEach((dot, i) => {
                    dot.className = 'step-dot';
                    if (i === this.step) dot.classList.add('active');
                });
                
                // البحث عن سؤال للمستوى الحالي
                let question = QuestionsDB.find(q => q.level === this.currentLevel);
                
                // إذا لم نجد سؤال محدد، نأخذ سؤال عشوائي من نفس النطاق
                if (!question) {
                    const levelGroup = Math.floor((this.currentLevel - 1) / 100) * 100 + 1;
                    const pool = QuestionsDB.filter(q => q.level >= levelGroup && q.level < levelGroup + 100);
                    question = pool[Math.floor(Math.random() * pool.length)] || QuestionsDB[0];
                }
                
                // عرض السؤال
                document.getElementById('questionCategory').textContent = question.category || 'جغرافيا';
                document.getElementById('questionText').textContent = question.q;
                
                // عرض الخيارات
                const area = document.getElementById('optionsArea');
                area.innerHTML = '';
                
                question.opts.forEach(opt => {
                    const btn = document.createElement('div');
                    btn.className = 'option-item';
                    btn.textContent = opt;
                    btn.onclick = () => this.checkAnswer(opt === question.a, btn);
                    area.appendChild(btn);
                });
                
                // بدء المؤقت
                this.startTimer();
            }

            startTimer() {
                if (this.timer) clearInterval(this.timer);
                
                this.timeLeft = 15;
                const timerDisplay = document.getElementById('timerDisplay');
                
                this.timer = setInterval(() => {
                    this.timeLeft -= 0.1;
                    timerDisplay.textContent = `${this.timeLeft.toFixed(1)} ث`;
                    
                    if (this.timeLeft <= 0) {
                        clearInterval(this.timer);
                        this.timeout();
                    }
                }, 100);
            }

            checkAnswer(correct, btn) {
                clearInterval(this.timer);
                
                document.querySelectorAll('.option-item').forEach(b => b.disabled = true);
                
                if (correct) {
                    btn.classList.add('correct');
                    this.streak++;
                    
                    const timeBonus = Math.floor(this.timeLeft);
                    const points = 50 + timeBonus + (this.streak * 5);
                    this.totalPoints += points;
                    
                    localStorage.setItem('geo_points', this.totalPoints);
                    localStorage.setItem('geo_streak', this.streak);
                    
                    this.showMessage(`✨ +${points} نقطة! (سرعة: +${timeBonus})`);
                    
                    setTimeout(() => {
                        this.step++;
                        
                        if (this.step < 3) {
                            this.loadQuestion();
                        } else {
                            this.levelComplete();
                        }
                    }, 700);
                    
                } else {
                    btn.classList.add('wrong');
                    this.streak = 0;
                    localStorage.setItem('geo_streak', 0);
                    
                    this.showMessage('❌ إجابة خاطئة');
                    
                    setTimeout(() => {
                        document.getElementById('quizWindow').style.display = 'none';
                    }, 1000);
                }
                
                this.updateDisplay();
            }

            timeout() {
                this.showMessage('⏰ انتهى الوقت');
                this.streak = 0;
                localStorage.setItem('geo_streak', 0);
                
                setTimeout(() => {
                    document.getElementById('quizWindow').style.display = 'none';
                }, 1000);
                
                this.updateDisplay();
            }

            levelComplete() {
                if (this.currentLevel < 1000) {
                    this.currentLevel++;
                } else {
                    this.showVictory();
                }
                
                this.totalPoints += 200;
                
                localStorage.setItem('geo_level', this.currentLevel);
                localStorage.setItem('geo_points', this.totalPoints);
                
                setTimeout(() => {
                    document.getElementById('quizWindow').style.display = 'none';
                    this.buildLevels();
                    this.updateDisplay();
                    this.scrollToCurrent();
                }, 1000);
            }

            showVictory() {
                const celebration = document.getElementById('celebration');
                celebration.style.display = 'block';
                
                for (let i = 0; i < 150; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.animationDelay = Math.random() * 3 + 's';
                    confetti.style.background = `hsl(${Math.random() * 360}, 80%, 60%)`;
                    celebration.appendChild(confetti);
                }
                
                this.showMessage('🏆 ألف مبروك! أكملت 1000 مستوى وأصبحت خبيراً في الجغرافيا 🏆');
                
                setTimeout(() => {
                    celebration.style.display = 'none';
                    celebration.innerHTML = '';
                }, 6000);
            }

            showMessage(text) {
                const msg = document.getElementById('popupMessage');
                msg.textContent = text;
                msg.classList.add('show');
                
                setTimeout(() => msg.classList.remove('show'), 2000);
            }

            updateDisplay() {
                document.getElementById('levelDisplay').textContent = this.currentLevel;
                document.getElementById('pointsDisplay').textContent = this.totalPoints;
                document.getElementById('streakDisplay').textContent = this.streak;
            }

            scrollToCurrent() {
                setTimeout(() => {
                    const active = document.querySelector('.level-card.active');
                    if (active) active.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 200);
            }

            setupEvents() {
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        document.getElementById('quizWindow').style.display = 'none';
                        clearInterval(this.timer);
                    }
                });
            }
        }

        // بدء اللعبة
        const game = new GeographyGame();
    </script>
