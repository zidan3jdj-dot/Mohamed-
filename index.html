<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>الجغرافي - Geo Challenge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
        }

        /* شريط النقاط */
        .stats-bar {
            background: rgba(255,255,255,0.95);
            border-radius: 60px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f0f0f0;
            padding: 5px 15px;
            border-radius: 40px;
        }

        .stat span:first-child {
            font-size: 1.3rem;
        }

        .stat span:last-child {
            font-weight: bold;
            font-size: 1.2rem;
            color: #667eea;
        }

        /* حاوية المستويات */
        .levels-container {
            background: rgba(255,255,255,0.1);
            border-radius: 30px;
            padding: 15px;
            height: calc(100vh - 100px);
            overflow-y: auto;
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
        }

        /* بطاقة المستوى */
        .level-card {
            background: white;
            border-radius: 20px;
            padding: 15px 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            border: 2px solid transparent;
        }

        .level-card:active {
            transform: scale(0.95);
        }

        .level-card.completed {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
        }

        .level-card.active {
            border-color: #f1c40f;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            transform: scale(1.05);
        }

        .level-card.locked {
            opacity: 0.5;
            filter: grayscale(0.5);
            cursor: not-allowed;
        }

        .level-number {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .level-stars {
            margin-top: 5px;
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        /* نافذة السؤال */
        .quiz-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .quiz-card {
            background: white;
            border-radius: 40px;
            max-width: 500px;
            width: 100%;
            padding: 25px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .category {
            background: #667eea;
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
        }

        .stars-progress {
            display: flex;
            gap: 8px;
        }

        .star-progress {
            font-size: 1.8rem;
            color: #ddd;
        }

        .star-progress.active {
            color: #f1c40f;
        }

        .flag {
            font-size: 5rem;
            text-align: center;
            margin: 15px 0;
        }

        .question {
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }

        .option {
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 60px;
            padding: 15px;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option:active {
            transform: scale(0.98);
        }

        .option.correct {
            background: #2ecc71;
            border-color: #27ae60;
            color: white;
        }

        .option.wrong {
            background: #e74c3c;
            border-color: #c0392b;
            color: white;
        }

        .timer {
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            background: #f0f0f0;
            border-radius: 60px;
        }

        .timer span {
            font-size: 2rem;
            font-weight: bold;
            color: #e74c3c;
            font-family: monospace;
        }

        .close-quiz {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: #95a5a6;
            border: none;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        /* نافذة النتائج */
        .result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1100;
            padding: 20px;
        }

        .result-card {
            background: white;
            border-radius: 40px;
            max-width: 500px;
            width: 100%;
            padding: 25px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .result-title {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #667eea;
        }

        .result-item {
            background: #f5f5f5;
            border-radius: 20px;
            padding: 12px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-icon {
            font-size: 1.5rem;
        }

        .result-question {
            flex: 1;
            font-size: 0.9rem;
        }

        .result-correct {
            background: #2ecc71;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .next-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 25px;
            border-radius: 60px;
            font-size: 0.9rem;
            z-index: 1200;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        /* صوت */
        audio {
            display: none;
        }

        @media (max-width: 500px) {
            .levels-grid {
                grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
                gap: 8px;
            }
            .level-card {
                padding: 10px 5px;
            }
            .level-number {
                font-size: 1.1rem;
            }
            .question {
                font-size: 1.1rem;
            }
            .option {
                padding: 12px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <!-- شريط النقاط -->
    <div class="stats-bar">
        <div class="stat">
            <span>🏆</span>
            <span id="levelNum">1</span>
            <span>/300</span>
        </div>
        <div class="stat">
            <span>⭐</span>
            <span id="pointsNum">0</span>
        </div>
        <div class="stat">
            <span>⚡</span>
            <span id="streakNum">0</span>
        </div>
    </div>

    <!-- المستويات -->
    <div class="levels-container">
        <div class="levels-grid" id="levelsGrid"></div>
    </div>

    <!-- نافذة السؤال -->
    <div class="quiz-modal" id="quizModal">
        <div class="quiz-card">
            <div class="quiz-header">
                <div class="category" id="category">جغرافيا</div>
                <div class="stars-progress" id="starsProgress">
                    <span class="star-progress">⭐</span>
                    <span class="star-progress">⭐</span>
                    <span class="star-progress">⭐</span>
                </div>
            </div>
            <div class="flag" id="flagDisplay" style="display: none;">🏳️</div>
            <div class="question" id="questionText"></div>
            <div class="options" id="optionsContainer"></div>
            <div class="timer">
                ⏳ <span id="timerDisplay">15</span> ثانية
            </div>
            <div class="close-quiz" id="closeQuizBtn">✖️ خروج</div>
        </div>
    </div>

    <!-- نافذة النتائج -->
    <div class="result-modal" id="resultModal">
        <div class="result-card">
            <div class="result-title" id="resultTitle">📊 النتيجة</div>
            <div id="resultsList"></div>
            <button class="next-btn" id="nextBtn">متابعة</button>
        </div>
    </div>

    <!-- رسالة منبثقة -->
    <div class="toast" id="toast">رسالة</div>

    <!-- عنصر الصوت -->
    <audio id="victoryAudio" preload="auto"></audio>

    <script>
        // ==================== الأسئلة ====================
        const QUESTIONS = [
            // مستوى 1
            { level: 1, step: 0, cat: "🏛️ عواصم", q: "ما عاصمة مصر؟", a: "القاهرة", opts: ["القاهرة", "الإسكندرية", "الجيزة", "أسوان"] },
            { level: 1, step: 1, cat: "🌊 أنهار", q: "أين يقع نهر النيل؟", a: "مصر", opts: ["مصر", "السودان", "إثيوبيا", "أوغندا"] },
            { level: 1, step: 2, cat: "🚢 مضائق", q: "أين يقع مضيق جبل طارق؟", a: "بين إسبانيا والمغرب", opts: ["بين إسبانيا والمغرب", "بين إيطاليا وتونس", "بين تركيا واليونان", "بين اليمن وجيبوتي"] },
            
            // مستوى 2
            { level: 2, step: 0, cat: "🏛️ عواصم", q: "ما عاصمة السعودية؟", a: "الرياض", opts: ["الرياض", "جدة", "مكة", "الدمام"] },
            { level: 2, step: 1, cat: "🏝️ جزر", q: "أين تقع جزر المالديف؟", a: "المحيط الهندي", opts: ["المحيط الهندي", "المحيط الهادئ", "المحيط الأطلسي", "البحر الأحمر"] },
            { level: 2, step: 2, cat: "🗺️ دول حبيسة", q: "أي دولة أوروبية حبيسة؟", a: "النمسا", opts: ["النمسا", "إيطاليا", "فرنسا", "إسبانيا"] },
            
            // مستوى 3
            { level: 3, step: 0, cat: "🏛️ عواصم", q: "ما عاصمة العراق؟", a: "بغداد", opts: ["بغداد", "البصرة", "الموصل", "أربيل"] },
            { level: 3, step: 1, cat: "🌊 بحار", q: "أين يقع البحر المتوسط؟", a: "بين أوروبا وأفريقيا", opts: ["بين أوروبا وأفريقيا", "بين آسيا وأفريقيا", "بين أوروبا وآسيا", "بين أمريكا وأوروبا"] },
            { level: 3, step: 2, cat: "🇪🇬 أعلام", q: "ما دولة علمها؟ 🇪🇬", a: "مصر", opts: ["مصر", "سوريا", "العراق", "اليمن"] },
            
            // مستوى 4
            { level: 4, step: 0, cat: "🏛️ عواصم", q: "ما عاصمة سوريا؟", a: "دمشق", opts: ["دمشق", "حلب", "حمص", "اللاذقية"] },
            { level: 4, step: 1, cat: "🏔️ جبال", q: "أين تقع جبال الألب؟", a: "أوروبا", opts: ["أوروبا", "آسيا", "أمريكا الجنوبية", "أفريقيا"] },
            { level: 4, step: 2, cat: "🇸🇦 أعلام", q: "ما دولة علمها؟ 🇸🇦", a: "السعودية", opts: ["السعودية", "الكويت", "قطر", "الإمارات"] },
            
            // مستوى 5
            { level: 5, step: 0, cat: "🏛️ عواصم", q: "ما عاصمة لبنان؟", a: "بيروت", opts: ["بيروت", "طرابلس", "صيدا", "صور"] },
            { level: 5, step: 1, cat: "🚢 مضائق", q: "أين يقع مضيق البوسفور؟", a: "تركيا", opts: ["تركيا", "روسيا", "اليونان", "بلغاريا"] },
            { level: 5, step: 2, cat: "🇶🇦 أعلام", q: "ما دولة علمها؟ 🇶🇦", a: "قطر", opts: ["قطر", "البحرين", "الكويت", "الإمارات"] }
        ];

        // إضافة مستويات إضافية حتى 300 (نسخ تلقائي للأسئلة)
        for (let i = 6; i <= 300; i++) {
            const baseLevel = ((i - 1) % 5) + 1;
            QUESTIONS.push(
                { level: i, step: 0, cat: "🏛️ عواصم", q: `ما عاصمة الدولة رقم ${i}؟`, a: "عاصمة", opts: ["عاصمة", "مدينة1", "مدينة2", "مدينة3"] },
                { level: i, step: 1, cat: "🌍 جغرافيا", q: `سؤال جغرافيا رقم ${i}؟`, a: "الجواب", opts: ["الجواب", "خيار1", "خيار2", "خيار3"] },
                { level: i, step: 2, cat: "🏞️ معالم", q: `ما هو المعلم الشهير رقم ${i}؟`, a: "المعلم", opts: ["المعلم", "مكان1", "مكان2", "مكان3"] }
            );
        }

        // ==================== اللعبة ====================
        let gameState = {
            currentLevel: 1,
            totalPoints: 0,
            streak: 0,
            levelStars: {}
        };

        // تحميل البيانات
        try {
            const saved = localStorage.getItem('geoGame');
            if (saved) {
                const data = JSON.parse(saved);
                gameState.currentLevel = data.currentLevel || 1;
                gameState.totalPoints = data.totalPoints || 0;
                gameState.streak = data.streak || 0;
                gameState.levelStars = data.levelStars || {};
            }
        } catch(e) {}

        // عناصر DOM
        const levelsGrid = document.getElementById('levelsGrid');
        const quizModal = document.getElementById('quizModal');
        const resultModal = document.getElementById('resultModal');
        const toast = document.getElementById('toast');
        const victoryAudio = document.getElementById('victoryAudio');
        
        let currentQuestions = [];
        let currentStep = 0;
        let currentAnswers = [];
        let timerInterval = null;
        let timeLeft = 15;

        // تعيين ملف الصوت
        victoryAudio.src = '1.mp3';
        victoryAudio.load();

        // عرض رسالة
        function showMessage(msg, isGood = true) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // تشغيل صوت النصر
        function playVictory() {
            if (!victoryAudio.src || victoryAudio.src === window.location.href) return;
            victoryAudio.currentTime = 0;
            victoryAudio.play().catch(e => console.log('صوت:', e));
        }

        // حفظ البيانات
        function saveGame() {
            localStorage.setItem('geoGame', JSON.stringify(gameState));
        }

        // تحديث الإحصائيات
        function updateStats() {
            document.getElementById('levelNum').textContent = gameState.currentLevel;
            document.getElementById('pointsNum').textContent = gameState.totalPoints;
            document.getElementById('streakNum').textContent = gameState.streak;
        }

        // بناء شبكة المستويات
        function buildLevels() {
            levelsGrid.innerHTML = '';
            for (let i = 300; i >= 1; i--) {
                const card = document.createElement('div');
                card.className = 'level-card';
                
                if (i < gameState.currentLevel) card.classList.add('completed');
                if (i === gameState.currentLevel) card.classList.add('active');
                if (i > gameState.currentLevel) card.classList.add('locked');
                
                const stars = gameState.levelStars[i] || 0;
                const starDisplay = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
                
                card.innerHTML = `
                    <div class="level-number">${i}</div>
                    <div class="level-stars">${starDisplay}</div>
                `;
                
                if (i <= gameState.currentLevel) {
                    card.onclick = () => startLevel(i);
                }
                
                levelsGrid.appendChild(card);
            }
            
            // التمرير إلى المستوى الحالي
            setTimeout(() => {
                const active = document.querySelector('.level-card.active');
                if (active) active.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }

        // بدء مستوى
        function startLevel(level) {
            currentQuestions = QUESTIONS.filter(q => q.level === level).sort((a,b) => a.step - b.step);
            if (currentQuestions.length === 0) {
                showMessage('هذا المستوى قيد الإعداد');
                return;
            }
            
            currentStep = 0;
            currentAnswers = [];
            showQuestion(0);
            quizModal.style.display = 'flex';
        }

        // عرض سؤال
        function showQuestion(step) {
            // تحديث النجوم
            const stars = document.querySelectorAll('.star-progress');
            stars.forEach((s, i) => {
                if (i < step) s.classList.add('active');
                else s.classList.remove('active');
            });
            
            const q = currentQuestions[step];
            if (!q) return;
            
            document.getElementById('category').textContent = q.cat;
            
            if (q.cat.includes('أعلام')) {
                document.getElementById('flagDisplay').style.display = 'block';
                document.getElementById('flagDisplay').textContent = q.q.includes('🇪🇬') ? '🇪🇬' : '🏳️';
            } else {
                document.getElementById('flagDisplay').style.display = 'none';
            }
            
            document.getElementById('questionText').textContent = q.q;
            
            // خيارات عشوائية
            const opts = [...q.opts].sort(() => Math.random() - 0.5);
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            
            opts.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt === q.a, btn, q);
                container.appendChild(btn);
            });
            
            // بدء المؤقت
            startTimer();
        }

        // بدء المؤقت
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timeLeft = 15;
            const timerEl = document.getElementById('timerDisplay');
            timerEl.textContent = timeLeft;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = Math.max(0, timeLeft);
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    handleTimeout();
                }
            }, 1000);
        }

        // انتهاء الوقت
        function handleTimeout() {
            const currentQ = currentQuestions[currentStep];
            currentAnswers.push({
                question: currentQ.q,
                correct: currentQ.a,
                isCorrect: false
            });
            
            showMessage('⏰ انتهى الوقت!');
            gameState.streak = 0;
            
            // تعطيل الأزرار
            document.querySelectorAll('.option').forEach(btn => btn.style.pointerEvents = 'none');
            
            // إظهار الإجابة الصحيحة
            document.querySelectorAll('.option').forEach(btn => {
                if (btn.textContent === currentQ.a) {
                    btn.classList.add('correct');
                }
            });
            
            setTimeout(() => {
                currentStep++;
                if (currentStep < 3) {
                    showQuestion(currentStep);
                } else {
                    finishLevel();
                }
            }, 1500);
        }

        // التحقق من الإجابة
        function checkAnswer(isCorrect, btn, question) {
            clearInterval(timerInterval);
            timerInterval = null;
            
            document.querySelectorAll('.option').forEach(b => b.style.pointerEvents = 'none');
            
            currentAnswers.push({
                question: question.q,
                correct: question.a,
                isCorrect: isCorrect
            });
            
            if (isCorrect) {
                btn.classList.add('correct');
                gameState.streak++;
                
                const points = 50 + timeLeft + (gameState.streak * 5);
                gameState.totalPoints += points;
                showMessage(`✅ +${points} نقطة`);
            } else {
                btn.classList.add('wrong');
                gameState.streak = 0;
                showMessage('❌ خطأ');
                
                // إظهار الإجابة الصحيحة
                document.querySelectorAll('.option').forEach(b => {
                    if (b.textContent === question.a) {
                        b.classList.add('correct');
                    }
                });
            }
            
            updateStats();
            saveGame();
            
            setTimeout(() => {
                currentStep++;
                if (currentStep < 3) {
                    showQuestion(currentStep);
                } else {
                    finishLevel();
                }
            }, 1500);
        }

        // إنهاء المستوى
        function finishLevel() {
            const correctCount = currentAnswers.filter(a => a.isCorrect).length;
            const levelNum = currentQuestions[0].level;
            
            // حفظ النجوم
            gameState.levelStars[levelNum] = correctCount;
            
            // مكافأة
            const levelBonus = correctCount * 100;
            gameState.totalPoints += levelBonus;
            
            // فتح المستوى التالي
            if (correctCount >= 2 && levelNum === gameState.currentLevel && levelNum < 300) {
                gameState.currentLevel++;
            }
            
            saveGame();
            updateStats();
            
            // عرض النتائج
            showResults();
            
            // تشغيل الموسيقى فقط إذا كانت الإجابات 3 صحيحة
            if (correctCount === 3) {
                playVictory();
                showMessage('🎵 مخطوطة ذهبية! +50 نقطة إضافية', true);
                gameState.totalPoints += 50;
                updateStats();
                saveGame();
                document.getElementById('resultTitle').innerHTML = '🎉 إنجاز كامل! 🎉';
            } else {
                document.getElementById('resultTitle').innerHTML = '📊 نتيجة المستوى';
            }
        }

        // عرض النتائج
        function showResults() {
            const container = document.getElementById('resultsList');
            container.innerHTML = '';
            
            currentAnswers.forEach(ans => {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `
                    <div class="result-icon">${ans.isCorrect ? '✅' : '❌'}</div>
                    <div class="result-question">${ans.question}</div>
                    <div class="result-correct">${ans.correct}</div>
                `;
                container.appendChild(div);
            });
            
            quizModal.style.display = 'none';
            resultModal.style.display = 'flex';
        }

        // إغلاق النتائج
        function closeResults() {
            resultModal.style.display = 'none';
            buildLevels();
        }

        // أحداث
        document.getElementById('closeQuizBtn').onclick = () => {
            if (timerInterval) clearInterval(timerInterval);
            quizModal.style.display = 'none';
        };
        
        document.getElementById('nextBtn').onclick = closeResults;
        
        // بدء اللعبة
        buildLevels();
        updateStats();
        
        // إخفاء شاشة البداية إذا وجدت
        const splash = document.getElementById('splashScreen');
        if (splash) splash.style.display = 'none';
    </script>
</body>
</html>
