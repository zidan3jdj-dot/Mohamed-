<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>جغرافيا العالم | 1000 سؤال فريد</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', 'Cairo', Tahoma, sans-serif;
        }

        body {
            background: #1a3b5d;
            min-height: 100vh;
            color: #fff;
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* الخلفية المتحركة */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #1a3b5d, #2a4f6e, #1e3f5a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            z-index: -2;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* نجوم متلألئة */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
            opacity: 0.3;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* شريط المعلومات */
        .info-bar {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .badge {
            background: rgba(255, 215, 0, 0.3);
            border: 1px solid gold;
            color: gold;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.85rem;
            margin-right: 5px;
        }

        /* خريطة المستويات */
        .level-map {
            position: fixed;
            top: 80px;
            bottom: 0;
            left: 0;
            right: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 15px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .levels-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            max-width: 350px;
            margin: 0 auto;
            padding-bottom: 30px;
            position: relative;
        }

        .path-line {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 3px;
            background: linear-gradient(to bottom, gold, #ff6b6b, #4ecdc4);
            transform: translateX(-50%);
            opacity: 0.5;
            z-index: 1;
            border-radius: 10px;
        }

        .level-card {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 5px 0;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 2;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            color: white;
        }

        .level-card[data-x="left"] { transform: translateX(-30px); }
        .level-card[data-x="right"] { transform: translateX(30px); }

        .level-card.completed {
            background: rgba(76, 175, 80, 0.3);
            border-color: #4CAF50;
            box-shadow: 0 0 20px #4CAF50;
        }

        .level-card.active {
            background: rgba(255, 215, 0, 0.3);
            border-color: gold;
            box-shadow: 0 0 30px gold;
            transform: scale(1.1);
        }

        .level-card.locked {
            opacity: 0.5;
            filter: grayscale(0.8);
            cursor: not-allowed;
        }

        .level-number {
            font-size: 2.2rem;
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .level-label {
            font-size: 0.7rem;
            background: rgba(0,0,0,0.5);
            padding: 3px 10px;
            border-radius: 20px;
            margin-top: 5px;
        }

        /* نافذة السؤال */
        .quiz-window {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
            padding: 15px;
        }

        .quiz-card {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(145deg, #2a4f6e, #1e3f5a);
            border: 2px solid gold;
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 0 2px rgba(255,215,0,0.3);
            animation: slideUp 0.3s ease;
            color: white;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .quiz-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed rgba(255,215,0,0.3);
        }

        .category {
            background: gold;
            color: #1a3b5d;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .step-indicator {
            display: flex;
            gap: 10px;
        }

        .step-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            border: 1px solid rgba(255,255,255,0.5);
            position: relative;
        }

        .step-dot.active {
            background: gold;
            border-color: gold;
            box-shadow: 0 0 10px gold;
        }

        .step-dot.completed {
            background: #4CAF50;
            border-color: #4CAF50;
        }

        .step-dot.completed::after {
            content: '✓';
            position: absolute;
            top: -8px;
            right: -8px;
            color: white;
            font-size: 8px;
            background: #4CAF50;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid white;
        }

        .hint-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid gold;
            color: gold;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            margin: 10px 0;
            text-align: center;
        }

        .hint-btn:active {
            background: gold;
            color: #1a3b5d;
            transform: scale(0.95);
        }

        .hint-count {
            color: gold;
            font-weight: bold;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 20px 0;
            text-align: center;
            line-height: 1.5;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .flag-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            transform-style: preserve-3d;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .flag-emoji {
            font-size: 6rem;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }

        .options-area {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 15px 0;
        }

        .option-item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            padding: 15px 8px;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .option-item:active {
            transform: scale(0.95);
            background: rgba(255,215,0,0.3);
        }

        .option-item.correct {
            background: #4CAF50;
            border-color: #4CAF50;
            animation: pulse 0.5s;
        }

        .option-item.wrong {
            background: #f44336;
            border-color: #f44336;
            animation: shake 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .timer-container {
            margin-top: 15px;
            text-align: center;
        }

        .timer-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .timer-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, gold, #f44336);
            width: 100%;
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        .timer-text {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.8);
        }

        /* رسالة الإنجاز */
        .achievement-popup {
            position: fixed;
            top: 80px;
            left: 15px;
            right: 15px;
            background: linear-gradient(135deg, gold, #ff6b6b);
            color: #1a3b5d;
            border-radius: 30px;
            padding: 15px;
            font-weight: bold;
            text-align: center;
            z-index: 2000;
            transform: translateY(-150%);
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .achievement-popup.show {
            transform: translateY(0);
        }

        @media (max-width: 400px) {
            .options-area { grid-template-columns: 1fr; }
            .level-card { width: 90px; height: 90px; }
            .level-number { font-size: 1.8rem; }
            .flag-emoji { font-size: 5rem; }
            .question-text { font-size: 1.1rem; }
        }
    </style>
</head>

            const transcontinental = ["روسيا", "تركيا", "مصر", "كازاخستان", "أذربيجان", "جورجيا"];
            transcontinental.forEach(countryName => {
                const country = countries.find(c => c.name === countryName);
                if (country) {
                    allQuestions.push({
                        type: "transcontinental",
                        category: "🌍 دول عابرة للقارات",
                        question: `أي من هذه الدول تمتد بين قارتين؟`,
                        answer: countryName,
                        wrongOptions: getRandomWrongNonTranscontinental(countryName, 3)
                    });
                }
            });
            
            // 15. دول بنفس العملة
            sameCurrency.forEach(item => {
                item.countries.forEach(countryName => {
                    const otherCountries = item.countries.filter(c => c !== countryName);
                    allQuestions.push({
                        type: "same_currency",
                        category: "💰 عملات",
                        question: `أي من هذه الدول تستخدم نفس عملة ${countryName}؟`,
                        answer: otherCountries[0],
                        wrongOptions: getRandomWrongCurrenciesForCountry(item.currency, otherCountries[0], 3)
                    });
                });
            });
            
            // دوال مساعدة لتوليد خيارات خاطئة
            function getRandomWrong(arr, field, correct, count) {
                const wrong = [];
                const filtered = arr.filter(item => item[field] !== correct);
                for (let i = 0; i < count && filtered.length > 0; i++) {
                    const randomIndex = Math.floor(Math.random() * filtered.length);
                    wrong.push(filtered[randomIndex][field]);
                    filtered.splice(randomIndex, 1);
                }
                return wrong;
            }
            
            function getRandomWrongContinents(correct, count) {
                const continents = ["أفريقيا", "آسيا", "أوروبا", "أمريكا الشمالية", "أمريكا الجنوبية", "أوقيانوسيا"];
                return continents.filter(c => c !== correct).sort(() => 0.5 - Math.random()).slice(0, count);
            }
            
            function getRandomWrongCurrencies(correct, count) {
                const currencies = ["الدولار", "اليورو", "الجنيه", "الدينار", "الريال", "الدرهم", "الروبية"];
                return currencies.filter(c => c !== correct).sort(() => 0.5 - Math.random()).slice(0, count);
            }
            
            function getRandomWrongLocations(arr, field, correct, count) {
                const wrong = [];
                const filtered = arr.filter(item => item[field] !== correct).map(item => item[field]);
                const unique = [...new Set(filtered)];
                for (let i = 0; i < count && unique.length > 0; i++) {
                    const randomIndex = Math.floor(Math.random() * unique.length);
                    wrong.push(unique[randomIndex]);
                    unique.splice(randomIndex, 1);
                }
                return wrong;
            }
            
            function getRandomWrongConnects(arr, field, correct, count) {
                const wrong = [];
                const filtered = arr.filter(item => item[field] !== correct).map(item => item[field]);
                const unique = [...new Set(filtered)];
                for (let i = 0; i < count && unique.length > 0; i++) {
                    const randomIndex = Math.floor(Math.random() * unique.length);
                    wrong.push(unique[randomIndex]);
                    unique.splice(randomIndex, 1);
                }
                return wrong;
            }
            
            function getRandomWrongCountriesWithCoast(count) {
                const coastalCountries = countries.filter(c => 
                    !specialInfo.some(s => s.type === "غير ساحلية" && s.name === c.name)
                ).map(c => c.name);
                return coastalCountries.sort(() => 0.5 - Math.random()).slice(0, count);
            }
            
            function getRandomWrongNonIslandCountries(count) {
                const nonIsland = countries.filter(c => 
                    !specialInfo.some(s => s.type === "جزيرة" && s.name === c.name)
                ).map(c => c.name);
                return nonIsland.sort(() => 0.5 - Math.random()).slice(0, count);
            }
            
            function getRandomWrongLargestCountries(correct, count) {
                return largestCountries.filter(c => c.name !== correct).map(c => c.name).sort(() => 0.5 - Math.random()).slice(0, count);
            }
            
            function getRandomWrongSmallestCountries(correct, count) {
                return smallestCountries.filter(c => c.name !== correct).map(c => c.name).sort(() => 0.5 - Math.random()).slice(0, count);
            }
            
            function getRandomWrongNonTranscontinental(correct, count) {
                const nonTranscontinental = countries.filter(c => 
                    !["روسيا", "تركيا", "مصر", "كازاخستان", "أذربيجان", "جورجيا"].includes(c.name)
                ).map(c => c.name);
                return nonTranscontinental.sort(() => 0.5 - Math.random()).slice(0, count);
            }
            
            function getRandomWrongCurrenciesForCountry(currency, correct, count) {
                const countriesWithDifferentCurrency = countries.filter(c => 
                    c.currency !== currency && c.name !== correct
                ).map(c => c.name);
                return countriesWithDifferentCurrency.sort(() => 0.5 - Math.random()).slice(0, count);
            }

            // ==================== نظام اللعبة ====================
            
            class GeographyGame {
                constructor() {
                    this.currentLevel = parseInt(localStorage.getItem('geo_level')) || 1;
                    this.totalPoints = parseInt(localStorage.getItem('geo_points')) || 0;
                    this.streak = parseInt(localStorage.getItem('geo_streak')) || 0;
                    this.hintsRemaining = parseInt(localStorage.getItem('geo_hints')) || 3;
                    this.step = 0;
                    this.timer = null;
                    this.timeLeft = 15;
                    this.maxTime = 15;
                    this.currentQuestions = [];
                    this.usedQuestionsIndices = new Set();
                    
                    // إنجازات
                    this.achievements = {
                        firstCorrect: false,
                        streak10: false,
                        level5: false
                    };
                    
                    this.init();
                }
                
                init() {
                    this.createStars();
                    this.buildLevels();
                    this.updateDisplay();
                    this.loadUsedQuestions();
                    this.scrollToCurrent();
                }
                
                createStars() {
                    const starsContainer = document.getElementById('stars');
                    for (let i = 0; i < 50; i++) {
                        const star = document.createElement('div');
                        star.className = 'star';
                        star.style.width = Math.random() * 3 + 'px';
                        star.style.height = star.style.width;
                        star.style.left = Math.random() * 100 + '%';
                        star.style.top = Math.random() * 100 + '%';
                        star.style.animationDelay = Math.random() * 3 + 's';
                        starsContainer.appendChild(star);
                    }
                }
                
                loadUsedQuestions() {
                    const saved = localStorage.getItem('geo_used_questions');
                    if (saved) {
                        this.usedQuestionsIndices = new Set(JSON.parse(saved));
                    }
                }
                
                saveUsedQuestions() {
                    localStorage.setItem('geo_used_questions', JSON.stringify([...this.usedQuestionsIndices]));
                }
                
                buildLevels() {
                    const grid = document.getElementById('levelsGrid');
                    grid.innerHTML = '';
                    
                    const pathLine = document.createElement('div');
                    pathLine.className = 'path-line';
                    grid.appendChild(pathLine);
                    
                    // بناء المستويات من 1 إلى 1000
                    for (let i = 1; i <= 1000; i++) {
                        const card = document.createElement('div');
                        card.className = `level-card`;
                        
                        if (i < this.currentLevel) card.classList.add('completed');
                        else if (i === this.currentLevel) card.classList.add('active');
                        else card.classList.add('locked');
                        
                        card.setAttribute('data-x', i % 2 === 0 ? 'left' : 'right');
                        
                        const displayNumber = i <= this.currentLevel ? i : '🔒';
                        const displayText = i <= this.currentLevel ? 'مفتوح' : 'مقفول';
                        
                        card.innerHTML = `
                            <span class="level-number">${displayNumber}</span>
                            <span class="level-label">${displayText}</span>
                        `;
                        
                        if (i <= this.currentLevel) {
                            card.onclick = () => this.openLevel(i);
                        }
                        
                        grid.appendChild(card);
                    }
                }
                
                openLevel(level) {
                    if (level !== this.currentLevel) return;
                    
                    // اختيار 3 أسئلة فريدة غير مكررة
                    this.currentQuestions = this.getUniqueQuestions(3);
                    
                    if (this.currentQuestions.length < 3) {
                        console.log("بعض الأسئلة تكررت، نعيد المحاولة");
                        this.currentQuestions = this.getUniqueQuestions(3);
                    }
                    
                    this.step = 0;
                    this.timeLeft = this.maxTime;
                    
                    document.getElementById('quizWindow').style.display = 'flex';
                    this.showQuestion(0);
                }
                
                getUniqueQuestions(count) {
                    const selected = [];
                    const availableIndices = [];
                    
                    // جمع كل المؤشرات غير المستخدمة
                    for (let i = 0; i < allQuestions.length; i++) {
                        if (!this.usedQuestionsIndices.has(i)) {
                            availableIndices.push(i);
                        }
                    }
                    
                    // إذا قاربت الأسئلة على النفاد، نمسح المستخدمة
                    if (availableIndices.length < count * 10) {
                        this.usedQuestionsIndices.clear();
                        for (let i = 0; i < allQuestions.length; i++) {
                            availableIndices.push(i);
                        }
                    }
                    
                    // اختيار عشوائي
                    for (let i = 0; i < count && availableIndices.length > 0; i++) {
                        const randomIndex = Math.floor(Math.random() * availableIndices.length);
                        const questionIndex = availableIndices[randomIndex];
                        selected.push(allQuestions[questionIndex]);
                        this.usedQuestionsIndices.add(questionIndex);
                        availableIndices.splice(randomIndex, 1);
                    }
                    
                    this.saveUsedQuestions();
                    return selected;
                }
                
                showQuestion(step) {
                    // تحديث المؤشرات
                    const dots = document.querySelectorAll('.step-dot');
                    dots.forEach((dot, i) => {
                        dot.className = 'step-dot';
                        if (i < step) dot.classList.add('completed');
                        else if (i === step) dot.classList.add('active');
                    });
                    
                    const question = this.currentQuestions[step];
                    
                    document.getElementById('questionCategory').textContent = question.category;
                    
                    // عرض العلم إذا موجود
                    const flagContainer = document.getElementById('flagContainer');
                    if (question.type === 'flag') {
                        flagContainer.style.display = 'flex';
                        document.getElementById('flagEmoji').textContent = question.flag;
                    } else {
                        flagContainer.style.display = 'none';
                    }
                    
                    document.getElementById('questionText').textContent = question.question;
                    
                    // بناء الخيارات
                    const optionsArea = document.getElementById('optionsArea');
                    optionsArea.innerHTML = '';
                    
                    const allOptions = [question.answer, ...question.wrongOptions];
                    const shuffled = allOptions.sort(() => 0.5 - Math.random());
                    
                    shuffled.forEach(opt => {
                        const btn = document.createElement('div');
                        btn.className = 'option-item';
                        btn.textContent = opt;
                        btn.onclick = () => this.checkAnswer(opt === question.answer, btn);
                        optionsArea.appendChild(btn);
                    });
                    
                    this.startTimer();
                }
                
                startTimer() {
                    if (this.timer) clearInterval(this.timer);
                    
                    this.timeLeft = this.maxTime;
                    const timerFill = document.getElementById('timerFill');
                    const timerText = document.getElementById('timerText');
                    
                    this.timer = setInterval(() => {
                        this.timeLeft -= 0.1;
                        const percent = (this.timeLeft / this.maxTime) * 100;
                        timerFill.style.width = Math.max(0, percent) + '%';
                        timerText.textContent = this.timeLeft.toFixed(1) + ' ثانية';
                        
                        if (this.timeLeft <= 0) {
                            clearInterval(this.timer);
                            this.timeout();
                        }
                    }, 100);
                }
                
                checkAnswer(correct, btn) {
                    clearInterval(this.timer);
                    
                    document.querySelectorAll('.option-item').forEach(b => b.disabled = true);
                    
                    if (correct) {
                        btn.classList.add('correct');
                        this.streak++;
                        
                        // نقاط
                        const timeBonus = Math.floor(this.timeLeft);
                        const streakBonus = this.streak * 5;
                        const points = 50 + timeBonus + streakBonus;
                        this.totalPoints += points;
                        
                        localStorage.setItem('geo_points', this.totalPoints);
                        localStorage.setItem('geo_streak', this.streak);
                        
                        // اهتزاز ناجح
                        this.vibrate(50);
                        
                        // تحقق من الإنجازات
                        this.checkAchievements();
                        
                        setTimeout(() => {
                            this.step++;
                            
                            if (this.step < 3) {
                                this.showQuestion(this.step);
                            } else {
                                this.levelComplete();
                            }
                        }, 700);
                        
                    } else {
                        btn.classList.add('wrong');
                        this.streak = 0;
                        localStorage.setItem('geo_streak', 0);
                        
                        // اهتزاز خطأ
                        this.vibrate(200);
                        
                        setTimeout(() => {
                            document.getElementById('quizWindow').style.display = 'none';
                        }, 1000);
                    }
                    
                    this.updateDisplay();
                }
                
                vibrate(duration) {
                    if (navigator.vibrate) {
                        navigator.vibrate(duration);
                    }
                }
                
                timeout() {
                    this.showAchievement('⏰ انتهى الوقت');
                    this.streak = 0;
                    localStorage.setItem('geo_streak', 0);
                    
                    setTimeout(() => {
                        document.getElementById('quizWindow').style.display = 'none';
                    }, 1000);
                    
                    this.updateDisplay();
                }
                
                levelComplete() {
                    // مكافأة إكمال المستوى
                    this.totalPoints += 200;
                    
                    if (this.currentLevel < 1000) {
                        this.currentLevel++;
                    } else {
                        this.victory();
                    }
                    
                    localStorage.setItem('geo_level', this.currentLevel);
                    localStorage.setItem('geo_points', this.totalPoints);
                    
                    setTimeout(() => {
                        document.getElementById('quizWindow').style.display = 'none';
                        this.buildLevels();
                        this.updateDisplay();
                        this.scrollToCurrent();
                    }, 1000);
                    
                    // تحقق من إنجاز المستوى 5
                    if (this.currentLevel >= 5 && !this.achievements.level5) {
                        this.achievements.level5 = true;
                        this.showAchievement('🏆 إنجاز: أكملت 5 مستويات!');
                    }
                }
                
                victory() {
                    this.showAchievement('🏆 ألف مبروك! أكملت 1000 مستوى وأصبحت خبيراً في الجغرافيا 🏆');
                    
                    // احتفال
                    for (let i = 0; i < 100; i++) {
                        setTimeout(() => {
                            this.vibrate(50);
                        }, i * 100);
                    }
                }
                
                checkAchievements() {
                    // أول إجابة صحيحة
                    if (this.totalPoints >= 50 && !this.achievements.firstCorrect) {
                        this.achievements.firstCorrect = true;
                        this.showAchievement('🏆 إنجاز: أول إجابة صحيحة!');
                    }
                    
                    // 10 نقاط متتالية
                    if (this.streak >= 10 && !this.achievements.streak10) {
                        this.achievements.streak10 = true;
                        this.showAchievement('🔥 إنجاز: 10 إجابات صحيحة متتالية!');
                    }
                }
                
                showAchievement(text) {
                    const popup = document.getElementById('achievementPopup');
                    popup.textContent = text;
                    popup.classList.add('show');
                    
                    setTimeout(() => popup.classList.remove('show'), 3000);
                }
                
                updateDisplay() {
                    document.getElementById('levelDisplay').textContent = this.currentLevel;
                    document.getElementById('pointsDisplay').textContent = this.totalPoints;
                    document.getElementById('streakDisplay').textContent = this.streak;
                    document.getElementById('hintCount').textContent = this.hintsRemaining;
                }
                
                scrollToCurrent() {
                    setTimeout(() => {
                        const active = document.querySelector('.level-card.active');
                        if (active) {
                            active.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }, 200);
                }
                
                useHint() {
                    if (this.hintsRemaining <= 0) {
                        this.showAchievement('💡 لا توجد تلميحات متبقية');
                        return;
                    }
                    
                    if (this.step >= this.currentQuestions.length) return;
                    
                    const question = this.currentQuestions[this.step];
                    const options = document.querySelectorAll('.option-item');
                    
                    // إزالة خيارين خاطئين
                    let wrongRemoved = 0;
                    options.forEach(btn => {
                        if (btn.textContent !== question.answer && wrongRemoved < 2 && !btn.disabled) {
                            btn.style.opacity = '0.3';
                            btn.disabled = true;
                            wrongRemoved++;
                        }
                    });
                    
                    this.hintsRemaining--;
                    localStorage.setItem('geo_hints', this.hintsRemaining);
                    this.updateDisplay();
                    
                    this.showAchievement('💡 تمت إزالة خيارين خاطئين');
                }
            }
            
            // بدء اللعبة
            const game = new GeographyGame();
            
            // إضافة حدث التلميح
            document.getElementById('hintBtn').onclick = () => game.useHint();
            
            // إغلاق بالضغط خارج البطاقة
            document.getElementById('quizWindow').onclick = (e) => {
                if (e.target === document.getElementById('quizWindow')) {
                    document.getElementById('quizWindow').style.display = 'none';
                    clearInterval(game.timer);
                }
            };
            
        })();
    </script>
