<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sparty Pro - عالم الترفيه</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #0f0c29; background: linear-gradient(to bottom, #24243e, #302b63, #0f0c29); color: white; height: 100vh; overflow: hidden; }
        .glass-panel { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .chat-box { height: 200px; overflow-y: auto; scrollbar-width: none; }
        .user-mic-active { border: 2px solid #10b981; box-shadow: 0 0 10px #10b981; }
        .tab-btn.active { background: #8b5cf6; }
    </style>
</head>
<body class="flex flex-col p-2">

    <div id="login-screen" class="fixed inset-0 z-50 bg-slate-900 flex items-center justify-center p-6">
        <div class="w-full max-w-sm glass-panel p-8 text-center">
            <h1 class="text-3xl font-bold mb-6 text-purple-400">SPARTY PRO</h1>
            <input id="username" type="text" placeholder="اسمك المستعار..." class="w-full p-4 rounded-xl bg-slate-800 mb-4 text-center border-none focus:ring-2 ring-purple-500">
            <button onclick="enterWorld()" class="w-full bg-purple-600 p-4 rounded-xl font-bold hover:bg-purple-700 transition">دخول الغرفة</button>
        </div>
    </div>

    <div class="flex justify-between items-center p-3 glass-panel mb-2">
        <div class="flex items-center gap-2">
            <div id="my-avatar" class="w-10 h-10 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 flex items-center justify-center font-bold border-2 border-white">?</div>
            <span id="display-name" class="font-bold text-sm">--</span>
        </div>
        <div class="flex gap-2">
            <button id="mic-btn" onclick="toggleMic()" class="w-10 h-10 rounded-full bg-red-500 flex items-center justify-center"><i class="fas fa-microphone-slash"></i></button>
            <button class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-yellow-400"><i class="fas fa-crown"></i></button>
        </div>
    </div>

    <div class="grid grid-cols-4 gap-2 mb-2 p-2" id="players-grid">
        </div>

    <div class="flex-1 glass-panel p-4 mb-2 flex flex-col items-center justify-center relative overflow-hidden">
        <div class="absolute top-2 left-3 bg-purple-600 text-[10px] px-2 py-1 rounded-full uppercase font-bold tracking-tighter">تحدي الفوازير</div>
        
        <div id="game-content" class="text-center w-full">
            <p id="question-text" class="text-xl font-bold mb-6 text-yellow-300">في انتظار بدء اللعبة...</p>
            <div id="game-options" class="grid grid-cols-1 gap-2 w-full max-w-xs mx-auto">
                </div>
        </div>
    </div>

    <div class="glass-panel p-3 flex flex-col h-1/3">
        <div class="chat-box mb-2 text-sm space-y-2" id="chat-messages">
            <p class="text-gray-400 text-center">أهلاً بك في غرفة الدردشة</p>
        </div>
        <div class="flex gap-2">
            <input id="chat-input" type="text" placeholder="اكتب رسالة..." class="flex-1 bg-slate-800 rounded-full px-4 text-sm outline-none">
            <button onclick="sendMessage()" class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center"><i class="fas fa-paper-plane text-xs"></i></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, update, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyAsNWpYWxTKpjSXprmbnScyV6pJqH8izLA",
            authDomain: "gems-1ba26.firebaseapp.com",
            databaseURL: "https://gems-1ba26-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "gems-1ba26",
            storageBucket: "gems-1ba26.firebasestorage.app",
            messagingSenderId: "734486620366",
            appId: "1:734486620366:web:7ffd1b8a0ae826c884c89f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const myId = "u_" + Math.floor(Math.random()*10000);
        let myStream, peer, isMicOpen = false;

        window.enterWorld = async function() {
            const name = document.getElementById('username').value;
            if(!name) return alert("الرجاء كتابة اسمك");

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('display-name').innerText = name;
            document.getElementById('my-avatar').innerText = name[0].toUpperCase();

            // إعداد الصوت
            try {
                myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                myStream.getAudioTracks()[0].enabled = false;
                setupPeer();
            } catch(e) { console.log("Mic access denied"); }

            // ربط Firebase
            const userRef = ref(db, `party/room1/users/${myId}`);
            set(userRef, { name, isTalking: false, score: 0 });
            onDisconnect(userRef).remove();

            listenToRoom();
        };

        function setupPeer() {
            peer = new Peer(myId);
            peer.on('call', (call) => {
                call.answer(myStream);
                call.on('stream', (remoteStream) => {
                    const audio = new Audio();
                    audio.srcObject = remoteStream;
                    audio.play();
                });
            });
        }

        window.toggleMic = function() {
            isMicOpen = !isMicOpen;
            if(myStream) myStream.getAudioTracks()[0].enabled = isMicOpen;
            
            const btn = document.getElementById('mic-btn');
            btn.className = isMicOpen ? "w-10 h-10 rounded-full bg-green-500 flex items-center justify-center animate-pulse" : "w-10 h-10 rounded-full bg-red-500 flex items-center justify-center";
            btn.innerHTML = isMicOpen ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash"></i>';
            
            update(ref(db, `party/room1/users/${myId}`), { isTalking: isMicOpen });
        };

        function listenToRoom() {
            // تحديث قائمة اللاعبين والمايكات
            onValue(ref(db, `party/room1/users`), (snap) => {
                const users = snap.val() || {};
                const grid = document.getElementById('players-grid');
                grid.innerHTML = '';
                Object.keys(users).forEach(id => {
                    const u = users[id];
                    grid.innerHTML += `
                        <div class="flex flex-col items-center">
                            <div class="w-14 h-14 rounded-full bg-slate-700 flex items-center justify-center relative border-2 ${u.isTalking ? 'border-green-500 scale-105' : 'border-slate-500'}">
                                <span class="font-bold">${u.name[0]}</span>
                                ${u.isTalking ? '<div class="absolute -bottom-1 -right-1 bg-green-500 w-4 h-4 rounded-full border-2 border-slate-900"></div>' : ''}
                            </div>
                            <span class="text-[10px] mt-1 opacity-80">${u.name}</span>
                        </div>
                    `;
                    if(id !== myId && peer) {
                        const call = peer.call(id, myStream);
                        call?.on('stream', (rs) => { const a = new Audio(); a.srcObject = rs; a.play(); });
                    }
                });
            });

            // تحديث الشات
            onValue(ref(db, `party/room1/chat`), (snap) => {
                const chat = document.getElementById('chat-messages');
                chat.innerHTML = '';
                snap.forEach(msg => {
                    const m = msg.val();
                    chat.innerHTML += `<p><span class="text-purple-400 font-bold">${m.name}:</span> ${m.text}</p>`;
                });
                chat.scrollTop = chat.scrollHeight;
            });

            // تحديث الفوازير
            onValue(ref(db, `party/room1/game`), (snap) => {
                const game = snap.val();
                if(game) updateGameUI(game);
                else generateRiddle();
            });
        }

        window.sendMessage = function() {
            const input = document.getElementById('chat-input');
            if(!input.value) return;
            push(ref(db, `party/room1/chat`), {
                name: document.getElementById('display-name').innerText,
                text: input.value
            });
            input.value = '';
        };

        const riddles = [
            { q: "ما هو الشيء الذي يكسر بمجرد النطق باسمه؟", a: "السكوت", options: ["الزجاج", "السكوت", "الوعد"] },
            { q: "له عين واحدة ولكنه لا يرى؟", a: "الإبرة", options: ["الإبرة", "الإعصار", "الخاتم"] },
            { q: "يتحرك دائماً حولك لكنك لا تراه؟", a: "الهواء", options: ["الظل", "الهواء", "الزمن"] }
        ];

        function generateRiddle() {
            const r = riddles[Math.floor(Math.random()*riddles.length)];
            set(ref(db, `party/room1/game`), r);
        }

        function updateGameUI(game) {
            document.getElementById('question-text').innerText = game.q;
            const optionsBox = document.getElementById('game-options');
            optionsBox.innerHTML = '';
            game.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "bg-white/10 p-3 rounded-xl hover:bg-purple-600 transition text-sm font-bold";
                btn.innerText = opt;
                btn.onclick = () => {
                    if(opt === game.a) {
                        alert("صح! أنت عبقري 🏆");
                        generateRiddle();
                    } else {
                        btn.classList.add('bg-red-500');
                    }
                };
                optionsBox.appendChild(btn);
            });
        }
    </script>
</body>
</html>
