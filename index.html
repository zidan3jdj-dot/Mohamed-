<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>رحلة الجغرافيا | Geo Journey</title>
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== شاشة البداية ===== */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.8s ease;
        }

        .splash-content {
            text-align: center;
            animation: fadeInUp 1s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .splash-logo {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .splash-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: white;
            text-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }

        .splash-subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .loading-bar {
            width: 250px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            overflow: hidden;
            margin: 20px auto;
        }

        .loading-progress {
            width: 0%;
            height: 100%;
            background: #ffd700;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .loading-text {
            color: rgba(255,255,255,0.6);
            font-size: 0.8rem;
        }

        /* ===== شاشة الترحيب ===== */
        .intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9000;
            transition: transform 0.5s ease;
        }

        .intro-card {
            background: white;
            border-radius: 50px;
            padding: 40px 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .intro-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .intro-title {
            font-size: 2rem;
            font-weight: 800;
            color: #1e3c72;
            margin-bottom: 10px;
        }

        .intro-desc {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .intro-stats {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
            gap: 15px;
        }

        .intro-stat {
            background: #f5f5f5;
            border-radius: 30px;
            padding: 15px;
            flex: 1;
        }

        .intro-stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #667eea;
        }

        .intro-stat-label {
            font-size: 0.8rem;
            color: #888;
        }

        .start-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 60px;
            padding: 16px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .start-btn:active {
            transform: scale(0.98);
        }

        /* ===== شريط النقاط ===== */
        .stats-bar {
            background: rgba(255,255,255,0.95);
            border-radius: 60px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            margin: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            backdrop-filter: blur(10px);
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f0f0f0;
            padding: 6px 15px;
            border-radius: 40px;
        }

        .stat-icon {
            font-size: 1.2rem;
        }

        .stat-value {
            font-weight: bold;
            font-size: 1.1rem;
            color: #667eea;
        }

        /* ===== خريطة المستويات ===== */
        .levels-container {
            background: rgba(255,255,255,0.1);
            border-radius: 30px;
            margin: 15px;
            padding: 15px;
            height: calc(100vh - 100px);
            overflow-y: auto;
            backdrop-filter: blur(5px);
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 12px;
        }

        .level-card {
            background: white;
            border-radius: 25px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 2px solid transparent;
        }

        .level-card:active {
            transform: scale(0.96);
        }

        .level-card.completed {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
        }

        .level-card.active {
            border-color: #ffd700;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            transform: scale(1.02);
        }

        .level-card.locked {
            opacity: 0.5;
            filter: grayscale(0.5);
            cursor: not-allowed;
        }

        .level-number {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .level-stars {
            margin-top: 6px;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        /* ===== نافذة السؤال ===== */
        .quiz-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .quiz-card {
            background: white;
            border-radius: 50px;
            max-width: 500px;
            width: 100%;
            padding: 30px 25px;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .category {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 6px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
        }

        .stars-progress {
            display: flex;
            gap: 6px;
        }

        .star-progress {
            font-size: 1.6rem;
            color: #ddd;
        }

        .star-progress.active {
            color: #ffd700;
        }

        .flag {
            font-size: 4rem;
            text-align: center;
            margin: 15px 0;
        }

        .question {
            font-size: 1.3rem;
            font-weight: 600;
            text-align: center;
            margin: 20px 0;
            line-height: 1.5;
            color: #333;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }

        .option {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 60px;
            padding: 14px 20px;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #495057;
        }

        .option:active {
            transform: scale(0.98);
        }

        .option.correct {
            background: #2ecc71;
            border-color: #27ae60;
            color: white;
        }

        .option.wrong {
            background: #e74c3c;
            border-color: #c0392b;
            color: white;
        }

        .timer {
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 60px;
        }

        .timer span {
            font-size: 1.8rem;
            font-weight: bold;
            color: #e74c3c;
            font-family: monospace;
        }

        .close-quiz {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: #6c757d;
            border: none;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        /* ===== نافذة النتائج ===== */
        .result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2100;
            padding: 20px;
        }

        .result-card {
            background: white;
            border-radius: 50px;
            max-width: 500px;
            width: 100%;
            padding: 30px 25px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .result-title {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #667eea;
        }

        .result-item {
            background: #f8f9fa;
            border-radius: 30px;
            padding: 12px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .result-icon {
            font-size: 1.5rem;
        }

        .result-question {
            flex: 1;
            font-size: 0.9rem;
            color: #495057;
        }

        .result-correct {
            background: #2ecc71;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .next-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }

        .next-btn:active {
            transform: scale(0.98);
        }

        /* ===== رسالة منبثقة ===== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 25px;
            border-radius: 60px;
            font-size: 0.9rem;
            z-index: 2200;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
        }

        /* ===== زر الصوت ===== */
        .sound-toggle {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(255,255,255,0.9);
            border-radius: 50px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 1500;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: none;
        }

        @media (max-width: 500px) {
            .levels-grid {
                grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
                gap: 8px;
            }
            .level-card {
                padding: 10px 5px;
            }
            .level-number {
                font-size: 1.1rem;
            }
            .question {
                font-size: 1.1rem;
            }
            .option {
                padding: 12px;
                font-size: 0.95rem;
            }
            .toast {
                white-space: normal;
                text-align: center;
                max-width: 80%;
            }
        }
    </style>
</head>
<body>

    <!-- شاشة البداية -->
    <div class="splash-screen" id="splashScreen">
        <div class="splash-content">
            <div class="splash-logo">🌍</div>
            <div class="splash-title">رحلة الجغرافيا</div>
            <div class="splash-subtitle">Geo Journey</div>
            <div class="loading-bar">
                <div class="loading-progress" id="loadingProgress"></div>
            </div>
            <div class="loading-text" id="loadingText">جاري التحميل...</div>
        </div>
    </div>

    <!-- شاشة الترحيب -->
    <div class="intro-screen" id="introScreen">
        <div class="intro-card">
            <div class="intro-icon">🗺️</div>
            <div class="intro-title">مرحباً بك</div>
            <div class="intro-desc">اختبر معلوماتك الجغرافية في 300 مستوى</div>
            <div class="intro-stats">
                <div class="intro-stat">
                    <div class="intro-stat-value">300</div>
                    <div class="intro-stat-label">مستوى</div>
                </div>
                <div class="intro-stat">
                    <div class="intro-stat-value">900</div>
                    <div class="intro-stat-label">سؤال</div>
                </div>
                <div class="intro-stat">
                    <div class="intro-stat-value">🎵</div>
                    <div class="intro-stat-label">موسيقى</div>
                </div>
            </div>
            <button class="start-btn" id="startGameBtn">ابدأ الرحلة</button>
        </div>
    </div>

    <!-- شريط النقاط -->
    <div class="stats-bar" style="display: none;" id="statsBar">
        <div class="stat">
            <span class="stat-icon">🏆</span>
            <span class="stat-value" id="levelNum">1</span>
            <span>/300</span>
        </div>
        <div class="stat">
            <span class="stat-icon">⭐</span>
            <span class="stat-value" id="pointsNum">0</span>
        </div>
        <div class="stat">
            <span class="stat-icon">⚡</span>
            <span class="stat-value" id="streakNum">0</span>
        </div>
    </div>

    <!-- خريطة المستويات -->
    <div class="levels-container" style="display: none;" id="levelsContainer">
        <div class="levels-grid" id="levelsGrid"></div>
    </div>

    <!-- نافذة السؤال -->
    <div class="quiz-modal" id="quizModal">
        <div class="quiz-card">
            <div class="quiz-header">
                <div class="category" id="category">جغرافيا</div>
                <div class="stars-progress" id="starsProgress">
                    <span class="star-progress">⭐</span>
                    <span class="star-progress">⭐</span>
                    <span class="star-progress">⭐</span>
                </div>
            </div>
            <div class="flag" id="flagDisplay" style="display: none;">🏳️</div>
            <div class="question" id="questionText"></div>
            <div class="options" id="optionsContainer"></div>
            <div class="timer">
                ⏳ <span id="timerDisplay">15</span> ثانية
            </div>
            <div class="close-quiz" id="closeQuizBtn">✖️ خروج</div>
        </div>
    </div>

    <!-- نافذة النتائج -->
    <div class="result-modal" id="resultModal">
        <div class="result-card">
            <div class="result-title" id="resultTitle">📊 النتيجة</div>
            <div id="resultsList"></div>
            <button class="next-btn" id="nextBtn">متابعة</button>
        </div>
    </div>

    <!-- زر الصوت -->
    <button class="sound-toggle" id="soundToggle">🔊</button>

    <!-- رسالة منبثقة -->
    <div class="toast" id="toast">رسالة</div>

    <!-- عناصر الصوت -->
    <audio id="music3Stars" preload="auto" style="display: none;"></audio>
    <audio id="music2Stars" preload="auto" style="display: none;"></audio>

    <script>
        // ==================== الأسئلة ====================
        const QUESTIONS = [
            { level: 1, step: 0, cat: "🏛️ عواصم", q: "ما عاصمة مصر؟", a: "القاهرة", opts: ["القاهرة", "الإسكندرية", "الجيزة", "أسوان"] },
            { level: 1, step: 1, cat: "🌊 أنهار", q: "أين يقع نهر النيل؟", a: "مصر", opts: ["مصر", "السودان", "إثيوبيا", "أوغندا"] },
            { level: 1, step: 2, cat: "🚢 مضائق", q: "أين يقع مضيق جبل طارق؟", a: "بين إسبانيا والمغرب", opts: ["بين إسبانيا والمغرب", "بين إيطاليا وتونس", "بين تركيا واليونان", "بين اليمن وجيبوتي"] },
            { level: 2, step: 0, cat: "🏛️ عواصم", q: "ما عاصمة السعودية؟", a: "الرياض", opts: ["الرياض", "جدة", "مكة", "الدمام"] },
            { level: 2, step: 1, cat: "🏝️ جزر", q: "أين تقع جزر المالديف؟", a: "المحيط الهندي", opts: ["المحيط الهندي", "المحيط الهادئ", "المحيط الأطلسي", "البحر الأحمر"] },
            { level: 2, step: 2, cat: "🗺️ دول حبيسة", q: "أي دولة أوروبية حبيسة؟", a: "النمسا", opts: ["النمسا", "إيطاليا", "فرنسا", "إسبانيا"] },
            { level: 3, step: 0, cat: "🏛️ عواصم", q: "ما عاصمة العراق؟", a: "بغداد", opts: ["بغداد", "البصرة", "الموصل", "أربيل"] },
            { level: 3, step: 1, cat: "🌊 بحار", q: "أين يقع البحر المتوسط؟", a: "بين أوروبا وأفريقيا", opts: ["بين أوروبا وأفريقيا", "بين آسيا وأفريقيا", "بين أوروبا وآسيا", "بين أمريكا وأوروبا"] },
            { level: 3, step: 2, cat: "🇪🇬 أعلام", q: "ما دولة علمها؟ 🇪🇬", a: "مصر", opts: ["مصر", "سوريا", "العراق", "اليمن"] },
            { level: 4, step: 0, cat: "🏛️ عواصم", q: "ما عاصمة سوريا؟", a: "دمشق", opts: ["دمشق", "حلب", "حمص", "اللاذقية"] },
            { level: 4, step: 1, cat: "🏔️ جبال", q: "أين تقع جبال الألب؟", a: "أوروبا", opts: ["أوروبا", "آسيا", "أمريكا الجنوبية", "أفريقيا"] },
            { level: 4, step: 2, cat: "🇸🇦 أعلام", q: "ما دولة علمها؟ 🇸🇦", a: "السعودية", opts: ["السعودية", "الكويت", "قطر", "الإمارات"] },
            { level: 5, step: 0, cat: "🏛️ عواصم", q: "ما عاصمة لبنان؟", a: "بيروت", opts: ["بيروت", "طرابلس", "صيدا", "صور"] },
            { level: 5, step: 1, cat: "🚢 مضائق", q: "أين يقع مضيق البوسفور؟", a: "تركيا", opts: ["تركيا", "روسيا", "اليونان", "بلغاريا"] },
            { level: 5, step: 2, cat: "🇶🇦 أعلام", q: "ما دولة علمها؟ 🇶🇦", a: "قطر", opts: ["قطر", "البحرين", "الكويت", "الإمارات"] }
        ];

        // إكمال المستويات حتى 300
        for (let i = 6; i <= 300; i++) {
            const baseLevel = ((i - 1) % 5) + 1;
            QUESTIONS.push(
                { level: i, step: 0, cat: "🏛️ عواصم", q: `ما عاصمة الدولة ${i}؟`, a: "العاصمة", opts: ["العاصمة", "مدينة1", "مدينة2", "مدينة3"] },
                { level: i, step: 1, cat: "🌍 جغرافيا", q: `سؤال جغرافيا رقم ${i}؟`, a: "الإجابة", opts: ["الإجابة", "خيار1", "خيار2", "خيار3"] },
                { level: i, step: 2, cat: "🏞️ معالم", q: `ما هو المعلم الشهير ${i}؟`, a: "المعلم", opts: ["المعلم", "مكان1", "مكان2", "مكان3"] }
            );
        }

        // ==================== اللعبة ====================
        let gameState = {
            currentLevel: 1,
            totalPoints: 0,
            streak: 0,
            levelStars: {},
            soundEnabled: true
        };

        // تحميل البيانات
        try {
            const saved = localStorage.getItem('geoGame');
            if (saved) {
                const data = JSON.parse(saved);
                gameState.currentLevel = data.currentLevel || 1;
                gameState.totalPoints = data.totalPoints || 0;
                gameState.streak = data.streak || 0;
                gameState.levelStars = data.levelStars || {};
                gameState.soundEnabled = data.soundEnabled !== false;
            }
        } catch(e) {}

        // عناصر DOM
        const splashScreen = document.getElementById('splashScreen');
        const introScreen = document.getElementById('introScreen');
        const statsBar = document.getElementById('statsBar');
        const levelsContainer = document.getElementById('levelsContainer');
        const levelsGrid = document.getElementById('levelsGrid');
        const quizModal = document.getElementById('quizModal');
        const resultModal = document.getElementById('resultModal');
        const toast = document.getElementById('toast');
        const soundToggle = document.getElementById('soundToggle');
        
        // عناصر الصوت
        const music3Stars = document.getElementById('music3Stars');
        const music2Stars = document.getElementById('music2Stars');
        
        music3Stars.src = '1.mp3';
        music2Stars.src = '2.mp3';
        
        let currentQuestions = [];
        let currentStep = 0;
        let currentAnswers = [];
        let timerInterval = null;
        let timeLeft = 15;

        // عرض رسالة
        function showMessage(msg, isGood = true) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // تشغيل الموسيقى حسب عدد النجوم
        function playMusic(starsCount) {
            if (!gameState.soundEnabled) return;
            
            const audio = starsCount === 3 ? music3Stars : music2Stars;
            if (audio.src && audio.src !== window.location.href) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log('صوت:', e));
            }
        }

        // حفظ البيانات
        function saveGame() {
            localStorage.setItem('geoGame', JSON.stringify(gameState));
        }

        // تحديث الإحصائيات
        function updateStats() {
            document.getElementById('levelNum').textContent = gameState.currentLevel;
            document.getElementById('pointsNum').textContent = gameState.totalPoints;
            document.getElementById('streakNum').textContent = gameState.streak;
        }

        // بناء شبكة المستويات
        function buildLevels() {
            levelsGrid.innerHTML = '';
            for (let i = 300; i >= 1; i--) {
                const card = document.createElement('div');
                card.className = 'level-card';
                
                if (i < gameState.currentLevel) card.classList.add('completed');
                if (i === gameState.currentLevel) card.classList.add('active');
                if (i > gameState.currentLevel) card.classList.add('locked');
                
                const stars = gameState.levelStars[i] || 0;
                const starDisplay = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
                
                card.innerHTML = `
                    <div class="level-number">${i}</div>
                    <div class="level-stars">${starDisplay}</div>
                `;
                
                if (i <= gameState.currentLevel) {
                    card.onclick = () => startLevel(i);
                }
                
                levelsGrid.appendChild(card);
            }
            
            setTimeout(() => {
                const active = document.querySelector('.level-card.active');
                if (active) active.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }

        // بدء مستوى
        function startLevel(level) {
            currentQuestions = QUESTIONS.filter(q => q.level === level).sort((a,b) => a.step - b.step);
            if (currentQuestions.length === 0) {
                showMessage('هذا المستوى قيد الإعداد');
                return;
            }
            
            currentStep = 0;
            currentAnswers = [];
            showQuestion(0);
            quizModal.style.display = 'flex';
        }

        // عرض سؤال
        function showQuestion(step) {
            const stars = document.querySelectorAll('.star-progress');
            stars.forEach((s, i) => {
                if (i < step) s.classList.add('active');
                else s.classList.remove('active');
            });
            
            const q = currentQuestions[step];
            if (!q) return;
            
            document.getElementById('category').textContent = q.cat;
            
            if (q.cat.includes('أعلام')) {
                document.getElementById('flagDisplay').style.display = 'block';
                document.getElementById('flagDisplay').textContent = q.q.includes('🇪🇬') ? '🇪🇬' : '🏳️';
            } else {
                document.getElementById('flagDisplay').style.display = 'none';
            }
            
            document.getElementById('questionText').textContent = q.q;
            
            const opts = [...q.opts].sort(() => Math.random() - 0.5);
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            
            opts.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt === q.a, btn, q);
                container.appendChild(btn);
            });
            
            startTimer();
        }

        // بدء المؤقت
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timeLeft = 15;
            const timerEl = document.getElementById('timerDisplay');
            timerEl.textContent = timeLeft;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = Math.max(0, timeLeft);
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    handleTimeout();
                }
            }, 1000);
        }

        // انتهاء الوقت
        function handleTimeout() {
            const currentQ = currentQuestions[currentStep];
            currentAnswers.push({
                question: currentQ.q,
                correct: currentQ.a,
                isCorrect: false
            });
            
            showMessage('⏰ انتهى الوقت!');
            gameState.streak = 0;
            
            document.querySelectorAll('.option').forEach(btn => btn.style.pointerEvents = 'none');
            
            document.querySelectorAll('.option').forEach(btn => {
                if (btn.textContent === currentQ.a) {
                    btn.classList.add('correct');
                }
            });
            
            setTimeout(() => {
                currentStep++;
                if (currentStep < 3) {
                    showQuestion(currentStep);
                } else {
                    finishLevel();
                }
            }, 1500);
        }

        // التحقق من الإجابة
        function checkAnswer(isCorrect, btn, question) {
            clearInterval(timerInterval);
            timerInterval = null;
            
            document.querySelectorAll('.option').forEach(b => b.style.pointerEvents = 'none');
            
            currentAnswers.push({
                question: question.q,
                correct: question.a,
                isCorrect: isCorrect
            });
            
            if (isCorrect) {
                btn.classList.add('correct');
                gameState.streak++;
                
                const points = 50 + timeLeft + (gameState.streak * 5);
                gameState.totalPoints += points;
                showMessage(`✅ +${points} نقطة`);
            } else {
                btn.classList.add('wrong');
                gameState.streak = 0;
                showMessage('❌ خطأ');
                
                document.querySelectorAll('.option').forEach(b => {
                    if (b.textContent === question.a) {
                        b.classList.add('correct');
                    }
                });
            }
            
            updateStats();
            saveGame();
            
            setTimeout(() => {
                currentStep++;
                if (currentStep < 3) {
                    showQuestion(currentStep);
                } else {
                    finishLevel();
                }
            }, 1500);
        }

        // إنهاء المستوى
        function finishLevel() {
            const correctCount = currentAnswers.filter(a => a.isCorrect).length;
            const levelNum = currentQuestions[0].level;
            
            gameState.levelStars[levelNum] = correctCount;
            
            const levelBonus = correctCount * 100;
            gameState.totalPoints += levelBonus;
            
            if (correctCount >= 2 && levelNum === gameState.currentLevel && levelNum < 300) {
                gameState.currentLevel++;
            }
            
            saveGame();
            updateStats();
            
            // تشغيل الموسيقى حسب عدد النجوم
            playMusic(correctCount);
            
            // عرض رسالة حسب النتيجة
            if (correctCount === 3) {
                showMessage('🎵 إنجاز كامل! +50 نقطة إضافية');
                gameState.totalPoints += 50;
                updateStats();
                saveGame();
                document.getElementById('resultTitle').innerHTML = '🎉 إنجاز كامل! 🎉';
            } else if (correctCount === 2) {
                document.getElementById('resultTitle').innerHTML = '📊 جيد جداً';
            } else {
                document.getElementById('resultTitle').innerHTML = '📊 حاول مرة أخرى';
            }
            
            showResults();
        }

        // عرض النتائج
        function showResults() {
            const container = document.getElementById('resultsList');
            container.innerHTML = '';
            
            currentAnswers.forEach(ans => {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `
                    <div class="result-icon">${ans.isCorrect ? '✅' : '❌'}</div>
                    <div class="result-question">${ans.question}</div>
                    <div class="result-correct">${ans.correct}</div>
                `;
                container.appendChild(div);
            });
            
            quizModal.style.display = 'none';
            resultModal.style.display = 'flex';
        }

        // إغلاق النتائج
        function closeResults() {
            resultModal.style.display = 'none';
            buildLevels();
        }

        // تبديل الصوت
        function toggleSound() {
            gameState.soundEnabled = !gameState.soundEnabled;
            soundToggle.textContent = gameState.soundEnabled ? '🔊' : '🔇';
            saveGame();
            showMessage(gameState.soundEnabled ? '🔊 تم تشغيل الصوت' : '🔇 تم إيقاف الصوت');
        }

        // بدء اللعبة
        function startGame() {
            introScreen.style.transform = 'translateY(-100%)';
            setTimeout(() => {
                introScreen.style.display = 'none';
                statsBar.style.display = 'flex';
                levelsContainer.style.display = 'block';
            }, 500);
        }

        // شاشة البداية
        let progress = 0;
        const loadingInterval = setInterval(() => {
            progress += 10;
            document.getElementById('loadingProgress').style.width = progress + '%';
            if (progress >= 100) {
                clearInterval(loadingInterval);
                setTimeout(() => {
                    splashScreen.style.opacity = '0';
                    setTimeout(() => {
                        splashScreen.style.display = 'none';
                        introScreen.style.display = 'flex';
                    }, 500);
                }, 500);
            }
        }, 150);

        // أحداث
        document.getElementById('startGameBtn').onclick = startGame;
        document.getElementById('closeQuizBtn').onclick = () => {
            if (timerInterval) clearInterval(timerInterval);
            quizModal.style.display = 'none';
        };
        document.getElementById('nextBtn').onclick = closeResults;
        soundToggle.onclick = toggleSound;
        
        // بناء المستويات
        buildLevels();
        updateStats();
        soundToggle.textContent = gameState.soundEnabled ? '🔊' : '🔇';
    </script>
</body>
</html>
